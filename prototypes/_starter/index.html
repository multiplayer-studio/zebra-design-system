.acc-header { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: var(--accordion-header-height); border: 0; cursor: pointer; text-align: left;
  padding: var(--accordion-title-padding-y) var(--accordion-trailing-icon-padding-right) var(--accordion-title-padding-y) var(--accordion-title-padding-left);
  background: var(--accordion-container-background-enabled); color: var(--accordion-title-foreground); font: var(--accordion-title-font); }

/* ═════════════ Actions, menus & navigation aids ═════════════
   Built on the page's .btn / .icon / .checkbox / .radio / .seg. Context overrides are scoped

/* ── Button Group ── */
.btngrp { display: inline-flex; gap: var(--button-group-container-gap); }

  border-color: var(--button-group-inverse-item-border-color); }

  border: var(--breadcrumb-more-button-border-width) solid var(--breadcrumb-more-button-border-color); border-radius: var(--breadcrumb-more-button-radius-rounded); }
.bc-more .icon { font-size: var(--breadcrumb-more-button-icon-size); }

.bc-more:active { background: var(--breadcrumb-more-button-background-pressed); border-color: transparent; }

/* ── Pagination ── */
.pg { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pagination-container-gap); }
.pg-page { width: var(--pagination-page-width); height: var(--pagination-page-height); padding: var(--pagination-page-padding-y) var(--pagination-page-padding-x);
  font: var(--pagination-page-font); color: var(--pagination-page-foreground-enabled); background: transparent; border: 0; cursor: pointer;
  border-radius: var(--pagination-item-radius-rounded); }

.dm { position: relative; display: inline-block; width: calc(var(--spacing-11xl) * 2); }

.dm-panel { position: absolute; z-index: 2; top: 100%; left: 0; right: 0; display: flex; flex-direction: column; gap: var(--dropdown-menu-panel-gap);
  padding: var(--dropdown-menu-panel-padding); background: var(--dropdown-menu-item-background-enabled);
  border-radius: var(--dropdown-menu-panel-radius); box-shadow: var(--dropdown-menu-panel-elevation); }

.dm-item { display: flex; align-items: center; width: 100%; min-height: var(--dropdown-menu-item-height-medium); text-align: left; cursor: pointer;
  padding: var(--dropdown-menu-item-padding-y-medium) var(--dropdown-menu-item-padding-x-medium); gap: var(--dropdown-menu-item-gap-medium);
  font: var(--dropdown-menu-item-font-medium); color: inherit; background: var(--dropdown-menu-item-background-enabled); border: 0; }

.dm-item:hover, .dm-panel .dm-sel:hover { background: var(--dropdown-menu-item-background-hover); }
.dm-item:active, .dm-panel .dm-sel:active { background: var(--dropdown-menu-item-background-pressed); }
/* focus ring: dropdown menu defines none, so the shared Button ring is used (see notes) */
.dm-item:focus-visible { outline: var(--button-focus-ring-width) solid var(--button-focus-ring-color); outline-offset: calc(-1 * var(--button-focus-ring-width)); }
.dm-item:disabled, .dm-panel .dm-sel:has(input:disabled) { background: var(--dropdown-menu-item-background-disabled); color: var(--dropdown-menu-item-foreground-disabled); cursor: not-allowed; }

.dm-panel.lg .dm-item { padding: var(--dropdown-menu-item-padding-y-large) var(--dropdown-menu-item-padding-x-large); gap: var(--dropdown-menu-item-gap-large); font: var(--dropdown-menu-item-font-large); }
.dm-panel.lg .dm-item .icon { font-size: var(--dropdown-menu-item-icon-size-large); }
.dm-panel .dm-sel { display: flex; width: 100%; min-height: var(--dropdown-menu-selection-item-height); background: var(--dropdown-menu-item-background-enabled);
  padding: var(--dropdown-menu-selection-item-padding-y) var(--dropdown-menu-selection-item-padding-x); border-radius: var(--dropdown-menu-selection-item-radius); }
.dm-frame { position: relative; height: calc(var(--spacing-11xl) * 3); }
.dm-dirframe { position: relative; display: flex; justify-content: space-between; align-items: center; height: calc(var(--spacing-11xl) * 3); }
.dm-dirframe .dm { width: calc(var(--spacing-11xl) * 1.5); }

/* ── Empty State ── */
.es { display: flex; flex-direction: column; align-items: center; max-width: var(--empty-state-container-max-width); margin: 0 auto; text-align: center; }
.es-illu { display: grid; place-items: center; height: var(--empty-state-illustration-height); margin: var(--empty-state-illustration-margin-y) 0; }
.es-illu .icon { font-size: var(--empty-state-illustration-height); } /* placeholder for the illustration */
.es-content { margin-top: var(--empty-state-content-margin-top); }
.es-title { margin: var(--empty-state-title-margin-top) 0 var(--empty-state-title-margin-bottom); font: var(--empty-state-title-font); }
.es-desc { font: var(--empty-state-description-font); color: var(--empty-state-description-foreground); }

/* ===== Group: System banner, upload & stepper ===== */
.feedback-upload-sr { position: absolute; width: var(--spacing-0-5); height: var(--spacing-0-5); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- System Banner ---- */
.sysbanner-frame { padding: 0; overflow: hidden; }
.sysbanner-app { padding: var(--spacing-2xl); color: var(--main-subtle); font: var(--body-small); }
.sysbanner { --_bg: var(--system-banner-default-container-background); --_fg: var(--system-banner-default-content-foreground);
  display: flex; align-items: center; box-sizing: border-box; width: 100%; height: var(--system-banner-container-height);
  padding: var(--system-banner-container-padding-y) var(--system-banner-container-padding-x);
  background: var(--_bg); color: var(--_fg); border-radius: var(--system-banner-container-radius); font: var(--system-banner-text-font); }
.sysbanner.positive { --_bg: var(--system-banner-positive-container-background); --_fg: var(--system-banner-positive-content-foreground); }

.sysbanner.negative { --_bg: var(--system-banner-negative-container-background); --_fg: var(--system-banner-negative-content-foreground); }
.sysbanner .icon { font-size: var(--system-banner-icon-size); color: var(--_fg); }
.sysbanner-main { flex: 1; min-width: 0; display: flex; align-items: center; height: var(--system-banner-content-height); }

.sysbanner-main .icon + .sysbanner-text { margin-left: var(--system-banner-leading-icon-gap); }
.sysbanner-text { min-width: 0; line-height: var(--system-banner-text-line-height); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sysbanner-trailing { flex: none; margin-left: var(--system-banner-trailing-icon-gap); display: grid; place-items: center;
  width: var(--system-banner-container-height); height: var(--system-banner-container-height); margin-right: calc(-1 * var(--system-banner-container-padding-x));
  padding: 0; border: 0; background: transparent; cursor: pointer; }
.sysbanner-trailing:focus-visible { outline: var(--button-focus-ring-width) solid var(--button-focus-ring-color); outline-offset: calc(-1 * var(--button-focus-ring-width)); }

/* ---- Upload Item ---- */
.uitem-list { display: flex; flex-direction: column; width: 100%; }
.uitem { display: flex; align-items: center; gap: var(--spacing-medium); box-sizing: border-box; width: 100%;
  min-height: var(--upload-item-container-min-height); padding: var(--spacing-small) var(--upload-item-container-padding-x);
  background: var(--upload-item-default-container-background); }
.uitem:hover { background: var(--upload-item-default-container-background-hover); }
.uitem.is-completed, .uitem.is-completed:hover { background: var(--upload-item-completed-container-background); }
.uitem.is-error, .uitem.is-error:hover { background: var(--upload-item-error-container-background); }
.uitem-thumb { flex: none; display: grid; place-items: center; width: var(--spacing-6xl); height: var(--spacing-6xl); } /* mock thumbnail: icon stands in for an image */

.uitem-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-minimum); }
.uitem-title { font-weight: var(--upload-item-title-font-weight); font-size: var(--upload-item-title-font-size); line-height: var(--spacing-xl);
  color: var(--upload-item-title-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uitem-sub { font-weight: var(--upload-item-subtitle-font-weight); font-size: var(--upload-item-subtitle-font-size); line-height: var(--spacing-large);
  color: var(--upload-item-default-subtitle-foreground); }
.uitem.is-completed .uitem-sub { color: var(--upload-item-completed-subtitle-foreground); }
.uitem.is-error .uitem-sub { color: var(--upload-item-error-subtitle-foreground); }
.uitem-trailing { flex: none; display: flex; align-items: center; gap: var(--spacing-small); }
.uitem.is-completed .uitem-status { color: var(--upload-item-completed-icon-foreground); }
.uitem.is-error .uitem-status { color: var(--upload-item-error-icon-foreground); }
.uitem-close { display: grid; place-items: center; width: var(--touch-target-recommended); height: var(--touch-target-recommended);
  padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: var(--button-container-radius-rounded); }
.uitem-close:focus-visible { outline: var(--button-focus-ring-width) solid var(--button-focus-ring-color); }

/* ---- File Upload ---- */
.fileupload-zone { display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; width: 100%;
  gap: var(--file-upload-container-gap); padding: var(--file-upload-container-padding);
  border: var(--file-upload-container-border-width) dashed var(--file-upload-container-border-color-enabled);
  border-radius: var(--file-upload-container-radius-rounded); background: transparent; }
.fileupload-zone.is-sharp { border-radius: var(--file-upload-container-radius-sharp); }

.fileupload-zone.is-error { border-color: var(--file-upload-container-border-color-error); }
.fileupload-text { display: flex; flex-direction: column; align-items: center; gap: var(--file-upload-text-gap); }
.fileupload-headline { font: var(--file-upload-headline-font); }
.fileupload-or, .fileupload-caption { font: var(--file-upload-caption-font); color: var(--file-upload-caption-foreground); padding: 0 var(--file-upload-caption-padding-x); }
.fileupload-zone.is-error .fileupload-caption { color: var(--file-upload-caption-foreground-error); }
.fileupload-live { display: flex; flex-direction: column; gap: var(--spacing-large); width: 100%; }
.fileupload-files { border-radius: var(--file-upload-container-radius-rounded); overflow: hidden; }

/* ---- Stepper ---- */
.stepper-scroll { overflow-x: auto; max-width: 100%; padding-bottom: var(--spacing-small); }
.stepper-row { display: flex; align-items: stretch; width: max-content; }
.stepper-h { display: flex; align-items: flex-start; list-style: none; margin: 0; padding: 0; min-height: var(--stepper-container-height); }

  background: var(--voice-call-popup-container-background); border: var(--button-outline-subtle-container-border-width) solid var(--voice-call-popup-container-border-color);
  border-radius: var(--voice-call-popup-container-radius-rounded); box-shadow: var(--elevation-4); text-align: center; }

/* Voice Memo (organism) — Bottom Sheet tokens; works for any [data-vm] container (own frame or the chat phone) */
.vm-frame { position: relative; height: calc(var(--spacing-11xl) * 4); overflow: hidden; }

  transition: opacity var(--bottom-sheet-container-duration) var(--easing-standard); }

  padding: var(--bottom-sheet-container-padding-top) var(--bottom-sheet-container-padding-x) var(--spacing-2xl);
  background: var(--bottom-sheet-container-background); border-radius: var(--bottom-sheet-container-radius) var(--bottom-sheet-container-radius) 0 0;

.vm-wave > span { flex: 1; max-width: var(--spacing-minimum); min-height: var(--spacing-0-5); height: calc(var(--spacing-6xl) * var(--_h, 0.1));
  background: var(--button-primary-container-background-enabled); border-radius: var(--bottom-sheet-handle-radius); }
.vm-actions { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--spacing-large); }
.vm-actions > * { min-width: var(--button-touch-target-size-recommended); }

/* Message Input Field (molecule) — composes Text Input (multi-line) + Icon Buttons */
.mif { display: flex; align-items: flex-end; gap: var(--spacing-small); padding: var(--spacing-small); }

.mif-input { flex: 1; min-width: 0; width: auto; }

.mif-input textarea { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; background: none; resize: none; display: block;
  font: var(--text-input-value-font-medium); color: var(--text-input-value-foreground); caret-color: var(--text-input-caret-foreground);
  max-height: calc(var(--spacing-2xl) * 4); overflow-y: auto; }

/* Chat (organism) */
.chat-phone { position: relative; display: flex; flex-direction: column; overflow: hidden; width: 100%;
  max-width: calc(var(--spacing-11xl) * 4); height: calc(var(--spacing-11xl) * 6.5);
  background: var(--surface-default); border: var(--border-size-small) solid var(--border-subtle); border-radius: var(--radius-rounded); }

  height: var(--top-app-bar-container-height); padding: 0 var(--top-app-bar-container-padding-x); background: var(--top-app-bar-container-background); }
.chat-bar-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--top-app-bar-avatar-gap);
  font: var(--top-app-bar-title-font); color: var(--top-app-bar-title-foreground); }

.chat-meta { display: inline-flex; align-items: center; gap: var(--spacing-minimum); font: var(--body-x-small); color: var(--chat-timestamp-foreground); }

.chat-tools { display: flex; flex-wrap: wrap; gap: var(--spacing-medium); align-items: center; margin-top: var(--spacing-large); }

.vm-state .indicator[hidden] { display: none; }

/* ═════════ Lists & data (draft molecules/organisms: own tokens + composed children; layout from the spacing scale) ═════════ */
.lrow-sr { position: absolute; width: var(--border-size-small); height: var(--border-size-small); overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Shared list row, built on the List Item tokens ── */

.lrow-list > li:not(:last-child) { border-bottom: var(--list-item-divider-border-width) solid var(--list-item-divider-border-color); }
.lrow { --_hover: transparent; --_press: transparent; --_ring-w: 0; --_ring-c: transparent;
  --_name-font: var(--list-item-headline-font); --_sub: var(--main-subtle); /* placeholder: no secondary-text token on these drafts */
  position: relative; display: flex; align-items: center; gap: var(--list-item-container-gap); width: 100%; min-height: var(--list-item-container-height);
  padding: var(--spacing-medium) var(--list-item-container-padding-x); margin: 0; border: 0; background: transparent;
  color: var(--list-item-headline-foreground); font: var(--body-medium); text-align: left; }

.lrow-sub { font: var(--body-small); color: var(--_sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow-time { font: var(--body-x-small); color: var(--_sub); white-space: nowrap; }
.lrow-meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: var(--spacing-minimum); }
.lrow-status { display: inline-flex; align-items: center; }
.lrow-status .icon { font-size: var(--icon-size-small); color: var(--_sub); }

/* Chat List Item */
.chat-li { --_hover: var(--chat-list-item-row-background-hover); --_press: var(--chat-list-item-row-background-pressed);
  --_ring-w: var(--chat-list-item-focus-ring-width); --_ring-c: var(--chat-list-item-focus-ring-color); --_name-font: var(--body-medium); }

/* Contact List Item: the row is not a control; the open area and the action buttons are */

  padding-block: var(--spacing-small); }

  padding: 0; margin: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.lrow-open:is(:focus-visible, .is-focus) { outline: var(--contact-list-item-focus-ring-width) solid var(--contact-list-item-focus-ring-color); outline-offset: calc(-1 * var(--contact-list-item-focus-ring-width)); }
.lrow-actions { flex: none; display: flex; }

/* Notification List Item */
.notif-li { --_hover: var(--notification-list-item-row-background-hover); --_press: var(--notification-list-item-row-background-pressed);
  --_ring-w: var(--notification-list-item-focus-ring-width); --_ring-c: var(--notification-list-item-focus-ring-color); --_name-font: var(--body-medium);
  align-items: flex-start; }
.notif-li.unread { --_name-font: var(--list-item-headline-font); }
.notif-li .lrow-main { gap: var(--spacing-minimum); }
.lrow-msg { font: var(--_name-font); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }

/* States strip */
.lrow-state { display: flex; flex-direction: column; gap: var(--spacing-small); }
.lrow-state .lrow-list { max-width: none; }

/* ── Vertical Speed Scroller ── */
.vss { position: relative; width: calc(var(--spacing-11xl) * 4); height: calc(var(--touch-target-min) * 27);
  border: var(--list-item-divider-border-width) solid var(--list-item-divider-border-color); overflow: hidden; }
.vss-list { height: 100%; overflow-y: auto; position: relative; padding-right: var(--touch-target-recommended); }

.vss-head { position: sticky; top: 0; z-index: 1; margin: 0; padding: var(--spacing-minimum) var(--list-item-container-padding-x);
  font: var(--label-medium); background: var(--surface-cool); /* placeholder: no header-background token */ }
.vss-list ul { margin: 0; padding: 0; list-style: none; }
.vss-list li:not(:last-child) { border-bottom: var(--list-item-divider-border-width) solid var(--list-item-divider-border-color); }
.vss-rail { position: absolute; top: 0; right: 0; bottom: 0; width: var(--touch-target-recommended); display: flex; flex-direction: column; touch-action: none; user-select: none; }
.vss-rail button, .vss-sample { flex: 1; min-height: var(--touch-target-min); display: grid; place-items: center; padding: 0; border: 0; background: transparent;
  font: var(--body-x-small); color: var(--main-subtle); /* placeholder: default letter colour has no token */ cursor: pointer; }
.vss-rail button:focus-visible { outline: var(--vertical-speed-scroller-focus-ring-width) solid var(--vertical-speed-scroller-focus-ring-color); outline-offset: calc(-1 * var(--vertical-speed-scroller-focus-ring-width)); }
.vss-rail button:is(.is-active, :active), .vss-sample.is-active { font: var(--label-medium); color: var(--vertical-speed-scroller-index-label-foreground-pressed); }
.vss-rail button[aria-disabled="true"], .vss-sample.is-off { color: var(--main-disabled); cursor: default; } /* placeholder colour */
.vss-sample { flex: none; width: var(--touch-target-recommended); }
.vss-bubble { position: absolute; right: calc(var(--touch-target-recommended) + var(--spacing-small)); transform: translateY(-50%);
  min-width: var(--spacing-9xl); height: var(--spacing-9xl); display: grid; place-items: center; border-radius: var(--radius-full);
  font: var(--display-medium); color: var(--main-inverse); background: var(--surface-primary); /* placeholder: no bubble tokens */ }
.vss-h3 { font: var(--h5); }

/* ── Data Table ── */
.dtab { --_pad-x: var(--spacing-large); --_pad-y: var(--data-table-container-spacing-minimum);
  background: var(--data-table-container-background); color: var(--data-table-content-foreground);
  border: var(--border-size-small) solid var(--data-table-container-border-color); border-radius: var(--data-table-container-radius-rounded); overflow: hidden; }
.dtab.dtab-square { border-radius: var(--radius-none); }
.dtab-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-medium); padding: var(--spacing-medium) var(--_pad-x);
  border-bottom: var(--border-size-small) solid var(--data-table-divider-border-color); }
.dtab-search { flex: 1; min-width: calc(var(--spacing-11xl) * 2); max-width: calc(var(--spacing-11xl) * 4); }
.dtab-count { margin-left: auto; font: var(--body-small); color: var(--data-table-content-foreground-subtle); }
.dtab-scroll { overflow-x: auto; }
.dtab-table { width: 100%; border-collapse: collapse; font: var(--body-medium); }
.dtab-table th, .dtab-table td { padding: var(--_pad-y) var(--_pad-x); text-align: left; vertical-align: middle; white-space: nowrap;
  border-bottom: var(--border-size-small) solid var(--data-table-divider-border-color); }
.dtab-table thead th { font: var(--data-table-header-font); color: var(--data-table-content-foreground);
  border-bottom: var(--border-size-small) solid var(--data-table-container-border-color); }
.dtab-table thead th:not(:has(.dtab-sort)):not(.dtab-check):not(.dtab-act) { padding-block: var(--spacing-small); }
.dtab-table tbody th[scope="row"] { font: var(--body-medium); }
.dtab-table tbody tr { background: var(--data-table-row-background-enabled); }
.dtab-table tbody tr:hover { background: var(--data-table-row-background-hover); }

.dtab-table .dtab-num { text-align: right; font-variant-numeric: tabular-nums; }
.dtab-table .dtab-check { width: var(--spacing-8xl); padding-right: 0; }
.dtab-table .dtab-check .checkbox { display: flex; }
.dtab-table .dtab-act { width: var(--spacing-8xl); text-align: right; }
.dtab-table .tag { vertical-align: middle; }
.dtab-tags { display: inline-flex; gap: var(--spacing-small); }
.dtab-sub { color: var(--data-table-content-foreground-subtle); }
.dtab-sort { display: inline-flex; align-items: center; gap: var(--spacing-minimum); min-height: var(--touch-target-min); padding: 0; margin: 0; border: 0;
  background: transparent; color: inherit; font: inherit; cursor: pointer; border-radius: var(--data-table-container-radius-rounded); }
.dtab-num .dtab-sort { flex-direction: row-reverse; }
.dtab-sort .icon { font-size: var(--icon-size-small); color: var(--data-table-content-foreground-subtle); }
th[aria-sort="ascending"] .dtab-sort .icon, th[aria-sort="descending"] .dtab-sort .icon { color: var(--data-table-content-foreground); }
.dtab-sort:focus-visible { outline: var(--button-focus-ring-width) solid var(--button-focus-ring-color); } /* table has no focus token; borrows the button's */
.dtab-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-medium);
  padding: var(--spacing-small) var(--_pad-x); border-top: var(--border-size-small) solid var(--data-table-divider-border-color); }
.dtab-range { font: var(--body-small); color: var(--data-table-content-foreground-subtle); }
.dtab-empty td { text-align: center; color: var(--data-table-content-foreground-subtle); }

/* Pagination (built from the pagination tokens, scoped to the table footer) */
.dtab-pg { display: flex; align-items: center; gap: var(--pagination-container-gap); }
.dtab-pg-page { min-width: var(--pagination-page-width); height: var(--pagination-page-height); padding: var(--pagination-page-padding-y) var(--pagination-page-padding-x);
  display: grid; place-items: center; border: 0; background: transparent; color: var(--pagination-page-foreground-enabled);
  font: var(--pagination-page-font); border-radius: var(--pagination-item-radius-rounded); cursor: pointer; }
.dtab-pg-page:hover { background: var(--pagination-page-background-hover); }
.dtab-pg-page:active { background: var(--pagination-page-background-pressed); }
.dtab-pg-page[aria-current="page"] { background: var(--pagination-page-background-selected); color: var(--pagination-page-foreground-selected); }
.dtab-pg-page:focus-visible { outline: var(--pagination-focus-ring-width) solid var(--pagination-focus-ring-color); }
.dtab-pg .dtab-pg-ell { font-size: var(--pagination-ellipsis-icon-size); }

/* ── Filter Selection Bar ── */
.fsb { display: flex; align-items: center; gap: var(--filter-chip-group-gap); }
.fsb-scroll { flex: 1; min-width: 0; display: flex; gap: var(--filter-chip-group-gap); overflow-x: auto; padding: var(--spacing-minimum);
  border-radius: var(--filter-selection-bar-container-radius-rounded); scrollbar-width: thin; }
.fsb-scroll .filter-chip { flex: none; white-space: nowrap; }
.fsb-result { margin: var(--spacing-medium) 0 var(--spacing-small); }
.fsb-list { max-width: calc(var(--spacing-11xl) * 6); }
.fsb-list .list-item[hidden] { display: none; }

/* ── Gantt View ── */
.gv { --gv-day: var(--spacing-large); --gv-step: 7; --gv-task: calc(var(--spacing-11xl) * 2.5); --gv-row: var(--gantt-view-touch-target-size-recommended);
  --gv-head: var(--spacing-3xl);
  background: var(--gantt-view-container-background); color: var(--gantt-view-content-foreground);
  border: var(--border-size-small) solid var(--gantt-view-container-border-color); border-radius: var(--gantt-view-container-radius-rounded); overflow: hidden; }
.gv[data-scale="day"] { --gv-day: var(--spacing-5xl); --gv-step: 1; }
.gv[data-scale="month"] { --gv-day: var(--spacing-1-5); }
.gv-tools { display: flex; flex-wrap: wrap; gap: var(--spacing-medium); align-items: center; justify-content: space-between;
  padding: var(--spacing-medium) var(--spacing-large); border-bottom: var(--border-size-small) solid var(--gantt-view-container-border-color); }
.gv-title { font: var(--label-large); }
.gv-scroll { overflow: auto; }
.gv-scroll:focus-visible { outline: var(--gantt-view-focus-ring-width) solid var(--gantt-view-focus-ring-color); outline-offset: calc(-1 * var(--gantt-view-focus-ring-width)); }
.gv-canvas { position: relative; width: calc(var(--gv-task) + var(--gv-day) * var(--gv-days)); min-width: 100%; }
.gv-row { display: grid; grid-template-columns: var(--gv-task) 1fr; height: var(--gv-row); border-bottom: var(--border-size-small) solid var(--gantt-view-container-border-color); }
.gv-row.gv-head { height: auto; }
.gv-row:last-child { border-bottom: 0; }
.gv-task { position: sticky; left: 0; z-index: 3; display: flex; align-items: center; gap: var(--spacing-small); min-width: 0;
  padding: 0 var(--list-item-container-padding-x); background: var(--gantt-view-container-background);
  border-right: var(--border-size-small) solid var(--gantt-view-container-border-color); }
.gv-task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gv-task-name { font: var(--label-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-task-sub { display: flex; align-items: center; gap: var(--spacing-minimum); font: var(--body-x-small); color: var(--gantt-view-content-foreground-subtle); white-space: nowrap; }
.gv-task-sub .icon { font-size: var(--icon-size-small); color: inherit; }
.gv-head .gv-task { align-items: flex-end; padding-bottom: var(--spacing-minimum); font: var(--label-small); color: var(--gantt-view-content-foreground-subtle); }
.gv-track { position: relative; background-image: linear-gradient(to right, var(--gantt-view-container-border-color) var(--border-size-small), transparent var(--border-size-small));
  background-size: calc(var(--gv-day) * var(--gv-step)) 100%; }
.gv-head .gv-track { display: flex; flex-direction: column; background-image: none; }
.gv-hrow { position: relative; height: var(--gv-head); }
.gv-hrow + .gv-hrow { border-top: var(--border-size-small) solid var(--gantt-view-container-border-color); }
.gv-hcell { position: absolute; top: 0; bottom: 0; left: calc(var(--gv-day) * var(--s)); width: calc(var(--gv-day) * var(--l)); display: flex; align-items: center;
  padding-left: var(--spacing-minimum); border-left: var(--border-size-small) solid var(--gantt-view-container-border-color);
  font: var(--label-small); color: var(--gantt-view-content-foreground-subtle); overflow: hidden; white-space: nowrap; }
.gv-today { position: absolute; z-index: 2; top: 0; bottom: 0; left: calc(var(--gv-task) + var(--gv-day) * var(--gv-today)); width: var(--border-size-medium);
  background: var(--gantt-view-content-foreground); pointer-events: none; }
