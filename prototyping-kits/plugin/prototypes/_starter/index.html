/* Input (molecule) — label, hint, error, input, stacked (the hint sits above the input and stays while the error shows).
   Replaces Text, Password, Date and Time Input.
   <div class="text-input [sm|lg] [gradient|ghost] [shape-sharp|shape-full] [invalid] [read-only] [disabled]">
     <label class="ti-label" for="x">Name [<span class="req">(required)</span>]</label>
     [<div class="ti-hint" id="x-hint"><span class="icon" aria-hidden="true">info</span>Hint</div>]
     [<div class="ti-hint error" id="x-err"><span class="icon" aria-hidden="true">error</span>How to fix it</div>]  (only while invalid)
     <div class="ti-field">[<span class="icon" aria-hidden="true">email</span>]<input id="x" placeholder="Placeholder" aria-describedby="x-hint x-err" [aria-invalid="true"]>
       [<span class="ti-trailing">[<button class="fi-trail fi-scan" type="button" aria-label="Scan"><span class="icon" aria-hidden="true">barcode</span></button>]
         <button class="ti-clear" type="button" aria-label="Clear …"><span class="icon" aria-hidden="true">cancel</span></button>
         [<span class="divider vertical" aria-hidden="true"></span><button class="fi-trail" type="button" aria-label="…"><span class="icon" aria-hidden="true">visibility_off</span></button>]</span>]</div>
   </div>
   Scan (text and number content) adds the barcode control; order while typing: scan, clear, divider, type control.
   States from the DOM: focused + empty = focus (heavy border); focused + value = typing (clear control shown); blurred + value = filled.
   The clear control needs a placeholder on the input to know when it is empty. Old names kept: .error = .invalid, .fi-sharp = .shape-sharp.
   --_bc / --_bw are the interactive border; --_lock-c / --_lock-w (set by invalid, read-only, disabled, ghost) win over them. */
.text-input { display: flex; flex-direction: column; gap: var(--input-stack-gap); width: var(--input-container-width); max-width: 100%; }
.ti-field { --_bg: var(--input-container-background-enabled); --_bc: var(--input-container-border-color-enabled); --_bw: var(--input-container-border-width);
  display: flex; align-items: center; gap: var(--input-container-gap); box-sizing: border-box; width: 100%;
  min-height: var(--input-container-height-medium); padding: var(--input-container-padding-y) var(--input-container-padding-x);
  border-radius: var(--input-container-radius-rounded); background: var(--_bg);
  box-shadow: inset 0 0 0 var(--_lock-w, var(--_bw)) var(--_lock-c, var(--_bc)); }
.ti-field:where(:not(:focus-within):has(input:not(:placeholder-shown))) { --_bc: var(--input-container-border-color-filled); } /* filled */
.ti-field:hover { --_bc: var(--input-container-border-color-hover); }
.ti-field:focus-within { --_bc: var(--input-container-border-color-focused); --_bw: var(--input-container-border-width-focused); }
.ti-field:focus-within:has(input:not(:placeholder-shown)) { --_bc: var(--input-container-border-color-typing); --_bw: var(--input-container-border-width); }
.ti-field input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 var(--input-text-padding-x); background: none;
  font: var(--input-value-font-medium); color: var(--input-value-foreground); caret-color: var(--input-cursor-foreground); }
.ti-field input::placeholder { color: var(--input-placeholder-foreground); opacity: 1; }
.ti-field .icon { font-size: var(--input-icon-size-medium); color: var(--input-icon-foreground); }
/* trailing group: clear (typing only), divider, type control */
.ti-trailing { display: inline-flex; align-items: center; gap: var(--input-trailing-gap); flex: none; }
.ti-trailing .divider { display: none; align-self: center; height: var(--input-divider-height); min-height: 0; }
.ti-clear, .fi-trail { position: relative; display: inline-flex; flex: none; border: 0; padding: 0; background: none; color: inherit; cursor: pointer; }
.ti-clear::after, .fi-trail::after { content: ""; position: absolute; inset: calc(var(--input-container-padding-y) * -1); } /* hit area */
.ti-clear:focus-visible, .fi-trail:focus-visible { outline: var(--input-control-focus-ring-width) solid var(--input-control-focus-ring-color); }
.fi-trail:disabled { cursor: not-allowed; }
.ti-clear { display: none; }
.ti-field:focus-within:has(input:not(:placeholder-shown):not([readonly])) .ti-clear { display: inline-flex; }
.ti-field:focus-within:has(input:not(:placeholder-shown):not([readonly])) .ti-trailing:has(.divider + .fi-trail) .divider { display: block; }
/* native controls replaced by ours */
.ti-field input::-webkit-calendar-picker-indicator { display: none; }
.ti-field input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.ti-field input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.ti-field input[type="number"]::-webkit-inner-spin-button, .ti-field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
/* flavours */
.text-input.ghost .ti-field { --_bg: var(--input-ghost-container-background-enabled); --_bc: var(--input-ghost-container-border-color); --_lock-w: var(--input-ghost-container-border-width); }
.text-input.ghost .ti-field:focus-within { --_lock-w: initial; }
.text-input.ghost.disabled .ti-field { --_bg: var(--input-ghost-container-background-disabled); }
.text-input.gradient .ti-field { --_bg: var(--input-gradient-container-background-enabled); }
.text-input.gradient .ti-field:hover:not(:focus-within) { --_bc: var(--input-gradient-container-border-color-hover); }
.text-input.gradient .ti-field:focus-within:has(input:not(:placeholder-shown)) { --_bc: var(--input-gradient-container-border-color-typing); }
/* resting and filled gradient border: a 90° gradient in the border box under a padding-box fill */
.text-input.gradient:not(.invalid, .error, .read-only, .disabled) .ti-field:not(:hover, :focus-within) { --_bc: transparent;
  border: var(--_bw) solid transparent; padding: calc(var(--input-container-padding-y) - var(--_bw)) calc(var(--input-container-padding-x) - var(--_bw));
  background: linear-gradient(var(--_bg), var(--_bg)) padding-box,
    linear-gradient(90deg, var(--input-gradient-container-border-color-start), var(--input-gradient-container-border-color-end)) border-box; }
/* form-set states */
.text-input:is(.invalid, .error), .ti-field:has(input[aria-invalid="true"]) { --_lock-c: var(--input-container-border-color-invalid); }
.text-input.read-only, .ti-field:has(input[readonly]) { --_lock-c: var(--input-container-border-color-read-only); }
.text-input.disabled .ti-field, .ti-field:has(input:disabled) { --_bg: var(--input-container-background-disabled); --_lock-c: var(--input-container-border-color-disabled); }
:is(.text-input.disabled .ti-field, .ti-field:has(input:disabled)) :is(input, .icon) { color: var(--input-value-foreground-disabled); }
:is(.text-input.disabled .ti-field, .ti-field:has(input:disabled)) .icon { color: var(--input-icon-foreground-disabled); }
:is(.text-input.disabled .ti-field, .ti-field:has(input:disabled)) :is(.ti-clear, .fi-trail) { cursor: not-allowed; }
/* sizes */
.text-input.sm .ti-field { min-height: var(--input-container-height-small); }
.text-input.sm .ti-field input { font: var(--input-value-font-small); }
.text-input.sm .ti-field .icon { font-size: var(--input-icon-size-small); }
.text-input.lg .ti-field { min-height: var(--input-container-height-large); }
.text-input.lg .ti-field input { font: var(--input-value-font-large); }
.text-input.lg .ti-field .icon { font-size: var(--input-icon-size-large); }
/* shapes */
:is(.text-input.shape-sharp, .fi-sharp, [data-shape="sharp"]) .ti-field { border-radius: var(--input-container-radius-sharp); }
:is(.text-input.shape-full, [data-shape="full"]) .ti-field { border-radius: var(--input-container-radius-full); }

/* Input Chip (molecule) — <span class="chips-input [sharp] [disabled]">[<span class="avatar xxxs …" aria-hidden="true">AB</span>]<span class="chips-input-label">Label</span>
   <button class="chips-input-close" aria-label="Remove Label"><span class="icon">close</span></button></span>.
   The chip shows focus while its remove button has it. Border is an inset shadow so dropping it never changes the size.
   The label is user data, so it may truncate: give it title="full text"; it shows in full while the chip has focus. Height is a minimum. */
.chips-input { display: inline-flex; align-items: center; gap: var(--input-chip-container-gap); box-sizing: border-box; max-width: 100%; flex: none;
  min-height: var(--input-chip-container-height); padding: var(--input-chip-container-padding-y) var(--input-chip-container-padding-x);
  border-radius: var(--input-chip-container-radius-rounded); background: var(--input-chip-container-background-enabled);
  box-shadow: inset 0 0 0 var(--input-chip-container-border-width) var(--input-chip-container-border-color);
  color: var(--input-chip-label-foreground); font: var(--input-chip-label-font); }
.chips-input.sharp { border-radius: var(--input-chip-container-radius-sharp); }
.chips-input:hover { background: var(--input-chip-container-background-hover); }

/* Key Value List (molecule, draft) — a read-only record. Markup:
   <section class="kvl [stacked|side] [plain]">
     [<div class="kvl-head"><h3 class="kvl-title">Printer ZT411</h3>[<button class="btn text sm">Edit</button>]</div>]
     <dl class="kvl-rows">
       <div class="kvl-row"><dt class="kvl-key">Serial number</dt><dd class="kvl-value mono">D4J21-0045</dd>
         [<dd class="kvl-action"><button class="btn text sm" aria-label="Change serial number">Change</button></dd>]</div>
       <div class="kvl-row"><dt class="kvl-key">Last service</dt><dd class="kvl-value missing"><span aria-hidden="true">—</span><span class="kvl-sr">No data</span></dd>…</div>
     </dl></section>
   Keys take the width of the longest key up to the max, then wrap (a subgrid shares the column). .plain drops the row dividers.
   Auto layout stacks key above value on compact screens (the 599px query mirrors --breakpoint-medium-min); .stacked forces stacking, .side keeps key and value side by side. */
.kvl { display: flex; flex-direction: column; gap: var(--key-value-list-title-gap); }
.kvl + .kvl { margin-top: var(--key-value-list-block-gap); }

.kvl-title { margin: 0; font: var(--key-value-list-title-font); color: var(--key-value-list-title-foreground); }
.kvl-rows { display: grid; grid-template-columns: fit-content(var(--key-value-list-key-max-width)) minmax(0, 1fr) auto; margin: 0; }
.kvl-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; column-gap: var(--key-value-list-row-gap);
  min-height: var(--key-value-list-row-min-height); padding: var(--key-value-list-row-padding-y) 0; box-sizing: border-box;
  border-bottom: var(--divider-line-thickness) solid var(--divider-line-color); }
.kvl-row:last-child, .kvl.plain .kvl-row { border-bottom: 0; }
.kvl-key { font: var(--key-value-list-key-font); color: var(--key-value-list-key-foreground); overflow-wrap: anywhere; }
.kvl-value { grid-column: 2; margin: 0; font: var(--key-value-list-value-font); color: var(--key-value-list-value-foreground); overflow-wrap: anywhere; }
.kvl-value.mono { font: var(--key-value-list-value-font-mono); }
.kvl-value.missing { color: var(--key-value-list-missing-foreground); }
.kvl-action { grid-column: 3; margin: 0; justify-self: end; }
.kvl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.kvl.stacked .kvl-rows { grid-template-columns: minmax(0, 1fr) auto; }
.kvl.stacked .kvl-row { row-gap: var(--key-value-list-stack-gap); }
.kvl.stacked :is(.kvl-key, .kvl-value) { grid-column: 1; }
.kvl.stacked .kvl-action { grid-column: 2; grid-row: 1 / span 2; }
@media (max-width: 599px) {
  .kvl:not(.side) .kvl-rows { grid-template-columns: minmax(0, 1fr) auto; }
  .kvl:not(.side) .kvl-row { row-gap: var(--key-value-list-stack-gap); }
  .kvl:not(.side) :is(.kvl-key, .kvl-value) { grid-column: 1; }
  .kvl:not(.side) .kvl-action { grid-column: 2; grid-row: 1 / span 2; } }

/* List Item (molecule, draft) — generic row: leading, label + 1–3 lines of supporting text, one trailing value / status / control.
   Not .list-item: that class is a Menu Item alias (date picker presets, speed scroller). Markup:
   <ul class="list-rows [divided] [sharp]">
     open:   <li class="list-row [two|three] [is-selected]"><span class="list-row-leading"><span class="icon" aria-hidden="true">print</span></span>
               <span class="list-row-main"><a class="list-row-label list-row-action" href="…" [aria-disabled="true"]>Label</a>
                 <span class="list-row-supporting">Supporting text</span></span>
               <span class="list-row-trailing"><span class="list-row-value">12 jobs</span><span class="icon" aria-hidden="true">chevron_right</span></span></li>
     select / toggle: <li><label class="list-row"><span class="list-row-leading"><span class="checkbox md"><input type="checkbox">…</span></span>
               <span class="list-row-main"><span class="list-row-label">Label</span>…</span>[<span class="list-row-trailing"><span class="switch">…</span></span>]</label></li>
     static: <li class="list-row">…no .list-row-action…</li></ul>
   The action's ::after stretches over the whole row, so the row is one target; anything in .list-row-trailing that is a control
   sits above it as a separate target. Heights are minimums: text wraps. Middle truncation of created names needs script (5.30). */
.list-rows { list-style: none; margin: 0; padding: 0; }

  position: relative; box-sizing: border-box; display: flex; align-items: center; gap: var(--list-item-container-gap); width: 100%;
  min-height: var(--list-item-container-min-height-one-line); padding: var(--list-item-container-padding-y) var(--list-item-container-padding-x);
  margin: 0; border-radius: var(--list-item-container-radius-rounded); background: var(--_bg); color: var(--_fg);
  transition: background-color var(--list-item-container-transition); }
:is(.list-rows.sharp, [data-shape="sharp"]) .list-row, .list-row.sharp { border-radius: var(--list-item-container-radius-sharp); }
.list-row.two { min-height: var(--list-item-container-min-height-two-line); }
.list-row.three { --_clamp: 3; align-items: flex-start; min-height: var(--list-item-container-min-height-three-line); }
.list-row-leading, .list-row-trailing { flex: none; display: inline-flex; align-items: center; gap: var(--list-item-trailing-gap); }
.list-row .icon { font-size: var(--list-item-icon-size); color: var(--_ic); }

.list-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--list-item-text-gap); }
.list-row-label { font: var(--list-item-label-font); color: var(--_fg); text-decoration: none; overflow-wrap: anywhere; }
.list-row-supporting { font: var(--list-item-supporting-font); color: var(--_sub);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--_clamp); line-clamp: var(--_clamp); overflow: hidden; }
.list-row-value { font: var(--list-item-value-font); color: var(--list-item-value-foreground); white-space: nowrap; }

.list-row-action::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }

/* interaction */
.list-row:is(label, :has(.list-row-action)):hover { --_bg: var(--list-item-container-background-hover); }
.list-row:is(label, :has(.list-row-action)):active { --_bg: var(--list-item-container-background-pressed); }
.list-row:is(:has(.list-row-action:focus-visible), label:has(input:focus-visible)) {
  outline: var(--list-item-focus-ring-width) solid var(--list-item-focus-ring-color); outline-offset: calc(-1 * var(--list-item-focus-ring-width)); }
label.list-row input:focus-visible + :is(.cb-box, .rb-ring, .sw-track) { outline: 0; } /* the ring moves to the row */
.list-row-action:focus-visible { outline: 0; }
/* selected: tint plus a leading-edge bar, so selection shows by shape too */
.list-row:is(.is-selected, [aria-selected="true"], :has(.list-row-leading input:checked)) { --_bg: var(--list-item-container-background-selected); }
.list-row:is(.is-selected, [aria-selected="true"], :has(.list-row-leading input:checked))::before { content: ""; position: absolute;
  inset-block: 0; inset-inline-start: 0; width: var(--list-item-selected-indicator-width); background: var(--list-item-selected-indicator-color); border-radius: inherit; }

  --_fg: var(--list-item-label-foreground-disabled); --_sub: var(--list-item-supporting-foreground-disabled); --_ic: var(--list-item-icon-foreground-disabled); }
.list-row.is-disabled, .list-row-action[aria-disabled="true"], label.list-row:has(input:disabled) { cursor: not-allowed; }

.list-rows.divided > li:not(:last-child) > .list-row, .list-rows.divided > .list-row:not(:last-child) {
  border-bottom: var(--divider-line-thickness) solid var(--divider-line-color); border-end-start-radius: 0; border-end-end-radius: 0; }

/* Menu Item (molecule) — replaces the List Item block. Markup:
   <button class="dm-item [sharp] [destructive]" role="menuitem"><span class="icon">name</span><span class="dm-item-label">Label</span>[<span class="icon">chevron_right</span>]</button>
   check rows (menus): <button class="dm-item check" role="menuitemcheckbox|menuitemradio" aria-checked="false|true"><span class="icon">check_mark</span><span class="dm-item-label">Label</span></button>
     (the check slot stays empty until chosen)
   checkbox / radio rows (lists and Select only, never in a Dropdown Menu):
     <label class="dm-item ctl"><span class="checkbox md"><input type="checkbox"><span class="cb-box">…</span></span><span class="dm-item-label">Label</span></label>
   State classes: .is-selected (or aria-selected / aria-checked="true" / aria-current); unavailable rows stay focusable with
   aria-disabled="true" (or .is-disabled) and show their reason. Labels wrap; the height is a minimum.
   .list / .list-item are kept as aliases so List Item markup (date picker presets, speed scroller) renders as menu rows;
   .list.divided draws the list-level divider. The focus ring is inset so it never overlaps the next row. */
.list { list-style: none; margin: 0; padding: 0; }
.dm-item, .list-item { --_bg: var(--menu-item-container-background-enabled); --_fg: var(--menu-item-label-foreground); --_ic: var(--menu-item-icon-foreground);
  box-sizing: border-box; display: flex; align-items: center; gap: var(--menu-item-container-gap); width: 100%;
  min-height: var(--menu-item-container-height); padding: var(--menu-item-container-padding-y) var(--menu-item-container-padding-x);
  margin: 0; border: 0; border-radius: var(--menu-item-container-radius-rounded); background: var(--_bg); color: var(--_fg);
  font: var(--menu-item-label-font); text-align: start; cursor: pointer; }
.dm-item.sharp, .sharp > .dm-item, .sharp > * > .dm-item { border-radius: var(--menu-item-container-radius-sharp); }
.dm-item > .icon, .list-item > .icon { font-size: var(--menu-item-icon-size); color: var(--_ic); }
.dm-item-label, .list-item .headline { flex: 1; padding: 0 var(--menu-item-label-padding-end) 0 var(--menu-item-label-padding-start); }
.dm-item:hover, .list-item:hover { --_bg: var(--menu-item-container-background-hover); }
.dm-item.is-focus { --_bg: var(--menu-item-container-background-focused); }
.dm-item.destructive { --_fg: var(--menu-item-label-foreground-destructive); --_ic: var(--menu-item-icon-foreground-destructive); }
.dm-item.check:not([aria-checked="true"], [aria-selected="true"], .is-selected) > .icon:first-child { visibility: hidden; }
.dm-item:is(.is-selected, [aria-selected="true"], [aria-checked="true"], [aria-current]), .dm-item.ctl:has(input:checked) {
  --_bg: var(--menu-item-container-background-selected); --_fg: var(--menu-item-label-foreground-selected); --_ic: var(--menu-item-icon-foreground-selected); }
.dm-item:focus-visible, .dm-item.is-focus, .dm-item.ctl:has(input:focus-visible), .list-item:has(input:focus-visible) {
  outline: var(--menu-item-focus-ring-width) solid var(--menu-item-focus-ring-color); outline-offset: calc(-1 * var(--menu-item-focus-ring-width)); }
.dm-item:is(:disabled, .is-disabled, [aria-disabled="true"]), .dm-item.ctl:has(input:disabled) { --_bg: var(--menu-item-container-background-disabled);
  --_fg: var(--menu-item-label-foreground-disabled); --_ic: var(--menu-item-icon-foreground-disabled); cursor: not-allowed; }
/* checkbox / radio rows: no leading padding or gap; the control's own target spaces the label (its focus ring moves to the row) */

.dm-item.ctl > :is(.checkbox, .radio) { flex: none; min-width: var(--menu-item-selection-control-size); min-height: var(--menu-item-selection-control-size); }
.dm-item.ctl input:focus-visible + :is(.cb-box, .rb-ring) { outline: 0; }
.list.divided > li:not(:last-child) > .list-item, .list.divided > .list-item:not(:last-child), .list.divided > li:not(:last-child) > .dm-item {
  border-bottom: var(--menu-item-divider-border-width) solid var(--menu-item-divider-border-color); }

/* Message Input (molecule) — replaces the old "Message Input Field" and "Voice Memo" blocks (voice is now a state of the composer).
   Markup: <div class="mif">[.mif-files] [textarea.mif-text | .mif-voice | .mif-speaking] [.mif-chips] [.mif-toolbar]</div>; each state is
   rendered by including only the parts it shows (see the States table in molecules/message-input.md). Controls are Icon Buttons
   (.btn.icon-btn) recoloured through the Button engine's --_ variables: .mif-tool (ghost), .mif-send (primary), .mif-stop-speaking.
   .mif.disabled greys the container.
   .mif.generating: Stop takes Send's place, same primary look: <button class="btn icon-btn mif-send" aria-label="Stop reply"><span class="icon">stop</span></button>.
   .mif.error: <div class="ti-hint error"><span class="icon">error</span>Not sent. …</div> as the first child, the unsent text kept,
   Send on to resend (off when the error is a limit). The speaking caption wraps. */
.mif { display: flex; flex-direction: column; gap: var(--message-input-container-gap); box-sizing: border-box;
  width: var(--message-input-container-width); max-width: 100%; padding: var(--message-input-container-padding);
  background: var(--message-input-container-background); border-radius: var(--message-input-container-radius);
  box-shadow: inset 0 0 0 var(--message-input-container-border-width) var(--message-input-container-border-color); }
.mif.disabled { background: var(--message-input-container-background-disabled);
  box-shadow: inset 0 0 0 var(--message-input-container-border-width) var(--message-input-container-border-color-disabled); }

/* slots */
.mif-files, .mif-chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--message-input-file-slot-gap); }
.mif .mif-chip { border-color: var(--message-input-chip-border-color); }

/* text */
.mif-text { display: block; width: 100%; box-sizing: border-box; border: 0; resize: none; background: none;
  padding: var(--message-input-value-padding-y) var(--message-input-value-padding-x);
  font: var(--message-input-value-font); color: var(--message-input-value-foreground); }
.mif-text::placeholder { color: var(--message-input-value-foreground-placeholder); }
.mif-text:disabled { color: var(--message-input-value-foreground-disabled); }
.mif > .ti-hint.error { padding: 0 var(--message-input-value-padding-x); }

/* toolbar and controls */

.mif-tools, .mif-actions, .mif-attach, .mif-attach-slot { display: flex; align-items: center; gap: var(--message-input-toolbar-group-gap); }
.mif-attach, .mif-attach-slot { gap: var(--message-input-attachment-gap); }
.mif .btn.icon-btn { width: var(--message-input-control-size); height: var(--message-input-control-size); padding: var(--message-input-control-padding);
  border-radius: var(--message-input-control-radius); flex: none; }
.mif .btn.icon-btn .icon { font-size: var(--message-input-control-icon-size); }
.mif .mif-tool { --_bg: var(--message-input-tool-background-enabled); --_bg-h: var(--message-input-tool-background-hover);
  --_bg-p: var(--message-input-tool-background-pressed); --_bg-d: var(--message-input-tool-background-disabled);
  --_fg: var(--message-input-tool-foreground); --_fg-d: var(--message-input-tool-foreground-disabled); --_ring-w: 0px; }
.mif .mif-tool[aria-expanded="true"] { --_bg: var(--message-input-attachment-toggle-background-open); }
.mif .mif-send { --_bg: var(--message-input-send-background-enabled); --_bg-h: var(--message-input-send-background-hover);
  --_bg-p: var(--message-input-send-background-pressed); --_bg-d: var(--message-input-send-background-disabled);
  --_fg: var(--message-input-send-foreground); --_fg-d: var(--message-input-send-foreground-disabled); --_ring-w: 0px; }
.mif .mif-stop-speaking { --_bg: var(--message-input-stop-speaking-background); --_bg-h: var(--_bg); --_bg-p: var(--_bg);
  --_fg: var(--message-input-stop-speaking-foreground); --_ring-w: 0px; }

/* voice */
.mif-voice { display: flex; flex-direction: column; gap: var(--message-input-voice-gap); }
.mif-bar { display: flex; align-items: center; gap: var(--message-input-voice-bar-gap); box-sizing: border-box; min-height: var(--message-input-voice-bar-height);
  padding: var(--message-input-voice-bar-padding-y) var(--message-input-voice-bar-padding-end) var(--message-input-voice-bar-padding-y) var(--message-input-voice-bar-padding-start);
  background: var(--message-input-voice-bar-background); border-radius: var(--message-input-voice-bar-radius); }
.mif-bar.playback { padding-inline-start: var(--message-input-voice-bar-padding-start-playback); }
.mif-wave { display: flex; align-items: center; gap: var(--message-input-waveform-gap); height: var(--message-input-waveform-height); flex: none; }
.mif-wave > i { width: var(--message-input-waveform-bar-width); height: calc(var(--message-input-waveform-height) * var(--_h, 0.5));
  background: var(--message-input-waveform-bar-color); border-radius: var(--message-input-waveform-bar-radius); }
.mif-label { flex: 1; font: var(--message-input-voice-label-font); color: var(--message-input-voice-label-foreground); }
.mif-time { font: var(--message-input-voice-time-font); color: var(--message-input-voice-time-foreground); font-variant-numeric: tabular-nums; }
.mif-bar.playback .mif-time { margin-inline-start: auto; }
.mif-dot { width: var(--message-input-recording-dot-size); height: var(--message-input-recording-dot-size); flex: none;
  border-radius: 50%; background: var(--message-input-recording-dot-color); }
.mif .progress-circle { --_d: var(--message-input-progress-size); }
.mif-hint { margin: 0; font: var(--message-input-voice-hint-font); color: var(--message-input-voice-hint-foreground); }

/* speaking: orb of six rings (outer two on the strong gradient), caption, stop */
.mif-speaking { display: flex; flex-direction: column; align-items: center; gap: var(--message-input-speaking-gap);
  padding: var(--message-input-speaking-padding-top) 0 var(--message-input-speaking-padding-bottom); }
.mif-orb { position: relative; width: var(--message-input-orb-size); height: var(--message-input-orb-size); flex: none; }
.mif-orb > i { --_n: 0; /* ring index, set inline */ position: absolute; inset: calc(var(--_n) * var(--message-input-orb-size) / 14); border-radius: 50%;
  border: var(--message-input-orb-ring-width) solid transparent;
  background: linear-gradient(90deg, var(--message-input-orb-ring-inner-start), var(--message-input-orb-ring-inner-end)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.mif-orb > i:nth-child(n+5) { background-image: linear-gradient(90deg, var(--message-input-orb-ring-start), var(--message-input-orb-ring-end)); }
.mif-caption { margin: 0; text-align: center; font: var(--message-input-caption-font); color: var(--message-input-caption-foreground); }
.mif [hidden] { display: none; }

/* Navigation Header (molecule, DRAFT: measurements provisional) — the identity block at the top of a Navigation Rail or Drawer.
   Markup: <div class="nh [logo] [collapsed]"><span class="avatar s">AM</span> | <span class="nh-logo" role="img" aria-label="…"><span class="icon">…</span></span>
     <span class="nh-title">Alex Morgan</span>[<button class="btn icon-btn subtle sm" aria-label="Settings"><span class="icon">settings</span></button>]</div>
   .collapsed (the narrow rail) keeps only the avatar / logo, centred. Colour follows the parent's mode. */
.nh { display: flex; align-items: center; gap: var(--navigation-header-container-gap); padding: 0 var(--navigation-header-container-padding-x); min-width: 0; }

.nh.collapsed .nh-title, .nh.collapsed .btn { display: none; }

/* Notification Item (molecule) — old .notif-li prefix kept. Markup:
   <article class="notif-li [unread] [grouped]"><span class="notif-visual [icon|image]">…</span>
     <div class="notif-content"><div class="notif-message"><div class="notif-header">[<span class="notif-dot"><span class="indicator sm"></span></span>]
       <span class="notif-title"><a class="notif-link" href="…">…</a></span><span class="notif-meta">[<span class="notif-site">Site · </span>]<span class="notif-time">…</span>[icon indicator]</span></div>
       <p class="notif-body">…</p></div>[<a class="notif-attachment"><span class="icon">attachment</span>file.pdf</a>][<div class="notif-actions"><button class="btn sm">…</button></div>]</div>
     [<span class="notif-group" aria-hidden="true"></span>]</article>

   attachment stay separate targets above it. Title and body wrap in full. */
.notif-li { --_ov: transparent; position: relative; display: flex; align-items: flex-start; gap: var(--notification-item-container-gap);

  padding: var(--notification-item-container-padding-y) var(--notification-item-container-padding-x);

  box-shadow: inset 0 0 0 var(--notification-item-container-border-width) var(--notification-item-container-border-color); }
.notif-li.unread { background-color: var(--notification-item-container-background-unread); }
.notif-li:has(.notif-link) { cursor: pointer; }
.notif-li:has(.notif-link):is(:hover, .is-hover) { --_ov: var(--notification-item-container-overlay-hover); }
.notif-li:has(.notif-link):is(:active, .is-pressed) { --_ov: var(--notification-item-container-overlay-pressed); }
.notif-li:is(:has(.notif-link:focus-visible), .is-focus) { outline: var(--notification-item-focus-ring-width) solid var(--notification-item-focus-ring-color);
  outline-offset: var(--notification-item-focus-ring-width); }
.notif-link { color: inherit; text-decoration: none; outline: 0; }
.notif-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.notif-li :is(.notif-actions, .notif-attachment) { position: relative; z-index: 1; }
.notif-visual { flex: none; display: grid; place-items: center; overflow: hidden; box-sizing: border-box;
  width: var(--notification-item-visual-size); height: var(--notification-item-visual-size); border-radius: var(--notification-item-visual-radius);
  background-size: cover; background-position: center; }
.notif-visual.icon { border: var(--notification-item-visual-icon-border-width) solid var(--notification-item-visual-icon-border-color); }
.notif-visual.icon > .icon { font-size: var(--notification-item-visual-icon-size); color: var(--notification-item-visual-icon-foreground); }
.notif-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--notification-item-content-gap); }
.notif-message { display: flex; flex-direction: column; gap: var(--notification-item-message-gap); }
.notif-header { display: flex; align-items: flex-start; gap: var(--notification-item-header-gap); }
.notif-dot { display: none; flex: none; padding: var(--notification-item-unread-dot-padding-y) 0; line-height: 0; }
.notif-li.unread .notif-dot { display: block; }
.notif-title { flex: 1; min-width: 0; font: var(--notification-item-title-font-read); color: var(--notification-item-title-foreground); }
.notif-li.unread .notif-title { font: var(--notification-item-title-font-unread); }
.notif-meta { flex: none; display: flex; align-items: center; gap: var(--notification-item-metadata-gap); padding: var(--notification-item-metadata-padding-y) 0; }
.notif-time, .notif-site { font: var(--notification-item-timestamp-font); color: var(--notification-item-timestamp-foreground); white-space: nowrap; }
.notif-body { margin: 0; font: var(--notification-item-body-font); color: var(--notification-item-body-foreground); overflow-wrap: anywhere; }
.notif-attachment { display: inline-flex; align-items: center; gap: var(--notification-item-attachment-gap); align-self: flex-start;
  font: var(--notification-item-attachment-font); color: var(--notification-item-attachment-foreground); text-decoration: none; }
.notif-attachment .icon { font-size: var(--notification-item-attachment-icon-size); color: inherit; }
.notif-actions { display: flex; flex-direction: column; gap: var(--notification-item-actions-gap); }
.notif-group { display: none; position: absolute; bottom: 0; left: var(--notification-item-group-bar-inset); right: var(--notification-item-group-bar-inset);
  height: var(--notification-item-group-bar-height); border-radius: var(--notification-item-group-bar-radius); background: var(--notification-item-group-bar-background); }
.notif-li.unread.grouped .notif-group { display: block; }

/* Pagination (molecule) — controls and page indicators are one square surface drawn in place (no Icon Buttons). Markup:
   <nav aria-label="Pagination"><div class="pg [outline] [sharp]">
     <button class="pg-ctl" aria-label="First page"><span class="icon">first_page</span></button> …
     <button class="pg-page" aria-label="Page 2" aria-current="page">2</button> …
     <button class="pg-ctl" aria-label="More pages"><span class="icon">more_horizontal</span></button> … </div></nav>
   Sharp and no outline are the defaults. The border is inset (box-shadow), so Outline adds no size; focus replaces it. */
.pg { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pagination-container-gap); }
.pg-ctl, .pg-page { --_bg: var(--pagination-item-background-enabled); --_fg: var(--pagination-item-foreground-enabled);
  --_bw: var(--pagination-item-border-width); --_bc: var(--pagination-outline-item-border-color-enabled);
  box-sizing: border-box; display: inline-grid; place-items: center; flex: none; width: var(--pagination-item-size); height: var(--pagination-item-size);
  padding: var(--pagination-item-padding); margin: 0; border: 0; border-radius: var(--pagination-item-radius-rounded);
  background: var(--_bg); color: var(--_fg); box-shadow: inset 0 0 0 var(--_bw) var(--_bc); font: var(--pagination-indicator-font); cursor: pointer; }
.pg-page { padding: 0; }
.pg-ctl .icon { font-size: var(--pagination-control-icon-size); color: inherit; }
.pg.outline :is(.pg-ctl, .pg-page) { --_bw: var(--pagination-outline-item-border-width); }
.pg.sharp :is(.pg-ctl, .pg-page) { border-radius: var(--pagination-item-radius-sharp); }
:is(.pg-ctl, .pg-page):hover { --_bg: var(--pagination-item-background-hover); --_bc: var(--pagination-outline-item-border-color-hover); }
:is(.pg-ctl, .pg-page):active { --_bg: var(--pagination-item-background-pressed); --_bc: var(--pagination-outline-item-border-color-pressed); }
.pg-page[aria-current="page"] { --_bg: var(--pagination-item-background-selected); --_fg: var(--pagination-item-foreground-selected);
  --_bc: var(--pagination-outline-item-border-color-selected); cursor: default; }
:is(.pg-ctl, .pg-page):disabled { --_bg: var(--pagination-item-background-disabled); --_fg: var(--pagination-item-foreground-disabled); cursor: not-allowed; }
.pg-ctl:disabled { --_bc: var(--pagination-outline-control-border-color-disabled); }
.pg-page:disabled { --_bc: var(--pagination-outline-indicator-border-color-disabled); }
:is(.pg-ctl, .pg-page):focus-visible { outline: var(--pagination-focus-ring-width) solid var(--pagination-focus-ring-color);
  outline-offset: calc(-1 * var(--pagination-focus-ring-width)); box-shadow: none; }

/* Phone Input (molecule) — the .ph-input prefix is kept, but it no longer builds on Text Input. Label and hint are Input Label /
   Input Hint, the country menu a Dropdown Menu panel (.dm template + .dm-panel); only their placement is set here. Markup (label, hint, error, field):
   <div class="ph-input [sm|lg] [sharp|full] [gradient|ghost] [invalid] [readonly] [disabled]">
     <label class="ti-label" for="x">Phone number</label>
     [<div class="ti-hint" id="x-hint">…</div>] [<div class="ti-hint error" id="x-err"><span class="icon">error</span>…</div>]
     <div class="ph-control">
       <div class="dm"><button class="ph-country" aria-haspopup="listbox" aria-expanded="false" aria-label="Country, United States +1">
         <span class="ph-flag" aria-hidden="true">🇺🇸</span><span class="icon" aria-hidden="true">expand_more</span></button>
         <div class="dm-panel ph-menu" hidden><div class="text-input sm">(filter: Input markup, type to filter by name, ISO code or dial code)</div>
           <div class="ph-menu-list" role="listbox">….dm-item rows…</div></div></div>
       <div class="ph-number"><span class="ph-dial">+1</span><input id="x" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(555) 000-0000">
         <button class="ph-clear" type="button" aria-label="Clear number"><span class="icon">cancel</span></button></div></div></div>
   The country control has no end border, so the two parts join edge to edge; only the outer corners take the radius. */
.ph-input { --_r: var(--phone-input-container-radius-rounded); --_h: var(--phone-input-container-height-medium); --_font: var(--phone-input-value-font-medium);
  display: flex; flex-direction: column; gap: var(--phone-input-container-gap); width: 100%; }
.ph-control { display: flex; align-items: stretch; }
.ph-country { --_bg: var(--phone-input-country-background-enabled); --_bc: var(--phone-input-country-border-color-enabled); --_bw: var(--phone-input-container-border-width);
  box-sizing: border-box; display: flex; align-items: center; gap: var(--phone-input-country-gap); min-height: var(--_h); margin: 0; cursor: pointer;
  padding: 0 var(--phone-input-country-padding-x); background: var(--_bg); color: var(--phone-input-country-icon-foreground);
  border: var(--_bw) solid var(--_bc); border-inline-end: 0; border-radius: var(--_r) 0 0 var(--_r); outline: 0; }
.ph-country .icon, .ph-flag { font-size: var(--phone-input-icon-size); color: inherit; }
.ph-flag { display: inline-grid; place-items: center; width: var(--phone-input-icon-size); line-height: 1; }
.ph-flag img { width: 100%; height: auto; }
.ph-country:hover { --_bg: var(--phone-input-country-background-hover); }
.ph-country:active { --_bg: var(--phone-input-country-background-pressed); }
.ph-country[aria-expanded="true"] { --_bg: var(--phone-input-country-background-open); }
.ph-country:focus-visible { --_bw: var(--phone-input-container-border-width-focused); --_bc: var(--phone-input-country-border-color-focused); }
.ph-number { --_bg: var(--phone-input-number-background-enabled); --_bw: var(--phone-input-container-border-width);
  --_g1: var(--phone-input-number-border-color-enabled); --_g2: var(--_g1);
  box-sizing: border-box; flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--phone-input-number-gap); min-height: var(--_h);
  padding: var(--phone-input-number-padding-y) var(--phone-input-number-padding-end) var(--phone-input-number-padding-y) var(--phone-input-number-padding-start);
  font: var(--_font); border: var(--_bw) solid transparent; border-radius: 0 var(--_r) var(--_r) 0;
  background: linear-gradient(var(--_bg), var(--_bg)) padding-box, linear-gradient(129deg, var(--_g1), var(--_g2)) border-box; }
.ph-dial { padding-inline-start: var(--phone-input-text-padding-x); color: var(--phone-input-dial-code-foreground); }
.ph-number input { flex: 1; min-width: 0; padding: 0 var(--phone-input-text-padding-x) 0 0; margin: 0; border: 0; outline: 0; background: none;
  font: inherit; color: var(--phone-input-value-foreground); caret-color: var(--phone-input-cursor-foreground); }
.ph-number input::placeholder { color: var(--phone-input-placeholder-foreground); opacity: 1; }
.ph-clear { display: none; flex: none; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; color: var(--phone-input-clear-icon-foreground); }
.ph-clear .icon { font-size: var(--phone-input-icon-size); color: inherit; }
.ph-number:focus-within:has(input:not(:placeholder-shown)) .ph-clear { display: inline-flex; }
.ph-number:hover { --_g1: var(--phone-input-number-border-color-hover); }
.ph-input.readonly .ph-number { --_g1: var(--phone-input-number-border-color-read-only); }
.ph-input .ph-number:focus-within { --_bw: var(--phone-input-container-border-width-focused); --_g1: var(--phone-input-number-border-color-focused); --_g2: var(--_g1); }
.ph-input.invalid .ph-number { --_bg: var(--phone-input-number-background-invalid); --_bw: var(--phone-input-container-border-width-invalid);
  --_g1: var(--phone-input-number-border-color-invalid); --_g2: var(--_g1); }
.ph-input.disabled .ph-country { --_bg: var(--phone-input-country-background-disabled); --_bc: var(--phone-input-country-border-color-disabled);
  color: var(--phone-input-country-icon-foreground-disabled); cursor: not-allowed; }
.ph-input.disabled .ph-number { --_bg: var(--phone-input-number-background-disabled); --_g1: var(--phone-input-number-border-color-disabled); --_g2: var(--_g1); }
.ph-input.disabled .ph-dial { color: var(--phone-input-dial-code-foreground-disabled); }
.ph-input.disabled .ph-number input { color: var(--phone-input-value-foreground-disabled); cursor: not-allowed; }
/* flavours */
.ph-input.gradient:not(.invalid, .disabled) .ph-country:not(:focus-visible) { --_bc: var(--phone-input-gradient-country-border-color); }
.ph-input.gradient:not(.invalid, .disabled) .ph-number:not(:focus-within) { --_g1: var(--phone-input-gradient-number-border-color-start); --_g2: var(--phone-input-gradient-number-border-color-end); }
.ph-input.ghost .ph-country { --_bg: var(--phone-input-ghost-container-background-enabled); --_bw: var(--phone-input-ghost-container-border-width); --_bc: var(--phone-input-ghost-container-border-color); }
.ph-input.ghost .ph-country:hover { --_bg: var(--phone-input-ghost-country-background-hover); }
.ph-input.ghost .ph-country:active { --_bg: var(--phone-input-ghost-country-background-pressed); }
.ph-input.ghost .ph-country[aria-expanded="true"] { --_bg: var(--phone-input-ghost-country-background-open); }
.ph-input.ghost .ph-number { --_bw: var(--phone-input-ghost-container-border-width); --_g1: var(--phone-input-ghost-container-border-color);
  background: var(--phone-input-ghost-container-background-enabled); border-color: var(--_g1); }
.ph-input.ghost .ph-number:focus-within { --_bw: var(--phone-input-container-border-width-focused); --_g1: var(--phone-input-number-border-color-focused); } /* plain border: the gradient layer would show through the clear fill */
.ph-input.ghost .ph-country:focus-visible { --_bw: var(--phone-input-container-border-width-focused); --_bc: var(--phone-input-country-border-color-focused); }
/* sizes and shapes */
.ph-input.sm { --_h: var(--phone-input-container-height-small); --_font: var(--phone-input-value-font-small); }
.ph-input.lg { --_h: var(--phone-input-container-height-large); --_font: var(--phone-input-value-font-large); }
.ph-input.sharp { --_r: var(--phone-input-container-radius-sharp); }
.ph-input.full { --_r: var(--phone-input-container-radius-full); }
/* country menu: left aligned below the control; a filter field at the top, and only the list scrolls (past eight rows) */
.ph-control .dm > .ph-menu { top: calc(100% + var(--phone-input-menu-offset)); }
.ph-menu-list { display: flex; flex-direction: column; gap: var(--dropdown-menu-content-gap);
  max-height: calc(8 * (var(--phone-input-container-height-medium) + var(--phone-input-number-gap))); overflow-y: auto; }

/* Progress Circle (molecule) — moved from atoms. Diameter is --_d (a size class, or set by the parent, e.g. Upload Item).
   <span class="progress-circle [xs|sm|md|lg] [square] [no-track] [indeterminate] [upload] [stop]" role="progressbar" aria-label="…" aria-valuenow="65">
     <svg aria-hidden="true"><circle class="pc-track"/><circle class="pc-arc" pathLength="100" style="stroke-dasharray: 65 100"/></svg>
     [<span class="pc-pct">65%</span><button class="pc-cancel" type="button" aria-label="Cancel upload"><span class="icon" aria-hidden="true">close</span></button>]</span>
   Upload: the cancel button replaces the percentage with .stop, and on hover / keyboard focus. Default size is xxsmall. */
.progress-circle { --_d: var(--progress-circle-size-xxsmall); position: relative; display: inline-grid; place-items: center; flex: none; width: var(--_d); height: var(--_d); }
.progress-circle.xs { --_d: var(--progress-circle-size-xsmall); }
.progress-circle.sm { --_d: var(--progress-circle-size-small); }
.progress-circle.md { --_d: var(--progress-circle-size-medium); }
.progress-circle.lg { --_d: var(--progress-circle-size-large); }
.progress-circle svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.progress-circle circle { cx: 50%; cy: 50%; r: calc(50% - var(--progress-circle-stroke-width) / 2); fill: none; stroke-width: var(--progress-circle-stroke-width); }
.pc-track { stroke: var(--progress-circle-track-color); }
.progress-circle.no-track .pc-track { stroke: none; }
.pc-arc { stroke: var(--progress-circle-arc-color); stroke-linecap: round; }
.progress-circle.square .pc-arc, [data-contrast="aaa"] .pc-arc { stroke-linecap: butt; }
.progress-circle.indeterminate svg { animation: pc-spin var(--progress-circle-indeterminate-duration) linear infinite; }
@keyframes pc-spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
@media (prefers-reduced-motion: reduce) { .progress-circle.indeterminate svg { animation: none; } }
/* upload control: a fixed square centred in the ring */
.pc-pct { position: relative; font: var(--progress-circle-percentage-font); color: var(--progress-circle-percentage-foreground); }
.pc-cancel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; place-items: center; box-sizing: border-box;
  width: var(--progress-circle-upload-size); height: var(--progress-circle-upload-size); padding: var(--progress-circle-cancel-padding);
  border: 0; border-radius: var(--progress-circle-cancel-radius); background: var(--progress-circle-cancel-background); cursor: pointer; }
.pc-cancel .icon { font-size: var(--progress-circle-cancel-icon-size); color: var(--progress-circle-cancel-icon-foreground); }
.pc-cancel:focus-visible { outline: var(--progress-circle-cancel-focus-ring-width) solid var(--progress-circle-cancel-focus-ring-color); }
.progress-circle.upload:is(.stop, :hover, :focus-within) .pc-cancel { display: grid; }
.progress-circle.upload:is(.stop, :hover, :focus-within) .pc-pct { visibility: hidden; }

/* Push to Talk (molecule, draft) — channel, speaker, talk control, state label, latch. Avatar, Switch and Icon Button use their own markup.
   <div class="ptt [talking|receiving|busy|refused|disabled]">
     <div class="ptt-channel"><div class="ptt-channel-text"><span class="ptt-channel-name">Dock team</span><span class="ptt-meta">8 members · Dock 3</span></div>
       [<button class="btn icon-btn subtle" aria-label="Change channel"><span class="icon" aria-hidden="true">swap</span></button>]</div>
     <div class="ptt-speaker"><span class="avatar s">JS</span><span class="ptt-speaker-name">Jo Smith is speaking</span></div>  (or <span class="ptt-meta">Channel clear</span>)
     <button class="ptt-control" type="button" aria-pressed="false" aria-describedby="ptt-state" [aria-disabled="true"]><span class="icon" aria-hidden="true">ptt</span></button>
     <span class="ptt-state" id="ptt-state" aria-live="polite">Hold to talk</span>
     [<label class="switch"><input type="checkbox" role="switch"><span class="sw-track"></span>Latch</label>]</div>
   The script holds talking on pointerdown/Space keydown and stops on release (latched: toggles). The talking ring is static, no pulse. */
.ptt { --_bg: var(--push-to-talk-control-background-ready); --_fg: var(--push-to-talk-control-foreground);
  display: flex; flex-direction: column; align-items: center; gap: var(--push-to-talk-stack-gap); text-align: center; }
.ptt-channel { display: flex; align-items: center; gap: var(--push-to-talk-speaker-gap); }
.ptt-channel-text { display: flex; flex-direction: column; gap: var(--push-to-talk-info-gap); }
.ptt-channel-name { font: var(--push-to-talk-channel-font); color: var(--push-to-talk-channel-foreground); }
.ptt-meta { font: var(--push-to-talk-meta-font); color: var(--push-to-talk-meta-foreground); }
.ptt-speaker { display: flex; align-items: center; gap: var(--push-to-talk-speaker-gap); }
.ptt-speaker-name { font: var(--push-to-talk-speaker-font); color: var(--push-to-talk-speaker-foreground); }
.ptt-control { display: inline-grid; place-items: center; box-sizing: border-box; flex: none; margin: 0; padding: 0; cursor: pointer;
  width: var(--push-to-talk-control-size); height: var(--push-to-talk-control-size); border-radius: var(--push-to-talk-control-radius);
  border: var(--push-to-talk-control-border-width) solid var(--push-to-talk-control-border-color);
  background: var(--_bg); color: var(--_fg); touch-action: none; user-select: none; -webkit-user-select: none;
  transition: background-color var(--push-to-talk-control-transition), color var(--push-to-talk-control-transition); }
.ptt-control .icon { font-size: var(--push-to-talk-icon-size); color: inherit; }
.ptt:not(.talking, .receiving, .busy, .refused, .disabled) .ptt-control:hover { --_bg: var(--push-to-talk-control-background-hover); }
.ptt-control:focus-visible { outline: var(--push-to-talk-focus-ring-width) solid var(--push-to-talk-focus-ring-color);
  outline-offset: calc(var(--push-to-talk-ring-offset) + var(--push-to-talk-ring-width)); }
.ptt-state { font: var(--push-to-talk-state-font); color: var(--push-to-talk-state-foreground); }
/* states: colour + words, and a ring while talking */
.ptt.talking { --_bg: var(--push-to-talk-control-background-talking); --_fg: var(--push-to-talk-control-foreground-status); }
.ptt.talking .ptt-control { box-shadow: 0 0 0 var(--push-to-talk-ring-offset) var(--push-to-talk-control-border-color),
  0 0 0 calc(var(--push-to-talk-ring-offset) + var(--push-to-talk-ring-width)) var(--push-to-talk-ring-color); }
.ptt.talking .ptt-control:focus-visible { outline-offset: calc(var(--push-to-talk-ring-offset) + var(--push-to-talk-ring-width) + var(--push-to-talk-focus-ring-width)); }
.ptt.receiving { --_bg: var(--push-to-talk-control-background-receiving); --_fg: var(--push-to-talk-control-foreground-status); }
.ptt.busy { --_bg: var(--push-to-talk-control-background-busy); --_fg: var(--push-to-talk-control-foreground-status); }
.ptt.refused { --_bg: var(--push-to-talk-control-background-refused); --_fg: var(--push-to-talk-control-foreground-status); }
.ptt.disabled { --_bg: var(--push-to-talk-control-background-disabled); --_fg: var(--push-to-talk-control-foreground-disabled); }
.ptt.disabled .ptt-control { cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .ptt-control { transition: none; } }
/* forced colours drop box-shadows: draw the talking ring as an outline instead */
@media (forced-colors: active) { .ptt.talking .ptt-control:not(:focus-visible) { outline: var(--push-to-talk-ring-width) solid CanvasText; outline-offset: var(--push-to-talk-ring-offset); } }

/* Search (molecule) — renamed from Search Bar; standalone (no .ti-field). Default: large, rounded (Figma's is sharp).
   <div class="search-bar [md|sm] [gradient|ghost] [shape-sharp|shape-full]">
     <span class="icon" aria-hidden="true">search</span><input type="search" enterkeyhint="search" placeholder="Search" aria-label="Search …">
     <span class="sb-trailing"><button class="sb-clear" type="button" aria-label="Clear search"><span class="icon" aria-hidden="true">cancel</span></button>
       <span class="divider vertical" aria-hidden="true"></span><button class="sb-action" type="button" aria-label="Voice search"><span class="icon" aria-hidden="true">microphone</span></button></span>
   </div>
   Typing (focused with a value) shows clear + divider; .disabled on the root (or a disabled input) dims it. Old names kept: .full = .shape-full, .sb-mic = .sb-action; .shape-rounded is the default. */
.search-bar { --_bg: var(--search-container-background-enabled); --_bc: var(--search-container-border-color-enabled); --_bw: var(--search-container-border-width);
  display: flex; align-items: center; gap: var(--search-container-gap); box-sizing: border-box; width: var(--search-container-width); max-width: 100%;
  min-height: var(--search-container-height-large); padding: var(--search-container-padding-y) var(--search-container-padding-x);
  border-radius: var(--search-container-radius-rounded); background: var(--_bg);
  box-shadow: inset 0 0 0 var(--_lock-w, var(--_bw)) var(--_lock-c, var(--_bc)); }
.search-bar:where(:not(:focus-within):has(input:not(:placeholder-shown))) { --_bc: var(--search-container-border-color-filled); } /* filled */
.search-bar:hover { --_bc: var(--search-container-border-color-hover); }
.search-bar:focus-within { --_bc: var(--search-container-border-color-focused); --_bw: var(--search-container-border-width-focused); }
.search-bar:focus-within:has(input:not(:placeholder-shown)) { --_bc: var(--search-container-border-color-typing); --_bw: var(--search-container-border-width); }
.search-bar input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 var(--search-text-padding-x); background: none; -webkit-appearance: none; appearance: none;
  font: var(--search-value-font-large); color: var(--search-value-foreground); caret-color: var(--search-cursor-foreground); }
.search-bar input::placeholder { color: var(--search-placeholder-foreground); opacity: 1; }
.search-bar input::-webkit-search-cancel-button, .search-bar input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.search-bar .icon { font-size: var(--search-icon-size); color: var(--search-icon-foreground); }
/* trailing area: clear (typing only), divider, trailing control; each control claims a target wider than its glyph */
.sb-trailing { display: inline-flex; align-items: center; gap: var(--search-trailing-gap); flex: none; }
.sb-trailing .divider, .search-bar .sb-divider { display: none; align-self: center; min-height: 0; height: var(--search-divider-height); }
.search-bar .sb-divider { width: var(--divider-line-thickness); background: var(--divider-line-color); }
.sb-clear, .sb-action, .sb-mic { position: relative; display: inline-flex; flex: none; border: 0; padding: 0; background: none; color: inherit; cursor: pointer; }
:is(.sb-clear, .sb-action, .sb-mic)::after { content: ""; position: absolute; left: 50%; top: 50%; width: var(--search-control-target-size); height: var(--search-control-target-size); transform: translate(-50%, -50%); }
:is(.sb-clear, .sb-action, .sb-mic):focus-visible { outline: var(--search-control-focus-ring-width) solid var(--search-control-focus-ring-color); }
.sb-clear { display: none; }
.search-bar:focus-within:has(input:not(:placeholder-shown)) .sb-clear { display: inline-flex; }
.search-bar:focus-within:has(input:not(:placeholder-shown)) :is(.sb-clear + .divider, .sb-clear + .sb-divider) { display: block; }
/* flavours */
.search-bar.ghost { --_bg: var(--search-ghost-container-background-enabled); --_bc: var(--search-ghost-container-border-color); --_lock-w: var(--search-ghost-container-border-width); }
.search-bar.ghost:focus-within { --_lock-w: initial; } /* optional focus border: drop where the container shows focus */
.search-bar.gradient { --_bg: var(--search-gradient-container-background-enabled); }
.search-bar.gradient:not(.disabled):not(:focus-within) { --_bc: transparent; border: var(--_bw) solid transparent;
  padding: calc(var(--search-container-padding-y) - var(--_bw)) calc(var(--search-container-padding-x) - var(--_bw));
  background: linear-gradient(var(--_bg), var(--_bg)) padding-box,
    linear-gradient(129deg, var(--search-gradient-container-border-color-start), var(--search-gradient-container-border-color-end)) border-box; }
/* disabled */
.search-bar.disabled, .search-bar:has(input:disabled) { --_bg: var(--search-container-background-disabled); --_lock-c: var(--search-container-border-color-disabled); cursor: not-allowed; }
.search-bar.ghost:is(.disabled, :has(input:disabled)) { --_bg: var(--search-ghost-container-background-disabled); }
:is(.search-bar.disabled, .search-bar:has(input:disabled)) input { color: var(--search-value-foreground-disabled); }
:is(.search-bar.disabled, .search-bar:has(input:disabled)) input::placeholder { color: var(--search-value-foreground-disabled); }
:is(.search-bar.disabled, .search-bar:has(input:disabled)) .icon { color: var(--search-icon-foreground-disabled); }
/* sizes */
.search-bar.md { min-height: var(--search-container-height-medium); }
.search-bar.md input { font: var(--search-value-font-medium); }
.search-bar.sm { min-height: var(--search-container-height-small); }
.search-bar.sm input { font: var(--search-value-font-small); }
/* shapes */
.search-bar:is(.shape-sharp, .sharp), [data-shape="sharp"] .search-bar { border-radius: var(--search-container-radius-sharp); }
.search-bar:is(.shape-full, .full) { border-radius: var(--search-container-radius-full); }

/* Segmented Control (molecule) — the indicator belongs to the track and slides to the active segment (placed by script).
   Markup: <div class="seg [sharp]" role="radiogroup" aria-label="…"><span class="seg-indicator"></span><button role="radio" aria-checked="true">[<span class="icon">…</span>]Label</button>…</div>
   Flavour follows the content: icon + label → start/end padding; text only (no .icon) or .icon-only → equal padding.
   2–5 segments, all as wide as the widest; where the labels don't fit, use radio buttons or a Select instead. The active segment
   has the fill and a thick selection border, so selection shows by shape as well as colour. */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--segmented-control-track-gap); padding: var(--segmented-control-track-padding);
  background: var(--segmented-control-track-background); border-radius: var(--segmented-control-track-radius-rounded); }
.seg-indicator { position: absolute; top: var(--segmented-control-track-padding); bottom: var(--segmented-control-track-padding);
  background: var(--segmented-control-indicator-background); border-radius: var(--segmented-control-indicator-radius-rounded);
  box-shadow: inset 0 0 0 var(--segmented-control-indicator-border-width) var(--segmented-control-indicator-border-color);
  transition: left var(--segmented-control-indicator-transition), width var(--segmented-control-indicator-transition); }
.seg button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--segmented-control-segment-gap);
  min-height: var(--segmented-control-segment-height); padding: var(--segmented-control-segment-padding-y) var(--segmented-control-text-only-segment-padding-x);
  border: 0; background: none; cursor: pointer; white-space: nowrap; font: var(--segmented-control-label-font);
  color: var(--segmented-control-label-foreground); border-radius: var(--segmented-control-indicator-radius-rounded);
  transition: color var(--segmented-control-indicator-transition); }
.seg button:has(.icon) { padding-inline: var(--segmented-control-segment-padding-start) var(--segmented-control-segment-padding-end); }
.seg button.icon-only { padding-inline: var(--segmented-control-icon-only-segment-padding-x); }
.seg button .icon { font-size: var(--segmented-control-icon-size); color: inherit; }
.seg button:hover { color: var(--segmented-control-label-foreground-hover); }
.seg button[aria-checked="true"] { color: var(--segmented-control-label-foreground-selected); }
.seg button:focus-visible { outline: var(--segmented-control-focus-ring-width) solid var(--segmented-control-focus-ring-color); outline-offset: 0; z-index: 1; }
.seg.sharp { border-radius: var(--segmented-control-track-radius-sharp); }
.seg.sharp .seg-indicator, .seg.sharp button { border-radius: var(--segmented-control-indicator-radius-sharp); }
@media (prefers-reduced-motion: reduce) { .seg-indicator { transition: none; } } /* the indicator moves at once; the label colour still fades */

/* Select (molecule) — replaces Select Input; the .sel class prefix is kept. Label and hint are Input Label / Input Hint, the menu a
   Dropdown Menu (.dm-panel of .dm-item rows); only their placement is set here. Markup (label, hint, error, field):
   <div class="sel [sm|lg] [sharp|full] [gradient|ghost] [is-open] [is-filled] [invalid] [readonly] [disabled]">
     <label class="ti-label" for="x">Field name</label>
     [<div class="ti-hint" id="x-hint">…</div>] [<div class="ti-hint error" id="x-err"><span class="icon">error</span>…</div>]
     <div class="sel-anchor"><button class="sel-field" id="x" aria-haspopup="listbox" aria-expanded="false">[<span class="icon">email</span>]
       <span class="sel-value">Select an option</span><span class="icon sel-chev">expand_more</span></button>
       <div class="dm-panel" role="listbox" hidden> …<div class="dm-item check" role="option" aria-selected="true|false"><span class="icon">check_mark</span>…</div>… </div></div></div>
   The chosen option shows a check. Typing a letter jumps to the next option starting with it (script). The value wraps; the height is a minimum.
   The border is drawn as a border-box gradient (a solid one outside the gradient flavour), so one mechanism serves every flavour. */
.sel { display: flex; flex-direction: column; gap: var(--select-container-gap); width: 100%; }
.sel-anchor { position: relative; }
.sel-field { --_bg: var(--select-field-background-enabled); --_bw: var(--select-field-border-width);
  --_g1: var(--select-field-border-color-enabled); --_g2: var(--_g1); --_fg: var(--select-placeholder-foreground);
  --_ic: var(--select-icon-foreground); --_ics: var(--select-icon-size-medium);
  box-sizing: border-box; display: flex; align-items: center; gap: var(--select-field-gap); width: 100%; margin: 0; cursor: pointer; text-align: left;
  min-height: var(--select-field-height-medium); padding: var(--select-field-padding-y) var(--select-field-padding-x);
  font: var(--select-value-font-medium); color: var(--_fg); border: var(--_bw) solid transparent; border-radius: var(--select-field-radius-rounded);
  background: linear-gradient(var(--_bg), var(--_bg)) padding-box, linear-gradient(90deg, var(--_g1), var(--_g2)) border-box; outline: 0; }
.sel-field .icon { font-size: var(--_ics); color: var(--_ic); }
.sel-value { flex: 1; min-width: 0; padding: 0 var(--select-text-padding-x); overflow-wrap: anywhere; }
.sel.is-filled .sel-field, .sel.invalid .sel-field, .sel.readonly .sel-field { --_fg: var(--select-value-foreground); }
.sel-field:hover { --_g1: var(--select-field-border-color-hover); }
.sel.is-open .sel-field { --_bw: var(--select-field-border-width-focused); --_g1: var(--select-field-border-color-open); }
.sel.is-open .sel-chev { transform: rotate(180deg); }
.sel:is(.invalid, .error) .sel-field { --_g1: var(--select-field-border-color-invalid); }
.sel.readonly .sel-field { --_g1: var(--select-field-border-color-read-only); cursor: default; }
.sel.disabled .sel-field { --_bg: var(--select-field-background-disabled); --_g1: var(--select-field-border-color-disabled);
  --_fg: var(--select-value-foreground-disabled); --_ic: var(--select-icon-foreground-disabled); cursor: not-allowed; }
/* flavours: gradient keeps the default tokens for focus, invalid, read-only and disabled */
.sel.gradient:not(.invalid, .error, .readonly, .disabled) .sel-field:not(:focus-visible) {
  --_g1: var(--select-gradient-field-border-color-start); --_g2: var(--select-gradient-field-border-color-end); }
.sel.gradient:not(.invalid, .error, .readonly, .disabled) .sel-field:not(:focus-visible):hover { --_g1: var(--select-gradient-field-border-color-hover); --_g2: var(--_g1); }
.sel.gradient.is-open .sel-field:not(:focus-visible) { --_g1: var(--select-gradient-field-border-color-open); --_g2: var(--_g1); }
/* ghost: plain border (transparent except in the AAA modes) and fill; the gradient layer would show through the clear fill */
.sel.ghost .sel-field { --_bg: var(--select-ghost-field-background-enabled); --_bw: var(--select-ghost-field-border-width); --_g1: var(--select-ghost-field-border-color); }
.sel.ghost .sel-field, .sel.ghost .sel-field:focus-visible { background: var(--_bg); border-color: var(--_g1); }
.sel.ghost.disabled .sel-field { --_bg: var(--select-ghost-field-background-disabled); }
/* focus wins over every state and flavour (after them in the cascade, same specificity) */
.sel .sel-field:focus-visible, .sel.is-focus .sel-field { --_bw: var(--select-field-border-width-focused); --_g1: var(--select-field-border-color-focused); --_g2: var(--_g1); }
/* sizes and shapes */
.sel.sm .sel-field { --_ics: var(--select-icon-size-small); min-height: var(--select-field-height-small); font: var(--select-value-font-small); }
.sel.lg .sel-field { --_ics: var(--select-icon-size-large); min-height: var(--select-field-height-large); font: var(--select-value-font-large); }
.sel.sharp .sel-field { border-radius: var(--select-field-radius-sharp); }
.sel.full .sel-field { border-radius: var(--select-field-radius-full); }
/* the open menu: overlaid below the field, as wide as it; the assembly does not grow */
.sel-anchor > .dm-panel { position: absolute; z-index: 2; left: 0; right: 0; top: calc(100% + var(--select-menu-offset)); width: auto; }

/* Site Switcher (molecule, draft) — the current tenant or site in the header, switched from the same spot.
   Menu variant: the panel is a Dropdown Menu (.dm-panel of .dm-item rows); search variant: a panel holding a Combobox (.cbx). Markup:
   <div class="site-sw [sharp]">
     <button class="site-sw-trigger" type="button" aria-haspopup="menu|dialog" aria-expanded="false" aria-label="Site: Dock 3 north, change site" title="Dock 3 north">
       <span class="icon" aria-hidden="true">store</span>
       <span class="site-sw-text">[<span class="site-sw-context">Contoso Retail</span>]<span class="site-sw-name">Dock 3 north</span></span>
       <span class="icon site-sw-caret" aria-hidden="true">expand_more</span></button>
     <div class="dm-panel site-sw-panel" role="menu" hidden>
       <button class="dm-item" role="menuitemradio" aria-checked="true"><span class="dm-item-label">Dock 3 north</span><span class="icon" aria-hidden="true">check_mark</span></button>…</div></div>
   Read-only (one place): <span class="site-sw readonly"><span class="site-sw-trigger">…no caret…</span></span>.
   Inside the Global Header it inherits data-theme="dark". The name truncates at the end here; middle truncation (5.81, 5.30) needs script. */
.site-sw { position: relative; display: inline-flex; min-width: 0; }
.site-sw-trigger { --_bg: var(--site-switcher-trigger-background-enabled);
  box-sizing: border-box; display: inline-flex; align-items: center; gap: var(--site-switcher-trigger-gap); min-width: 0;
  min-height: var(--site-switcher-trigger-min-height); max-width: var(--site-switcher-trigger-max-width);
  padding: 0 var(--site-switcher-trigger-padding-x); margin: 0; cursor: pointer; text-align: start;
  border: var(--site-switcher-trigger-border-width) solid var(--site-switcher-trigger-border-color);
  border-radius: var(--site-switcher-trigger-radius-rounded); background: var(--_bg); color: var(--site-switcher-name-foreground);
  transition: background-color var(--site-switcher-trigger-transition); }
.site-sw.sharp .site-sw-trigger, [data-shape="sharp"] .site-sw-trigger { border-radius: var(--site-switcher-trigger-radius-sharp); }
.site-sw-trigger > .icon { font-size: var(--site-switcher-icon-size); color: var(--site-switcher-icon-foreground); }
.site-sw-trigger > .site-sw-caret { font-size: var(--site-switcher-caret-size); }
.site-sw-text { display: flex; flex-direction: column; gap: var(--site-switcher-text-gap); min-width: 0; }
.site-sw-name { font: var(--site-switcher-name-font); color: var(--site-switcher-name-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-sw-context { font: var(--site-switcher-context-font); color: var(--site-switcher-context-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.site-sw-trigger:hover { --_bg: var(--site-switcher-trigger-background-hover); }
button.site-sw-trigger:active { --_bg: var(--site-switcher-trigger-background-pressed); }
.site-sw-trigger[aria-expanded="true"] { --_bg: var(--site-switcher-trigger-background-open); transition: none; }
.site-sw-trigger[aria-expanded="true"] .site-sw-caret { transform: rotate(180deg); }
.site-sw-trigger:focus-visible { outline: var(--site-switcher-focus-ring-width) solid var(--site-switcher-focus-ring-color); outline-offset: 0; }
.site-sw.readonly .site-sw-trigger { cursor: default; }
.site-sw > .site-sw-panel { position: absolute; z-index: 3; top: calc(100% + var(--site-switcher-panel-offset)); inset-inline-start: 0; }
@media (prefers-reduced-motion: reduce) { .site-sw-trigger { transition: none; } }

/* Slider Input Field (molecule, draft) — label, hint, error, then [min-max labels above the slider | number box]. The slider is the Slider atom (.sl).
   <div class="sif [invalid] [disabled]"><span class="sif-label" id="l">Label</span>
     [<div class="ti-hint" id="h">…</div>] [<div class="ti-hint error" id="e"><span class="icon">error</span>Enter a value from 0 to 100</div>]
     <div class="sif-col"><div class="sif-range" aria-hidden="true"><span>0</span><span>100</span></div><div class="sl" …></div></div>
     <input class="sif-num" type="number" aria-labelledby="l" aria-describedby="h e" [aria-invalid="true"]></div>
   The number box follows the slider in focus order. .error is kept as an alias for .invalid. (.sif-msg is gone: the error is a .ti-hint.error line.) */
.sif { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--slider-input-field-gap); row-gap: var(--slider-input-field-label-gap);
  align-items: start; width: 100%; }
.sif-label { grid-column: 1 / -1; font: var(--slider-input-field-label-font); color: var(--slider-input-field-label-foreground); }
.sif > .ti-hint { grid-column: 1 / -1; }
.sif-col { grid-column: 1; display: flex; flex-direction: column; gap: var(--slider-input-field-slider-gap); }
.sif-col > .sl { margin-top: var(--slider-input-field-slider-padding-top); }
.sif-range { order: -1; } /* range labels sit above the track, where a finger doesn't hide them */
.sif-range { display: flex; justify-content: space-between; font: var(--slider-input-field-range-label-font); color: var(--slider-input-field-range-label-foreground); }
.sif-num { grid-column: 2; box-sizing: border-box; min-width: var(--slider-input-field-input-width); min-height: var(--slider-input-field-input-height);
  padding: 0 var(--slider-input-field-input-padding-x); text-align: center; border: 0; outline: 0; border-radius: var(--slider-input-field-input-radius);
  font: var(--slider-input-field-input-font); color: var(--slider-input-field-input-foreground); background: var(--slider-input-field-input-background);
  box-shadow: inset 0 0 0 var(--slider-input-field-input-border-width) var(--_bc, var(--slider-input-field-input-border-color));
  -moz-appearance: textfield; appearance: textfield; }
.sif-num::-webkit-inner-spin-button, .sif-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sif-num:focus-visible { box-shadow: inset 0 0 0 var(--slider-input-field-input-border-width-focused) var(--_bc, var(--slider-input-field-input-border-color-focused)); }
.sif:is(.invalid, .error) .sif-num { --_bc: var(--slider-input-field-input-border-color-invalid); }
.sif.disabled .sif-label { color: var(--slider-input-field-label-foreground-disabled); }
.sif.disabled .sif-range { color: var(--slider-input-field-range-label-foreground-disabled); }
.sif.disabled .sif-num { --_bc: var(--slider-input-field-input-border-color-disabled); background: var(--slider-input-field-input-background-disabled);
  color: var(--slider-input-field-input-foreground-disabled); cursor: not-allowed; }

/* Snackbar (molecule) — markup: <div class="snackbar [info|success|deletion|view|action] [standard] [sharp]" role="status">
   <div class="sb-content">[<span class="icon">info</span>]<span class="sb-message">Message</span></div>
   <div class="sb-actions">[<button class="btn subtle"><span class="btn-label">Undo</span></button>]
   [<button class="btn icon-btn subtle sb-close" aria-label="Close"><span class="icon">close</span></button>]</div></div>
   Default status is "default" (no class). Toasts never carry errors or warnings. Action Buttons: subtle (deletion, view),
   outline-subtle sm (action), contrast sm (standard); the action label is free text (Undo, View…).
   The bar sets the Buttons' shape: pill on rounded contextual, rounded on standard, sharp on sharp.
   .snackbar-live floats it, centred, at the bottom of the content area; raise it above pinned actions, a bottom navigation bar or a FAB
   by setting --_sb-bottom (default --snackbar-position-offset-bottom) on it or an ancestor. Toggle .show; one at a time (a newer bar replaces
   the older). It always times out after at least --snackbar-timeout (script), pausing while hovered or focused.
   Enter rises and fades in; exit fades out, faster, on the leaving curve. Reduced motion: fades only.
   The transparent border is the edge forced-colours mode draws.
   A message that doesn't fit wraps; rounded corners stay half the one-line height, so a wrapped bar keeps them. */
.snackbar { --_sb-bg: var(--snackbar-default-container-background); --_sb-fg: var(--snackbar-default-message-foreground); --_sb-icon: var(--_sb-fg);
  display: flex; align-items: center; gap: var(--snackbar-container-gap); box-sizing: border-box; min-height: var(--snackbar-container-height); max-width: 100%;
  padding: var(--snackbar-container-padding-y) var(--snackbar-container-padding-trailing) var(--snackbar-container-padding-y) var(--snackbar-container-padding-leading);
  background: var(--_sb-bg); color: var(--_sb-fg); border: var(--snackbar-container-border-width) solid var(--snackbar-container-border-color);
  border-radius: min(var(--snackbar-contextual-container-radius-rounded), calc(var(--snackbar-container-height) / 2));
  box-shadow: var(--snackbar-container-shadow-near), var(--snackbar-container-shadow-far); }
.snackbar.info { --_sb-bg: var(--snackbar-info-container-background); --_sb-fg: var(--snackbar-info-message-foreground); --_sb-icon: var(--snackbar-info-icon-foreground); }
.snackbar.success { --_sb-bg: var(--snackbar-success-container-background); --_sb-fg: var(--snackbar-success-message-foreground); --_sb-icon: var(--snackbar-success-icon-foreground); }
.snackbar.deletion { --_sb-bg: var(--snackbar-deletion-container-background); --_sb-fg: var(--snackbar-deletion-message-foreground); --_sb-icon: var(--snackbar-deletion-icon-foreground); }

/* Stepper Input (molecule) — label, hint, error, then Icon Button (outline-subtle) / Input field / Icon Button. Default is Figma's: medium, square corners.
   <div class="stp [lg] [sharp] [invalid] [disabled]">[<label class="ti-label" for="v">Cartons</label>] [<div class="ti-hint" id="h">1 to 20</div>]
     [<div class="ti-hint error" id="e"><span class="icon">error</span>…</div>]
     <div class="stp-row" role="group" aria-label="…">
     <button class="btn icon-btn outline-subtle" type="button" aria-label="Decrease …" data-step="-1"><span class="icon" aria-hidden="true">remove</span></button>
     <div class="text-input"><div class="ti-field"><input type="text" inputmode="numeric" value="6" aria-label="…"></div></div>

   </div>

/* Sub Menu Item (molecule) — <a|button class="smi [nested]" [aria-current="page"] [aria-disabled="true"]><span class="icon">verified</span>
     <span class="smi-label">Label</span>[<span class="indicator">3</span>][<span class="caret-indicator horizontal"><span class="icon">expand_more</span></span>]</a>
   Collapsible Menu Item: <div class="smi-group [open]"><button class="smi" aria-expanded="false" aria-controls="…">… caret …</button>
     <div class="smi-group-list"><div class="smi-group-clip"><div class="smi-group-rows" id="…"> .smi.nested ×n </div></div></div></div>

.smi-label { flex: 1; min-width: 0; overflow-wrap: anywhere; } /* labels wrap */
.smi.nested { padding-left: var(--sub-menu-item-nested-container-padding-start); color: var(--sub-menu-item-nested-label-foreground); font: var(--sub-menu-item-nested-label-font); }
.smi:hover { background: var(--sub-menu-item-container-background-hover); }
.smi:active { background: var(--sub-menu-item-container-background-pressed); color: var(--sub-menu-item-label-foreground-pressed); }
.smi[aria-current="page"] { background: var(--sub-menu-item-container-background-selected); color: var(--sub-menu-item-label-foreground-selected); }
.smi:focus-visible { outline: var(--sub-menu-item-focus-ring-width) solid var(--sub-menu-item-focus-ring-color); outline-offset: calc(-1 * var(--sub-menu-item-focus-ring-width)); }
.smi[aria-disabled="true"] { background: var(--sub-menu-item-container-background-disabled); color: var(--sub-menu-item-label-foreground-disabled); cursor: not-allowed; }

/* Collapsible Menu Item */
.smi-group { display: flex; flex-direction: column; }

  .smi-group-clip { opacity: 0; transition: opacity var(--sub-menu-item-group-transition), visibility var(--sub-menu-item-group-transition); }
