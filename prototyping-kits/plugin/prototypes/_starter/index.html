   .disabled on an ancestor dims it. The text wraps. */
.ti-hint { display: flex; align-items: flex-start; gap: var(--input-hint-gap); font: var(--input-hint-font); color: var(--input-hint-foreground); }
.ti-hint .icon { flex: none; font-size: var(--input-hint-icon-size); color: var(--input-hint-icon-foreground); }
.ti-hint.error { color: var(--input-hint-foreground-error); }
.ti-hint.error .icon { color: var(--input-hint-icon-foreground-error); }
:is(.ti-hint.disabled, .disabled .ti-hint) { color: var(--input-hint-foreground-disabled); }
:is(.ti-hint.disabled, .disabled .ti-hint) .icon { color: var(--input-hint-icon-foreground-disabled); }

/* Input Label (atom, draft) — <label class="ti-label" for="…">Name [<span class="icon">info</span>] [<span class="req">(required)</span> | <span class="opt">(optional)</span>]</label>.
   With a sub label wrap both: <div class="input-label"><label class="ti-label">…</label><span class="ti-sublabel">…</span></div>.
   Dims with .disabled on itself or any ancestor (the Input assembly passes it down). "(required)" is a word, styled like "(optional)", never an asterisk. */
.input-label { display: flex; flex-direction: column; gap: var(--input-label-gap); }
.ti-label { display: flex; flex-wrap: wrap; align-items: center; gap: var(--input-label-row-gap); font: var(--input-label-name-font); color: var(--input-label-name-foreground); }
.ti-label .icon { font-size: var(--input-label-icon-size); color: var(--input-label-icon-foreground); }
.ti-label :is(.req, .opt) { font: var(--input-label-optional-font); color: var(--input-label-optional-foreground); }
.ti-sublabel { font: var(--input-label-sub-label-font); color: var(--input-label-sub-label-foreground); }
:is(.ti-label.disabled, .disabled .ti-label) { color: var(--input-label-name-foreground-disabled); }
:is(.ti-label.disabled, .disabled .ti-label) .icon { color: var(--input-label-icon-foreground-disabled); }

/* Label (atom) — <span class="chips-label [outlined|plain] [sharp]">Text</span>. Categories only, always neutral (status is a Status Label); bold is the default.
   Bold's border (fill-coloured) sits outside the box, so bold is 2 × border taller; outlined and plain keep theirs inside the padding.
   .chips-status is the former Status Chip, kept as an alias of a plain neutral label. Static: no interaction states. */
.chips-label, .chips-status { --_bg: var(--label-neutral-bold-container-background); --_bc: var(--label-neutral-bold-container-border-color);
  --_fg: var(--label-neutral-bold-text-foreground); --_bw: var(--label-bold-container-border-width); --_in: 0px;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--label-container-gap); flex: none; box-sizing: content-box;
  padding: calc(var(--label-container-padding) - var(--_in)); border: var(--_bw) solid var(--_bc); border-radius: var(--label-container-radius-rounded);
  background: var(--_bg); color: var(--_fg); font: var(--label-text-font); }

.chips-label.outlined { --_bw: var(--label-outlined-container-border-width); --_in: var(--_bw); }
.chips-label.plain, .chips-status { --_bw: var(--label-plain-container-border-width); --_bc: var(--label-plain-container-border-color); --_in: var(--_bw); }

/* Meter (atom, draft) — status comes from value vs thresholds; set the class to match. Thresholds and fill are % of the total.
   <div class="meter [warning|error] [sharp]" role="meter" aria-label="Storage" aria-valuenow="72" aria-valuemin="0" aria-valuemax="128" aria-valuetext="72 of 128 GB, storage almost full">
     <div class="meter-details"><span class="meter-label">Storage</span><span class="meter-value">72 of 128 GB</span></div>
     <div class="meter-track"><div class="meter-bar" style="width: 56%"></div><span class="meter-threshold" style="left: 75%"></span><span class="meter-threshold" style="left: 90%"></span></div>
     [<div class="meter-status"><span class="icon">warning</span>Storage almost full</div>]</div> */
.meter { --_fill: var(--meter-indicator-background); --_icon: var(--meter-indicator-background);
  display: flex; flex-direction: column; gap: var(--meter-container-gap); width: 100%; }
.meter.warning { --_fill: var(--meter-warning-indicator-background); --_icon: var(--meter-warning-icon-foreground); }
.meter.error { --_fill: var(--meter-error-indicator-background); --_icon: var(--meter-error-icon-foreground); }
.meter-details { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--meter-label-gap); }
.meter-label { font: var(--meter-label-font); color: var(--meter-label-foreground); }
.meter-value { font: var(--meter-value-font); color: var(--meter-value-foreground); font-variant-numeric: tabular-nums; }
/* the track has no overflow clip so threshold marks can stand proud of it */
.meter-track { position: relative; height: var(--meter-track-height); border-radius: var(--meter-track-radius-rounded); background: var(--meter-track-background); }
.meter-bar { position: absolute; inset-block: 0; inset-inline-start: 0; max-width: 100%; border-radius: inherit; background: var(--_fill);
  transition: width var(--meter-indicator-transition), background-color var(--meter-indicator-transition); }
.meter-threshold { position: absolute; top: 50%; width: var(--meter-threshold-width); height: var(--meter-threshold-height);
  translate: -50% -50%; background: var(--meter-threshold-background); }
.meter-status { display: flex; align-items: center; gap: var(--meter-status-gap); font: var(--meter-status-font); color: var(--meter-status-foreground); }
.meter-status .icon { font-size: var(--meter-icon-size); color: var(--_icon); }

.meter.sharp .icon { --icon-style: sharp; }
/* reduced motion: the bar jumps; the colour change stays (patterns 6.66) */
@media (prefers-reduced-motion: reduce) { .meter-bar { transition: background-color var(--meter-indicator-transition); } }

/* Notification Indicator (atom) — <span class="indicator [sm|lg]">3</span>. Class default is medium (single digit) so existing
   markup keeps working; .lg is the Figma default (up to "99+"), .sm the bare dot. The old .with-icon / .lg-icon types are gone:
   use .icon-indicator, or the Avatar's own status. Border is a zero-width theming hook (inset, so it never adds size). */
.indicator { display: inline-flex; align-items: center; justify-content: center; flex: none; box-sizing: border-box;
  width: var(--notification-indicator-container-size-medium); height: var(--notification-indicator-container-size-medium);
  border-radius: var(--notification-indicator-container-radius); background: var(--notification-indicator-container-background);
  box-shadow: inset 0 0 0 var(--notification-indicator-container-border-width) var(--notification-indicator-container-border-color);
  color: var(--notification-indicator-value-foreground); font: var(--notification-indicator-value-font); white-space: nowrap; }
.indicator.lg { width: auto; min-width: var(--notification-indicator-container-min-width-large); height: var(--notification-indicator-container-height-large);
  padding: 0 var(--notification-indicator-container-padding-x-large); }
.indicator.sm { width: var(--notification-indicator-container-size-small); height: var(--notification-indicator-container-size-small); font-size: 0; }

/* Priority Pill (atom) — lozenge: <span class="chips-pill [medium|high|urgent] [small]"><span class="chips-pill-index"><span class="icon">arrow_down</span></span><span class="chips-pill-text">Low</span></span>
   badge: <span class="chips-pill badge …" role="img" aria-label="Priority 1, urgent"><span class="chips-pill-index" aria-hidden="true">1</span></span>.
   Low is the default level. The index circle is a knockout: filled with the label colour, its glyph or rank drawn in the pill colour. */
.chips-pill { --_bg: var(--priority-pill-low-container-background); --_cbg: var(--priority-pill-low-circle-background);
  --_cfg: var(--priority-pill-low-circle-foreground); --_fg: var(--priority-pill-low-label-foreground);
  --_c: var(--priority-pill-circle-size-large); --_py: var(--priority-pill-container-padding-y-large); --_ps: var(--priority-pill-container-padding-start-large);
  --_pe: var(--priority-pill-container-padding-end-large); --_pb: var(--priority-pill-container-padding-end-badge-large);
  --_lp: var(--priority-pill-label-padding-end-large); --_lf: var(--priority-pill-label-font-large); --_rf: var(--priority-pill-rank-font-large);
  display: inline-flex; align-items: center; gap: var(--priority-pill-container-gap); flex: none; white-space: nowrap;
  padding: var(--_py) var(--_pe) var(--_py) var(--_ps); border-radius: var(--priority-pill-container-radius); background: var(--_bg); color: var(--_fg); font: var(--_lf); }
.chips-pill.small { --_c: var(--priority-pill-circle-size-small); --_py: var(--priority-pill-container-padding-y-small); --_ps: var(--priority-pill-container-padding-start-small);
  --_pe: var(--priority-pill-container-padding-end-small); --_pb: var(--priority-pill-container-padding-end-badge-small);
  --_lp: var(--priority-pill-label-padding-end-small); --_lf: var(--priority-pill-label-font-small); --_rf: var(--priority-pill-rank-font-small); }
.chips-pill.medium { --_bg: var(--priority-pill-medium-container-background); --_cbg: var(--priority-pill-medium-circle-background); --_cfg: var(--priority-pill-medium-circle-foreground); --_fg: var(--priority-pill-medium-label-foreground); }
.chips-pill.high { --_bg: var(--priority-pill-high-container-background); --_cbg: var(--priority-pill-high-circle-background); --_cfg: var(--priority-pill-high-circle-foreground); --_fg: var(--priority-pill-high-label-foreground); }
.chips-pill.urgent { --_bg: var(--priority-pill-urgent-container-background); --_cbg: var(--priority-pill-urgent-circle-background); --_cfg: var(--priority-pill-urgent-circle-foreground); --_fg: var(--priority-pill-urgent-label-foreground); }
.chips-pill.badge { gap: 0; padding-inline-end: var(--_pb); }
.chips-pill-index { display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--_c); height: var(--_c);
  border-radius: var(--priority-pill-circle-radius); background: var(--_cbg); color: var(--_cfg); font: var(--_rf); }
.chips-pill-index .icon { font-size: var(--priority-pill-glyph-size); color: inherit; }
.chips-pill-text { padding-inline-end: var(--_lp); }

/* Progress Bar (atom) — label row / indicator group. Width comes from the container.
   <div class="progress-bar [lg] [sharp] [indeterminate|buffering] [no-track]" role="progressbar" aria-label="…" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
     <div class="pb-details"><span class="pb-label">Label</span>[<span class="pb-more">detail</span>]</div>
     <div class="pb-track">[<div class="pb-buffer" style="width: 75%"></div>]<div class="pb-bar" style="width: 40%"></div></div></div> */
.progress-bar { --_r: var(--progress-bar-track-radius-small); display: flex; flex-direction: column; gap: var(--progress-bar-gap); width: 100%; }
.pb-details { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--progress-bar-details-gap); }
.pb-label, .pb-more { font: var(--progress-bar-label-font); color: var(--progress-bar-label-foreground); }
.pb-track { position: relative; height: var(--progress-bar-track-height-small); border-radius: var(--_r); background: var(--progress-bar-track-background); overflow: hidden; }
.pb-bar, .pb-buffer { position: absolute; top: 0; bottom: 0; left: 0; border-radius: var(--_r); }
.pb-bar { background: var(--progress-bar-indicator-background); transition: width var(--progress-bar-indicator-transition); }
.pb-buffer { background: var(--progress-bar-buffer-background); transition: width var(--progress-bar-indicator-transition); }
.progress-bar.lg { --_r: var(--progress-bar-track-radius-large); }
.progress-bar.lg .pb-track { height: var(--progress-bar-track-height-large); }
.progress-bar.sharp { --_r: var(--progress-bar-track-radius-sharp); }
.progress-bar.no-track .pb-track { background: none; }

  animation: pb-slide var(--progress-bar-indicator-duration-indeterminate) linear infinite; }
@keyframes pb-slide { from { left: calc(-1 * var(--progress-bar-indicator-width-indeterminate)); } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .progress-bar.indeterminate .pb-bar { animation: none; } .pb-bar, .pb-buffer { transition: none; } }

/* Radio Button (atom). Markup: <label class="radio [md]"><input type="radio" name="…"><span class="rb-ring"></span>Label</label>
   Large is the default; .md (old .sm kept as an alias) is the dense size. The ring's margin centres it in the fixed target square,
   so the label sits right against the target (no gap). The dot (::after) is shown only when checked, disabled included. */
.radio input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.radio { --_ring: var(--radio-button-ring-size-large); --_pad: var(--radio-button-ring-padding-large); --_dot: var(--radio-button-dot-size-large);
  display: inline-flex; align-items: center; gap: var(--radio-button-container-gap); position: relative; cursor: pointer;
  min-height: var(--radio-button-target-size); font: var(--radio-button-label-font); color: var(--radio-button-label-foreground); }
.radio.md, .radio.sm { --_ring: var(--radio-button-ring-size-medium); --_pad: var(--radio-button-ring-padding-medium); --_dot: var(--radio-button-dot-size-medium); }
.rb-ring { flex: none; box-sizing: border-box; display: grid; place-items: center; width: var(--_ring); height: var(--_ring); padding: var(--_pad);
  margin: calc((var(--radio-button-target-size) - var(--_ring)) / 2);
  border: var(--radio-button-ring-border-width) solid var(--radio-button-ring-border-color-enabled); border-radius: var(--radio-button-ring-radius);
  transition: border-color var(--radio-button-transition); }
.rb-ring::after { content: ""; display: none; width: var(--_dot); height: var(--_dot); border-radius: var(--radio-button-ring-radius);
  background: var(--radio-button-dot-background-selected); }
.radio:hover .rb-ring { border-color: var(--radio-button-ring-border-color-hover); }
.radio input:checked + .rb-ring { border-color: var(--radio-button-ring-border-color-selected); }
.radio input:checked + .rb-ring::after { display: block; }
.radio:hover input:checked + .rb-ring { border-color: var(--radio-button-ring-border-color-selected-hover); }
.radio input:focus-visible + .rb-ring { outline: var(--radio-button-focus-ring-width) solid var(--radio-button-focus-ring-color); outline-offset: 0; }
.radio:has(input:disabled) { cursor: not-allowed; color: var(--radio-button-label-foreground-disabled); }
.radio input:disabled + .rb-ring, .radio:hover input:disabled + .rb-ring { border-color: var(--radio-button-ring-border-color-disabled); }
.radio input:disabled + .rb-ring::after { background: var(--radio-button-dot-background-disabled); }

/* Scrim (atom) — drawn by its owner, never placed by hand: <div class="scrim [modal]" aria-hidden="true"></div> inside a
   position:relative/fixed frame, or as the owner's dialog::backdrop. No motion of its own; it enters and leaves with the owner. */
.scrim { position: absolute; inset: 0; background: var(--scrim-barrier-background-scrim); border-radius: var(--scrim-barrier-radius); }
.scrim.modal { background: var(--scrim-barrier-background-modal); }

/* Scrollbar (atom) — two uses:
   1. .scrollable on any overflowing region styles its native scrollbars (gutter, padded pill handle, ghost tint on hover).
   2. Drawn bar for static layouts: <div class="scrollbar [horizontal] [hover]" style="--_len: .4; --_pos: .1"><span class="scrollbar-handle"></span></div>
      --_len / --_pos are the handle's length and offset as a 0–1 share of the track (the region supplies them in a real build). */
.scrollable { scrollbar-color: var(--scrollbar-handle-background) var(--scrollbar-track-background); }
.scrollable:hover { scrollbar-color: var(--scrollbar-handle-background-hover) var(--scrollbar-track-background-hover); }
.scrollable::-webkit-scrollbar { width: var(--scrollbar-container-thickness); height: var(--scrollbar-container-thickness); background: var(--scrollbar-track-background); }
.scrollable::-webkit-scrollbar:hover { background: var(--scrollbar-track-background-hover); }
.scrollable::-webkit-scrollbar-thumb { background: var(--scrollbar-handle-background) padding-box; border: var(--scrollbar-container-padding) solid transparent;
  border-radius: var(--scrollbar-handle-radius); }
.scrollable::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-handle-background-hover); }
.scrollable::-webkit-scrollbar-corner { background: transparent; }
.scrollbar { --_len: .3; --_pos: 0; position: relative; box-sizing: border-box; flex: none;
  width: var(--scrollbar-container-thickness); height: 100%; padding: var(--scrollbar-container-padding); background: var(--scrollbar-track-background); }
.scrollbar.horizontal { width: 100%; height: var(--scrollbar-container-thickness); }
.scrollbar-handle { position: absolute; left: var(--scrollbar-container-padding); width: var(--scrollbar-handle-thickness);
  top: calc(var(--scrollbar-container-padding) + (100% - 2 * var(--scrollbar-container-padding)) * var(--_pos));
  height: calc((100% - 2 * var(--scrollbar-container-padding)) * var(--_len));
  border-radius: var(--scrollbar-handle-radius); background: var(--scrollbar-handle-background); }
.scrollbar.horizontal .scrollbar-handle { top: var(--scrollbar-container-padding); height: var(--scrollbar-handle-thickness);
  left: calc(var(--scrollbar-container-padding) + (100% - 2 * var(--scrollbar-container-padding)) * var(--_pos));
  width: calc((100% - 2 * var(--scrollbar-container-padding)) * var(--_len)); }
.scrollbar:hover, .scrollbar.hover { background: var(--scrollbar-track-background-hover); }
.scrollbar:hover .scrollbar-handle, .scrollbar.hover .scrollbar-handle { background: var(--scrollbar-handle-background-hover); }

/* Skeleton (atom, draft) — shapes are aria-hidden; the region they fill gets aria-busy="true" plus one polite status message.
   <div class="skeleton-text [sharp]" aria-hidden="true"><span class="skeleton"></span><span class="skeleton" style="width: 60%"></span></div>
   <span class="skeleton block [sharp]" style="width: 100%; height: 120px" aria-hidden="true"></span>
   <span class="skeleton circle" style="width: 40px; height: 40px" aria-hidden="true"></span>
   Text lines fill their container; block and circle sizes are set by the placer to the content they stand in for. */
.skeleton { display: block; height: var(--skeleton-text-height); background: var(--skeleton-container-background);
  border-radius: var(--skeleton-text-container-radius-rounded);
  animation: skeleton-pulse var(--skeleton-container-duration) var(--skeleton-container-easing) infinite alternate; }
.skeleton.block { height: auto; border-radius: var(--skeleton-block-container-radius-rounded); }
.skeleton.circle { height: auto; aspect-ratio: 1; border-radius: var(--skeleton-circle-container-radius); }
.skeleton-text { display: flex; flex-direction: column; gap: var(--skeleton-text-gap); }
.skeleton.sharp:not(.circle), .skeleton-text.sharp .skeleton { border-radius: var(--skeleton-container-radius-sharp); }
@keyframes skeleton-pulse { to { background: var(--skeleton-container-background-pulse); } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

/* Slider (atom) — absorbs Range Selector (Range = two thumbs). Built by script from data-*:
   <div class="sl [sharp] [disabled]" data-min="0" data-max="100" [data-step="10"] data-values="50|10,90" data-label="…"></div>
   → .sl-track > .sl-fill, .sl-dot (one per stop, --f = 0..1), .sl-handle (role="slider"; --p1 / --p2 = 0..1 set on .sl).
   The active track runs to the thumb centre; thumbs overhang the track ends. Selected = a thumb dragged (.dragging) or keyboard-focused.
   The value label above a held thumb reads the handle's aria-valuenow (the script keeps it current). */
.sl { --p1: 0; --p2: 0; /* thumb positions 0..1, set inline by the script */ --_pos1: calc(100% * var(--p1, 0)); --_pos2: calc(100% * var(--p2, 0)); --_c: var(--slider-active-track-background-default);
  --_t: var(--slider-thumb-background-default); --_r: var(--slider-thumb-radius-rounded);
  position: relative; width: 100%; height: var(--slider-thumb-size-active); cursor: pointer; touch-action: pan-y; user-select: none; }
.sl-track { position: absolute; left: 0; right: 0; top: 50%; height: var(--slider-track-height); transform: translateY(-50%);
  border-radius: var(--slider-track-radius-rounded); background: var(--slider-track-background); }
.sl-fill { position: absolute; top: 0; bottom: 0; left: 0; width: var(--_pos1); background: var(--_c); } /* square-ended on both shapes */
.sl.range .sl-fill { left: var(--_pos1); width: calc(var(--_pos2) - var(--_pos1)); }
.sl-dot { --f: 0; /* stop position 0..1, set inline */ position: absolute; top: 50%; width: var(--slider-step-dot-size); height: var(--slider-step-dot-size); transform: translate(-50%, -50%);
  left: calc(var(--slider-step-inset) + (100% - 2 * var(--slider-step-inset)) * var(--f)); background: var(--slider-step-dot-background); pointer-events: none; }
.sl-handle { position: absolute; top: 50%; left: var(--_pos1); width: var(--slider-thumb-size); height: var(--slider-thumb-size);
  transform: translate(-50%, -50%); border-radius: var(--_r); background: var(--_t); touch-action: none; outline: 0; }
.sl-handle[data-i="1"] { left: var(--_pos2); }
.sl-handle::before { content: ""; position: absolute; left: 50%; top: 50%; width: var(--slider-thumb-touch-target-size); height: var(--slider-thumb-touch-target-size); transform: translate(-50%, -50%); }
.sl-handle:hover, .sl-handle.dragging { width: var(--slider-thumb-size-active); height: var(--slider-thumb-size-active); }
.sl:has(.sl-handle:focus-visible, .sl-handle.dragging) { --_c: var(--slider-active-track-background-selected); --_t: var(--slider-thumb-background-selected); }
.sl-handle:focus-visible { outline: var(--slider-focus-ring-width) solid var(--slider-focus-ring-color); outline-offset: var(--slider-focus-ring-width); }
/* value label: above the held, dragged or keyboard-adjusted thumb (never below, where the finger hides it); one per thumb in range mode */
.sl-handle::after { content: attr(aria-valuenow); position: absolute; left: 50%; bottom: calc(100% + var(--slider-value-label-gap)); transform: translateX(-50%);
  font: var(--slider-value-label-font); color: var(--slider-value-label-foreground); white-space: nowrap; pointer-events: none; visibility: hidden; }
.sl-handle:is(:active, .dragging, :focus-visible)::after { visibility: visible; }
.sl.sharp { --_r: var(--slider-thumb-radius-sharp); }
.sl.sharp .sl-track { border-radius: var(--slider-track-radius-sharp); }
.sl.disabled { cursor: not-allowed; --_c: var(--slider-active-track-background-disabled); --_t: var(--slider-thumb-background-disabled); }
.sl.disabled .sl-handle { width: var(--slider-thumb-size); height: var(--slider-thumb-size); }

/* Sparkline (atom, draft) — plot first, value after, so the latest point sits beside the number. The SVG is drawn by the prototype
   (viewBox matches the plot; points scaled to its own range); the role="img" label states the trend in real values.
   <span class="sparkline"><svg class="sparkline-plot" viewBox="0 0 80 20" preserveAspectRatio="none" role="img" aria-label="Up from 12 to 18 over 7 days">
     <polyline class="sparkline-line" points="0,16 13,14 26,15 40,10 53,11 66,6 78,4"/><circle class="sparkline-marker" cx="78" cy="4"/></svg>
     [<span class="sparkline-value">18</span>]</span>
   A gap in the data: end the polyline and start a new one after the gap; never bridge it. */
.sparkline { display: inline-flex; align-items: center; gap: var(--sparkline-container-gap); flex: none; }
.sparkline-plot { flex: none; width: var(--sparkline-plot-width); height: var(--sparkline-plot-height); overflow: visible; }
.sparkline-line { fill: none; stroke: var(--sparkline-line-foreground); stroke-width: var(--sparkline-line-width);

.sparkline-value { font: var(--sparkline-value-font); color: var(--sparkline-value-foreground); font-variant-numeric: tabular-nums; }

/* Status Label (atom) — <span class="status-label [neutral|info|success|warning|error] [sharp]"><span class="icon">lightbulb</span> | <span class="dot"></span>Label[<button class="status-label-discard" aria-label="Remove …"><span class="icon">close</span></button>]</span>.
   The leading icon is the default (one glyph per status: neutral lightbulb, info info, success check_circle, warning warning, error error);

   The label text's own side padding is applied as container padding + margins on the leading/discard parts, so bare text works. */
.status-label { --_bg: var(--status-label-neutral-container-background); --_border: var(--status-label-neutral-container-border-color);
  --_lead: var(--status-label-neutral-leading-foreground); --_fg: var(--status-label-neutral-label-foreground);
  --_pad: calc(var(--status-label-container-padding-x) + var(--status-label-label-padding-x));
  display: inline-flex; align-items: center; gap: var(--status-label-container-gap); flex: none; box-sizing: border-box;
  min-height: var(--status-label-container-height); padding: var(--status-label-container-padding-y) var(--_pad);
  border: var(--status-label-container-border-width) solid var(--_border); border-radius: var(--status-label-container-radius-rounded);
  background: var(--_bg); color: var(--_fg); font: var(--status-label-label-font); }
.status-label.sharp { border-radius: var(--status-label-container-radius-sharp); }
.status-label.info { --_bg: var(--status-label-info-container-background); --_border: var(--status-label-info-container-border-color); --_lead: var(--status-label-info-leading-foreground); --_fg: var(--status-label-info-label-foreground); }
.status-label.success { --_bg: var(--status-label-success-container-background); --_border: var(--status-label-success-container-border-color); --_lead: var(--status-label-success-leading-foreground); --_fg: var(--status-label-success-label-foreground); }
.status-label.warning { --_bg: var(--status-label-warning-container-background); --_border: var(--status-label-warning-container-border-color); --_lead: var(--status-label-warning-leading-foreground); --_fg: var(--status-label-warning-label-foreground); }
.status-label.error { --_bg: var(--status-label-error-container-background); --_border: var(--status-label-error-container-border-color); --_lead: var(--status-label-error-leading-foreground); --_fg: var(--status-label-error-label-foreground); }
/* leading: a leading-size box (dot centred in it, or the icon), pulled back to the container padding */
.status-label > .dot, .status-label > .icon:first-child { flex: none; margin-inline: calc(-1 * var(--status-label-label-padding-x)) var(--status-label-label-padding-x); color: var(--_lead); }
.status-label > .dot { box-sizing: content-box; width: var(--status-label-dot-size); height: var(--status-label-dot-size);
  padding: calc((var(--status-label-leading-size) - var(--status-label-dot-size)) / 2); border-radius: var(--status-label-container-radius-rounded);
  background: var(--_lead); background-clip: content-box; }
.status-label > .icon:first-child { font-size: var(--status-label-icon-size); }
/* discard: a bare close glyph that is a real button */
.status-label-discard { display: inline-flex; flex: none; padding: 0; border: 0; background: none; cursor: pointer;
  margin-inline: var(--status-label-label-padding-x) calc(-1 * var(--status-label-label-padding-x)); color: var(--status-label-discard-foreground); border-radius: var(--status-label-container-radius-rounded); }
.status-label-discard .icon { font-size: var(--status-label-discard-size); color: inherit; }
.status-label-discard:focus-visible { outline: var(--status-label-discard-focus-ring-width) solid var(--status-label-discard-focus-ring-color); outline-offset: 0; }

/* Switch (atom). Markup: <label class="switch [pending]"><input type="checkbox" role="switch" [aria-busy="true"]><span class="sw-track">
     <span class="icon sw-check">check_mark</span> (thumb check, the default) | <span class="icon sw-on">mic</span><span class="icon sw-off">mic_off</span> (track icons) | nothing (plain)
   </span>Label</label>
   The thumb (::after) sits over the track icons, so it covers the one at its end; the thumb check rides on the thumb and shows only when on.
   Pending (.pending or aria-busy="true" on the input): a spinner in the thumb replaces the check and toggles are ignored.
   The thumb slides on the spring; track colour and check change on the feedback timing. Plain transitions reverse mid-flight on a re-toggle;
   ponytail: the 1.3× mid-slide thumb stretch isn't drawn (no token for the factor), add a keyframe if the prototype needs it. */
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.switch { display: inline-flex; align-items: center; gap: var(--switch-label-gap); position: relative; cursor: pointer;
  min-height: var(--switch-touch-target-size-minimum); font: var(--switch-label-font); color: var(--switch-label-foreground); }
.sw-track { position: relative; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;
  width: var(--switch-track-width); height: var(--switch-track-height); padding: var(--switch-track-padding); border-radius: var(--switch-track-radius);
  background: var(--switch-track-background-off); transition: background-color var(--switch-feedback-transition); }
.sw-track .icon { font-size: var(--switch-icon-size); color: var(--switch-icon-foreground); }
.sw-track::after { content: ""; position: absolute; top: var(--switch-track-padding); left: var(--switch-track-padding);
  width: var(--switch-thumb-size); height: var(--switch-thumb-size); border-radius: var(--switch-track-radius);
  background: var(--switch-thumb-background); transition: transform var(--switch-transition); }
.switch input:checked + .sw-track { background: var(--switch-track-background-on); }
.switch input:checked + .sw-track::after { transform: translateX(var(--switch-thumb-travel)); }
/* thumb check and pending spinner: centred on the thumb, moved with it */
.sw-track .sw-check, .switch:is(.pending, :has(input[aria-busy="true"])) .sw-track::before {
  position: absolute; z-index: 1; box-sizing: border-box; width: var(--switch-thumb-icon-size); height: var(--switch-thumb-icon-size);
  top: calc(var(--switch-track-padding) + (var(--switch-thumb-size) - var(--switch-thumb-icon-size)) / 2);
  left: calc(var(--switch-track-padding) + (var(--switch-thumb-size) - var(--switch-thumb-icon-size)) / 2);
  transition: translate var(--switch-transition), opacity var(--switch-feedback-transition); }
.sw-track .sw-check { font-size: var(--switch-thumb-icon-size); color: var(--switch-thumb-icon-foreground); opacity: 0; }
.switch input:checked + .sw-track .sw-check, .switch input:checked + .sw-track::before { translate: var(--switch-thumb-travel) 0; }

.switch:is(.pending, :has(input[aria-busy="true"])) { pointer-events: none; }
.switch:is(.pending, :has(input[aria-busy="true"])) .sw-check { visibility: hidden; }
.switch:is(.pending, :has(input[aria-busy="true"])) .sw-track::before { content: ""; border-radius: 50%;
  border: var(--switch-pending-indicator-stroke-width) solid var(--switch-thumb-icon-foreground); border-inline-end-color: transparent;
  animation: btn-spin var(--switch-pending-indicator-duration) linear infinite; }
.switch input:focus-visible + .sw-track { outline: var(--switch-focus-ring-width) solid var(--switch-focus-ring-color); outline-offset: calc(-1 * var(--switch-focus-ring-width)); }
.switch:has(input:disabled) { cursor: not-allowed; color: var(--switch-label-foreground-disabled); }
.switch input:disabled + .sw-track { background: var(--switch-track-background-disabled); }
.switch input:disabled + .sw-track::after { background: var(--switch-thumb-background-disabled); }
.switch input:disabled + .sw-track .icon { color: var(--switch-icon-foreground-disabled); }
.switch input:disabled + .sw-track .sw-check { color: var(--switch-thumb-icon-foreground-disabled); }
/* reduced motion: the thumb jumps; colour and check still fade */
@media (prefers-reduced-motion: reduce) { .sw-track::after { transition: none; } .sw-track .sw-check, .sw-track::before { transition: opacity var(--switch-feedback-transition); }
  .switch .sw-track::before { animation: none; } }

/* Tag (atom, draft) — static note with an arrow point; the rounded tip is simplified to a straight-edged point.
   Markup: <span class="tag [left] [sharp]" role="note"><span class="tag-text">Label</span></span> */
.tag { display: inline-flex; height: var(--tag-container-height); }
.tag-text { box-sizing: border-box; height: var(--tag-container-height); padding: var(--tag-label-padding-y) var(--tag-label-padding-x); font: var(--tag-label-font);
  color: var(--tag-label-foreground); background: var(--tag-container-background); white-space: nowrap;
  border-radius: var(--tag-container-radius-rounded) 0 0 var(--tag-container-radius-rounded); }

.tag.left { flex-direction: row-reverse; }
.tag.left .tag-text { border-radius: 0 var(--tag-container-radius-rounded) var(--tag-container-radius-rounded) 0; }
.tag.left::after { clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.tag.sharp .tag-text { border-radius: var(--tag-container-radius-sharp); }

/* Tooltip (atom) — <span class="tooltip [top|left|right] [sharp]" role="tooltip">Label</span>; the class names the edge the pointer sits on
   (default bottom = bubble above its trigger). Kind (name | description) is content only. The label wraps rather than truncating.
   Live: wrap trigger + tooltip in .tt-anchor; it fades and slides in on hover/focus, leaves faster, and stays while the pointer is on the bubble.
   The transparent border is the edge forced-colours mode draws.
   The pointer is ::after, drawn outside the bubble; on left/right it turns, so width and height swap. */
.tooltip { --_pw: var(--tooltip-pointer-width); --_ph: var(--tooltip-pointer-height);
  --_tip: polygon(0 0, 100% 0, 56% 90%, 50% 100%, 44% 90%); /* rounded tip: stops just short of the point */
  position: relative; display: inline-flex; align-items: center; justify-content: center; text-align: center;
  padding: var(--tooltip-container-padding-y) var(--tooltip-container-padding-x); border-radius: var(--tooltip-container-radius-rounded);
  border: var(--tooltip-container-border-width) solid var(--tooltip-container-border-color);
  background: var(--tooltip-container-background); color: var(--tooltip-label-foreground); font: var(--tooltip-label-font); box-shadow: var(--tooltip-container-shadow); }
.tooltip.sharp { --_tip: polygon(0 0, 100% 0, 50% 100%); border-radius: var(--tooltip-container-radius-sharp); }
.tooltip::after { content: ""; position: absolute; width: var(--_pw); height: var(--_ph); background: var(--tooltip-pointer-background); clip-path: var(--_tip);
  top: 100%; left: calc(50% - var(--_pw) / 2); }
.tooltip.top::after { top: auto; bottom: 100%; transform: rotate(180deg); }
.tooltip:is(.left, .right)::after { top: calc(50% - var(--_ph) / 2); left: auto; transform-origin: center; }
.tooltip.left::after { right: calc(100% - (var(--_pw) - var(--_ph)) / 2); transform: rotate(90deg); }
.tooltip.right::after { left: calc(100% - (var(--_pw) - var(--_ph)) / 2); transform: rotate(-90deg); }
/* live tooltips: shown on hover/focus of the anchor, sliding toward the trigger; no movement under reduced motion */
.tt-anchor { position: relative; display: inline-flex; }
.tt-anchor > .tooltip { --_gap: calc(var(--tooltip-pointer-height) * 2); --_slide: var(--tooltip-pointer-height);
  position: absolute; z-index: 10; pointer-events: none; opacity: 0; visibility: hidden; width: max-content; max-width: 90vw;
  bottom: calc(100% + var(--_gap)); left: 50%; transform: translateX(-50%); translate: 0 calc(-1 * var(--_slide));
  --_t: var(--tooltip-container-exit-duration) var(--tooltip-container-exit-easing);
  transition: opacity var(--_t), translate var(--_t), visibility var(--_t); }
/* a hit area over the gap, so the pointer can move onto the bubble without it closing */
.tt-anchor > .tooltip::before { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--_gap); }
.tt-anchor > .tooltip.top::before { top: auto; bottom: 100%; }
.tt-anchor > .tooltip:is(.left, .right)::before { top: 0; bottom: 0; height: auto; width: var(--_gap); }
.tt-anchor > .tooltip.left::before { left: auto; right: 100%; }
.tt-anchor > .tooltip.right::before { left: 100%; right: auto; }
.tt-anchor > .tooltip.top { bottom: auto; top: calc(100% + var(--_gap)); translate: 0 var(--_slide); }
.tt-anchor > .tooltip.left { bottom: auto; top: 50%; left: calc(100% + var(--_gap)); transform: translateY(-50%); translate: var(--_slide) 0; }
.tt-anchor > .tooltip.right { bottom: auto; top: 50%; left: auto; right: calc(100% + var(--_gap)); transform: translateY(-50%); translate: calc(-1 * var(--_slide)) 0; }
.tt-anchor:is(:hover, :focus-within) > .tooltip { opacity: 1; visibility: visible; translate: 0 0; pointer-events: auto;
  --_t: var(--tooltip-container-enter-duration) var(--tooltip-container-enter-easing); }
/* Escape dismisses until the pointer or focus leaves (the showcase script toggles .tt-dismissed) */
.tt-anchor.tt-dismissed > .tooltip { opacity: 0; visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .tt-anchor > .tooltip { transition: opacity var(--_t), visibility var(--_t); translate: 0 0; } }

/* ═════════════ MOLECULES ═════════════ */

/* Accordion (molecule) — markup: <div class="accordion [in-card] [sharp]"> > .acc-item ×n
   Selectable off: .acc-item > button.acc-header[aria-expanded] (title + .icon expand_more) + .acc-body
   Selectable on:  .acc-item > .acc-row > button.btn.icon-btn.subtle.acc-lead[aria-expanded] + button.acc-select[aria-pressed] (title + .icon.acc-mark) ; + .acc-body
   No focus-ring token in the spec: browser default focus ring on the headers. No open/close transition for the body (none in Figma); the caret turns over the Caret Indicator's transition. */
.accordion { display: flex; flex-direction: column; gap: var(--accordion-container-gap); overflow: hidden;
  border-radius: var(--accordion-container-radius-rounded); }
.accordion.sharp { border-radius: var(--accordion-container-radius-sharp); }
.accordion.in-card { box-shadow: inset 0 0 0 var(--accordion-container-border-width) var(--accordion-container-border-color); }
.accordion.in-card .acc-item:not(:last-child) { border-bottom: var(--accordion-divider-width) solid var(--accordion-divider-color); }
.acc-header, .acc-select { display: flex; align-items: center; gap: var(--accordion-header-gap); width: 100%; box-sizing: border-box;
  min-height: var(--accordion-header-height); padding: var(--accordion-header-padding); border: 0; cursor: pointer; text-align: start;
  background: var(--accordion-header-background-enabled); color: var(--accordion-title-foreground); font: var(--accordion-title-font); }
.acc-header > .acc-title, .acc-select > .acc-title { flex: 1; min-width: 0; overflow-wrap: anywhere; } /* titles wrap; the header grows */
.acc-header:hover, .acc-row:hover { background: var(--accordion-header-background-hover); }
.acc-header > .icon { font-size: var(--caret-indicator-icon-size-medium); color: var(--caret-indicator-icon-foreground); transition: transform var(--caret-indicator-icon-transition); }
@media (prefers-reduced-motion: reduce) { .acc-header > .icon { transition: none; } }
.acc-header[aria-expanded="true"] > .icon, .acc-lead[aria-expanded="true"] .icon { transform: rotate(180deg); }
.acc-row { display: flex; align-items: center; gap: var(--accordion-selectable-header-gap); box-sizing: border-box;
  min-height: var(--accordion-header-height); padding: var(--accordion-selectable-header-padding); background: var(--accordion-header-background-enabled); }
.acc-row > .acc-select { flex: 1; min-width: 0; min-height: 0; padding: 0; gap: var(--accordion-selectable-header-gap); background: none; align-self: stretch; }
.accordion.sharp .acc-lead { border-radius: var(--accordion-container-radius-sharp); }
.acc-mark { box-sizing: border-box; width: var(--accordion-selected-mark-size); height: var(--accordion-selected-mark-size);
  display: grid; place-items: center; color: var(--accordion-selected-mark-foreground); }
.acc-select:not([aria-pressed="true"]) .acc-mark { display: none; }
.acc-body { display: none; flex-direction: column; gap: var(--accordion-content-gap); padding: var(--accordion-content-padding); }
.acc-header[aria-expanded="true"] + .acc-body, .acc-row:has(.acc-lead[aria-expanded="true"]) + .acc-body { display: flex; }

/* AI Suggestion (molecule, draft) — composes AI Mark, Button, Icon Button, Icon, Skeleton. Sits next to what it would change.
   <div class="ai-suggestion [sharp]" role="group" aria-label="Suggested value for Priority">
     <div class="ais-header"><button class="ai-mark">…Suggested</button>
       [<div class="ais-versions"><button class="btn icon-btn subtle sm" aria-label="Previous version"><span class="icon">chevron_left</span></button>
        <span class="ais-version">2 of 3</span><button class="btn icon-btn subtle sm" aria-label="Next version"><span class="icon">chevron_right</span></button></div>]</div>
     <div class="ais-body"><div class="ais-value">High</div>[<div class="ais-reason">Matches the last 3 orders from this site</div>]</div>
     <div class="ais-actions"><button class="btn outline sm">Accept</button><button class="btn outline-subtle sm">Reject</button>[<button class="btn text-gradient sm"><span class="btn-label">Refine</span></button>]</div></div>
   generating: replace .ais-body with a .skeleton-text and drop .ais-actions.
   applied: replace body + actions with <div class="ais-applied" role="status"><span class="icon">check_circle</span>Applied<button class="btn text sm">Undo</button></div>. */
.ai-suggestion { display: flex; flex-direction: column; gap: var(--ai-suggestion-container-gap); box-sizing: border-box; width: 100%;
  padding: var(--ai-suggestion-container-padding); background: var(--ai-suggestion-container-background);
  border: var(--ai-suggestion-container-border-width) solid var(--ai-suggestion-container-border-color);
  border-radius: var(--ai-suggestion-container-radius-rounded); }
.ais-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--ai-suggestion-header-gap); }
.ais-versions { display: flex; align-items: center; gap: var(--ai-suggestion-header-gap); }
.ais-version { font: var(--ai-suggestion-version-font); color: var(--ai-suggestion-version-foreground); font-variant-numeric: tabular-nums; }
.ais-body { display: flex; flex-direction: column; gap: var(--ai-suggestion-text-gap); }
.ais-value { font: var(--ai-suggestion-value-font); color: var(--ai-suggestion-value-foreground); overflow-wrap: anywhere; }
.ais-reason { font: var(--ai-suggestion-reason-font); color: var(--ai-suggestion-reason-foreground); }
.ais-actions { display: flex; flex-wrap: wrap; gap: var(--ai-suggestion-actions-gap); }
.ais-applied { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ai-suggestion-actions-gap);
  font: var(--ai-suggestion-applied-font); color: var(--ai-suggestion-applied-foreground); }
.ais-applied > .icon { font-size: var(--ai-suggestion-icon-size); color: var(--ai-suggestion-applied-icon-foreground); }
.ai-suggestion.sharp { border-radius: var(--ai-suggestion-container-radius-sharp); --icon-style: sharp; }
.ai-suggestion.sharp .btn { border-radius: var(--button-container-radius-sharp); }
.ai-suggestion.sharp .btn.icon-btn { border-radius: var(--icon-button-container-radius-sharp); }
.ai-suggestion.sharp .ai-mark { border-radius: var(--ai-mark-container-radius-sharp); }

/* Avatar Rail (molecule) — overlapping Avatars (ring, close and status off) plus an overflow counter. Replaces the old scrolling rail.
   Markup: <div class="chips-rail [xxxs|xxs|xs|s|m|l|xl|xxl|xxxl] [end]" role="group" aria-label="…, and 2 more">
     <span class="avatar [swatch]" aria-hidden="true">AB</span> ×2–4 [<span class="chips-rail-overflow" aria-hidden="true">+2</span>]</div>
   start stacking (default) paints each position above the next; .end keeps document order (each above the one before). */
.chips-rail { --_d: var(--avatar-container-size-medium); --_w: var(--avatar-rail-avatar-border-width); display: inline-flex; align-items: center; }
.chips-rail > * { position: relative; box-shadow: 0 0 0 var(--_w) var(--avatar-rail-avatar-border-color); }
.chips-rail > * + * { margin-inline-start: calc(var(--_d) * var(--avatar-rail-avatar-overlap-ratio) * -1); }
.chips-rail > .avatar { --_d: inherit; }
.chips-rail .avatar .av-close, .chips-rail .avatar .av-status, .chips-rail .avatar.ring::after { display: none; }
.chips-rail:not(.end) > :nth-child(1) { z-index: 5; }
.chips-rail:not(.end) > :nth-child(2) { z-index: 4; }
.chips-rail:not(.end) > :nth-child(3) { z-index: 3; }
.chips-rail:not(.end) > :nth-child(4) { z-index: 2; }
.chips-rail:not(.end) > :nth-child(5) { z-index: 1; }
.chips-rail-overflow { box-sizing: border-box; display: inline-grid; place-items: center; flex: none; width: var(--_d); height: var(--_d);
  border-radius: var(--avatar-rail-overflow-radius); background: var(--avatar-rail-overflow-background);
  border: var(--_w) solid var(--avatar-rail-overflow-border-color); color: var(--avatar-rail-overflow-label-foreground);
  font: var(--avatar-rail-overflow-label-font); font-size: calc(var(--_d) * var(--avatar-label-size-ratio)); line-height: 1; }
.chips-rail > .chips-rail-overflow { box-shadow: none; }
/* sizes */
.chips-rail.xxxs { --_d: var(--avatar-container-size-xxxsmall); --_w: var(--avatar-rail-avatar-border-width-xxxsmall); }
.chips-rail.xxs { --_d: var(--avatar-container-size-xxsmall); }
.chips-rail.xs { --_d: var(--avatar-container-size-xsmall); }
.chips-rail.s { --_d: var(--avatar-container-size-small); }
.chips-rail.l { --_d: var(--avatar-container-size-large); }
.chips-rail.xl { --_d: var(--avatar-container-size-xlarge); }
.chips-rail.xxl { --_d: var(--avatar-container-size-xxlarge); }
.chips-rail.xxxl { --_d: var(--avatar-container-size-xxxlarge); }

/* Breadcrumb (molecule) — the overflow control is an Icon Button (.btn.icon-btn.sm.outline-subtle) and its menu a compact Dropdown Menu,
   both styled by their own blocks; only placement is set here. Markup:
   <nav class="bc [accent]" aria-label="Breadcrumb"><ol class="bc-list">
     <li class="bc-li"><a class="bc-item" href="#">[<span class="icon bc-icon">location</span>]Sites</a><span class="icon bc-sep" aria-hidden="true">chevron_right</span></li> …
     <li class="bc-li"><span class="bc-item" aria-current="page">Dock 4</span></li></ol></nav>
   The separator ends each item, so a wrapped line always starts on a crumb. */
.bc-list { display: flex; flex-wrap: wrap; align-items: center; gap: var(--breadcrumb-container-row-gap) var(--breadcrumb-container-gap); list-style: none; margin: 0; padding: 0; }
.bc-li { display: inline-flex; align-items: center; gap: var(--breadcrumb-container-gap); }
.bc-li[hidden] { display: none; }
.bc-item { display: inline-flex; align-items: center; gap: var(--breadcrumb-crumb-gap); border-radius: var(--breadcrumb-crumb-radius);
  font: var(--breadcrumb-crumb-label-font); color: var(--breadcrumb-crumb-label-foreground-enabled); text-decoration: none; white-space: nowrap; }
.bc-item .bc-icon { font-size: var(--breadcrumb-crumb-icon-size); color: var(--breadcrumb-crumb-icon-foreground); }
a.bc-item:hover { color: var(--breadcrumb-crumb-label-foreground-hover); }
a.bc-item:focus-visible { outline: var(--breadcrumb-focus-ring-width) solid var(--breadcrumb-focus-ring-color); }
.bc-item[aria-current="page"] { color: var(--breadcrumb-crumb-label-foreground-current); }
.bc.accent .bc-item[aria-current="page"] { color: var(--breadcrumb-accent-crumb-label-foreground-current); }
.bc.accent .bc-item[aria-current="page"] .bc-icon { color: var(--breadcrumb-accent-crumb-icon-foreground-current); }
.bc-sep { font-size: var(--breadcrumb-separator-size); color: var(--breadcrumb-separator-foreground); }

/* Button Group (molecule) — items are subtle, sharp Buttons; the group owns fill, outline and dividers.
   Markup: <div class="btngrp [sm|lg] [sharp]" role="group" aria-label="…"><button class="btn btngrp-item">[<span class="icon">…</span>]<span class="btn-label">Label</span>[<span class="icon">…</span>]</button>…</div>
   Shape is rounded by default (Figma's is sharp); .sharp squares the outline only. The outline is an inset outline so it adds no height.
   Labels wrap; item heights are minimums and every item grows with the tallest. */
.btngrp { display: inline-flex; align-items: stretch; gap: var(--button-group-container-gap); padding: var(--button-group-container-padding); overflow: hidden;
  background: var(--button-group-container-background); border-radius: var(--button-group-container-radius-rounded);
  outline: var(--button-group-container-border-width) solid var(--button-group-container-border-color);
  outline-offset: calc(-1 * var(--button-group-container-border-width)); }
.btngrp.sharp { border-radius: var(--button-group-container-radius-sharp); }
.btngrp .btngrp-item { --_bg: var(--button-subtle-container-background-enabled); --_bg-h: var(--button-subtle-container-background-hover);
  --_bg-p: var(--button-subtle-container-background-pressed); --_bg-d: var(--button-subtle-container-background-disabled);
  --_fg: var(--button-subtle-label-foreground); --_fg-d: var(--button-subtle-label-foreground-disabled); --_ring-w: 0px;
  border-radius: var(--button-container-radius-sharp); }
.btngrp-item + .btngrp-item { border-inline-start: var(--button-group-divider-width) solid var(--button-group-divider-color); }
.btngrp .btngrp-item:focus-visible { outline-offset: calc(-1 * var(--button-focus-ring-width)); } /* inside, so the group's clip doesn't hide it */
.btngrp.sm .btngrp-item { --_lp: var(--button-label-padding-x-small); min-height: var(--button-container-height-small);
  padding-inline: var(--button-container-padding-x-small); font: var(--button-label-font-small); }
.btngrp.sm .btngrp-item .icon { font-size: var(--button-icon-size-small); }
.btngrp.lg .btngrp-item { --_lp: var(--button-label-padding-x-large); min-height: var(--button-container-height-large);
  padding-inline: var(--button-container-padding-x-large); font: var(--button-label-font-large); }
.btngrp.lg .btngrp-item .icon { font-size: var(--button-icon-size-large); }

/* Card (molecule) — standard: .card > .card-header + (.card-media | .card-body)… + .card-footer. Rounded by default; .sharp or [data-shape="sharp"] squares it.
   Collapsible: .card-sectioned[.gradient] > .cs-inner > button.cs-header[aria-expanded] (caret, .titles > .cs-title [.req] + .cs-subtitle) + .cs-content > div.
   .card-sectioned.ai is kept as an alias of .gradient. Footer buttons are Buttons at size small: one outline (.btn.outline.sm) by default,
   two = text then outline. An AI-produced card carries an AI Mark (.ai-mark) in .card-header; "(required)" on .cs-title is <span class="req">(required)</span>.
   Opens item: .card.opens with <a class="card-link" href="…"> on the headline; the link is stretched over the card, and buttons inside sit above it
   as their own targets. Hover and pressed tints and the focus ring (one step out, following the radius) are drawn on the card. */
.card { position: relative; display: flex; flex-direction: column; overflow: hidden; overflow-wrap: anywhere; background: var(--card-container-background);
  border: var(--card-container-border-width) solid var(--card-container-border-color); border-radius: var(--card-container-radius-rounded); }
.card-header { display: flex; align-items: center; gap: var(--card-heading-gap); padding: var(--card-heading-padding); }
.card-header .leading { display: flex; align-items: center; gap: var(--card-heading-leading-gap); flex: none; }
.card-header .titles { flex: 1; min-width: 0; }
.card-header .headline { font: var(--card-heading-title-font); color: var(--card-heading-title-foreground); }
.card-header .sub { font: var(--card-heading-subtitle-font); color: var(--card-heading-subtitle-foreground); }
.card-media { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--card-body-foreground); }
.card-body { padding: var(--card-body-padding); font: var(--card-body-font); color: var(--card-body-foreground); }
.card-footer { display: flex; flex-wrap: wrap; gap: var(--card-footer-gap); padding: var(--card-footer-padding); }
/* opens item: a stretched title link; controls stay above it */
.card.opens { overflow: visible; }
.card.opens .card-link { color: inherit; text-decoration: none; outline: 0; }
.card.opens .card-link::after { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; }
.card.opens :is(button, .btn, a:not(.card-link), input, .ai-mark) { position: relative; z-index: 1; }
.card.opens:has(.card-link:hover), .card.opens:has(.card-link:active) { background-image: linear-gradient(var(--card-collapsible-header-background-hover), var(--card-collapsible-header-background-hover)); }
.card.opens:has(.card-link:focus-visible) { outline: var(--card-collapsible-focus-ring-width) solid var(--card-collapsible-focus-ring-color); outline-offset: var(--card-collapsible-focus-ring-width); }

/* collapsible card: no border at the default flavour; gradient draws its outline outside the content */
.card-sectioned { overflow: hidden; background: var(--card-container-background); border-radius: var(--card-container-radius-rounded); }
.card-sectioned:is(.gradient, .ai) { border: var(--card-collapsible-gradient-border-width) solid transparent;
  background: linear-gradient(var(--card-container-background), var(--card-container-background)) padding-box,
    linear-gradient(129deg, var(--card-collapsible-gradient-border-start) 0%, var(--card-collapsible-gradient-border-end) 100%) border-box; }
.cs-inner { overflow: hidden; }
.cs-header { display: flex; align-items: center; gap: var(--card-collapsible-header-gap); width: 100%; border: 0; text-align: left; color: inherit;
  padding: var(--card-collapsible-header-padding); background: var(--card-collapsible-header-background); }
.cs-header > .icon { font-size: var(--card-collapsible-caret-size); color: var(--card-collapsible-title-foreground);
  transition: transform var(--card-collapsible-transition-duration) var(--card-collapsible-transition-easing); }
.cs-header .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--card-collapsible-heading-gap); }
.cs-title { display: flex; flex-wrap: wrap; gap: var(--card-collapsible-title-gap); font: var(--card-collapsible-title-font); color: var(--card-collapsible-title-foreground); }
.cs-title .req { color: var(--card-collapsible-required-foreground); } /* the word "(required)", not an asterisk */
.cs-subtitle { font: var(--card-collapsible-description-font); color: var(--card-collapsible-description-foreground); }
button.cs-header { cursor: pointer; transition: background-color var(--card-collapsible-transition-duration) var(--card-collapsible-transition-easing); }
button.cs-header:hover { background: var(--card-collapsible-header-background-hover); }
button.cs-header:focus-visible { outline: var(--card-collapsible-focus-ring-width) solid var(--card-collapsible-focus-ring-color); outline-offset: calc(-1 * var(--card-collapsible-focus-ring-width)); }
.cs-header[aria-expanded="false"] > .icon { transform: rotate(-90deg); }
.cs-content { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--card-collapsible-transition-duration) var(--card-collapsible-transition-easing); }
.cs-content > div { overflow: hidden; padding: 0 var(--card-collapsible-body-padding) var(--card-collapsible-body-padding);
  font: var(--card-body-font); color: var(--card-body-foreground); }
.cs-header[aria-expanded="false"] + .cs-content { grid-template-rows: 0fr; }
.cs-header[aria-expanded="false"] + .cs-content > div { padding-bottom: 0; visibility: hidden; }

/* shape */
:is(.card, .card-sectioned):is(.sharp, [data-shape="sharp"] *) { border-radius: var(--card-container-radius-sharp); }

/* Chat List Item (molecule, draft) — a Menu Item row used as one button: Avatar, name + preview, timestamp + Notification Indicator / status Icon.
   Self-contained (does not need the old shared .lrow block). Markup: <ul class="list lrow-list"><li><button class="lrow chat-li [unread]">
     <span class="avatar …"></span><span class="lrow-main"><span class="lrow-name">…</span><span class="lrow-sub">…</span></span>
     <span class="lrow-meta"><span class="lrow-time">…</span><span class="indicator">3</span> | <span class="lrow-status"><span class="icon">…</span><span class="lrow-sr">Read</span></span></span></button></li></ul> */
.lrow.chat-li { --_name-font: var(--chat-list-item-name-font); --_preview: var(--chat-list-item-preview-foreground);
  position: relative; box-sizing: border-box; display: flex; align-items: center; gap: var(--chat-list-item-row-gap); width: 100%; min-height: 0;
  padding: var(--chat-list-item-row-padding-y) var(--chat-list-item-row-padding-x); margin: 0; border: 0; cursor: pointer;
  background: var(--chat-list-item-row-background-enabled); color: var(--chat-list-item-name-foreground); font: var(--chat-list-item-preview-font); text-align: left; }
.lrow-list > li:not(:last-child) > .chat-li { border-bottom: var(--chat-list-item-divider-width) solid var(--chat-list-item-divider-color); }
.chat-li:is(:hover, .is-hover) { background: var(--chat-list-item-row-background-hover); }
.chat-li:is(:active, .is-pressed) { background: var(--chat-list-item-row-background-pressed); }
.chat-li:is(:focus-visible, .is-focus) { outline: var(--chat-list-item-focus-ring-width) solid var(--chat-list-item-focus-ring-color); outline-offset: calc(-1 * var(--chat-list-item-focus-ring-width)); }
.chat-li.unread { --_name-font: var(--chat-list-item-name-font-unread); --_preview: var(--chat-list-item-preview-foreground-unread); }
.chat-li .lrow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--chat-list-item-text-gap); }
.chat-li .lrow-name { font: var(--_name-font); color: var(--chat-list-item-name-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-li .lrow-sub { font: var(--chat-list-item-preview-font); color: var(--_preview); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-li .lrow-meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: var(--chat-list-item-meta-gap); }
.chat-li .lrow-time { font: var(--chat-list-item-meta-font); color: var(--chat-list-item-meta-foreground); white-space: nowrap; }
.chat-li .lrow-status { display: inline-flex; align-items: center; }
.chat-li .lrow-status .icon { font-size: var(--icon-size-small); color: var(--chat-list-item-meta-foreground); }
.chat-li:focus-visible :is(.lrow-name, .lrow-sub) { white-space: normal; overflow-wrap: anywhere; } /* full text on focus; give the row a title for hover */
.chat-li .lrow-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Combobox (molecule, draft) — label, hint, error, field, in that order; the list is a Dropdown Menu panel (.dm-panel) of Menu Item rows (.dm-item).
   Chips are Input Chips (.chips-input). Markup:
   <div class="cbx [sm|lg] [multi] [sharp|full] [is-open] [is-error] [readonly] [disabled]">
     <label class="ti-label" for="x">Site (required)</label>
     <div class="ti-hint" id="x-hint">Start typing a site name</div>
     [<div class="ti-hint error" id="x-err"><span class="icon" aria-hidden="true">error</span>Choose a site from the list</div>]
     <div class="cbx-anchor"><div class="cbx-field">[<span class="icon" aria-hidden="true">search</span>]
         [<span class="chips-input">…</span>…]
         <input id="x" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="x-list" aria-describedby="x-hint x-err" placeholder="Search sites">
         [<span class="cbx-count">3 selected</span>]
         <span class="cbx-trailing"><button class="cbx-clear" type="button" aria-label="Clear site"><span class="icon" aria-hidden="true">cancel</span></button>
           <span class="divider vertical" aria-hidden="true"></span>
           <button class="cbx-toggle" type="button" tabindex="-1" aria-label="Show sites"><span class="icon cbx-chev" aria-hidden="true">expand_more</span></button></span></div>
       <div class="dm-panel cbx-list" id="x-list" role="listbox" [aria-multiselectable="true"] hidden>
         <div class="dm-item check [is-focus]" role="option" id="x-o1" aria-selected="false"><span class="icon" aria-hidden="true">check_mark</span><span class="dm-item-label">Dock <b class="cbx-match">3</b></span></div>…
         [<div class="cbx-empty" role="status">No sites match 'xyz'</div>]</div></div></div>
   Error is .is-error (not .invalid/.error): those make Input Hint turn every hint red, and the hint stays default beside its own error line.
   The script sets .is-open, .is-filled, aria-activedescendant and .is-focus on the highlighted row. Multi: chips show while focused, the count while not. */
.cbx { display: flex; flex-direction: column; gap: var(--combobox-stack-gap); width: var(--combobox-container-width); max-width: 100%; }
.cbx-anchor { position: relative; }
.cbx-field { --_bg: var(--combobox-field-background-enabled); --_bc: var(--combobox-field-border-color-enabled); --_bw: var(--combobox-field-border-width);
  --_ics: var(--combobox-icon-size-medium); --_ic: var(--combobox-icon-foreground);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--combobox-field-gap); box-sizing: border-box; width: 100%;
  min-height: var(--combobox-field-min-height-medium); padding: var(--combobox-field-padding-y) var(--combobox-field-padding-x);
  border-radius: var(--combobox-field-radius-rounded); background: var(--_bg); cursor: text;
  box-shadow: inset 0 0 0 var(--_lock-w, var(--_bw)) var(--_lock-c, var(--_bc)); }
.cbx-field:hover { --_bc: var(--combobox-field-border-color-hover); }
.cbx-field:focus-within { --_bc: var(--combobox-field-border-color-focused); --_bw: var(--combobox-field-border-width-focused); }
.cbx.is-open .cbx-field { --_bc: var(--combobox-field-border-color-open); --_bw: var(--combobox-field-border-width-focused); }
.cbx-field input { flex: 1 1 0; min-width: 0; border: 0; outline: 0; padding: 0 var(--combobox-text-padding-x); background: none;
  font: var(--combobox-value-font-medium); color: var(--combobox-value-foreground); caret-color: var(--combobox-cursor-foreground); }
.cbx-field input::placeholder { color: var(--combobox-placeholder-foreground); opacity: 1; }
.cbx-field .icon { font-size: var(--_ics); color: var(--_ic); }
.cbx-field .chips-input { flex: none; }
.cbx-count { flex: none; padding: 0 var(--combobox-text-padding-x); font: var(--combobox-count-font); color: var(--combobox-count-foreground); white-space: nowrap; }
/* multi: chips while focused, count while not */
.cbx-count, .cbx.multi .cbx-field:not(:focus-within) .chips-input { display: none; }
.cbx.multi.is-filled .cbx-field:not(:focus-within) .cbx-count { display: inline; }
.cbx.multi.is-filled .cbx-field:not(:focus-within) input { flex: 0 1 0; width: 0; padding: 0; }
/* trailing group: clear (when there is text or a choice), divider, chevron */
.cbx-trailing { display: inline-flex; align-items: center; gap: var(--combobox-trailing-gap); flex: none; margin-inline-start: auto; }
.cbx-trailing .divider { display: none; align-self: center; height: var(--combobox-divider-height); min-height: 0; }
.cbx-clear, .cbx-toggle { position: relative; display: inline-flex; flex: none; border: 0; padding: 0; background: none; color: inherit; cursor: pointer; }
.cbx-clear::after, .cbx-toggle::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  min-width: var(--combobox-touch-target-size-minimum); min-height: var(--combobox-touch-target-size-minimum); } /* hit area */
.cbx-clear:focus-visible, .cbx-toggle:focus-visible { outline: var(--combobox-control-focus-ring-width) solid var(--combobox-control-focus-ring-color); }
.cbx-clear { display: none; }
:is(.cbx.is-filled, .cbx-field:has(input:not(:placeholder-shown))) :is(.cbx-clear, .cbx-trailing .divider) { display: inline-flex; }
.cbx:is(.readonly, .disabled) :is(.cbx-clear, .cbx-trailing .divider) { display: none; }
.cbx.is-open .cbx-chev { transform: rotate(180deg); }
/* the list: overlaid below the field, as wide as it; may scroll inside, never the page (3.32). ~6 rows visible is a draft placeholder. */
.cbx-anchor > .cbx-list { position: absolute; z-index: 2; left: 0; right: 0; top: calc(100% + var(--combobox-menu-offset)); width: auto;
  max-height: calc(var(--combobox-option-min-height) * 6.5); overflow-y: auto; overscroll-behavior: contain; }
.cbx-list .dm-item { height: auto; min-height: var(--combobox-option-min-height); white-space: normal; }
.cbx-match { font-weight: var(--combobox-match-font-weight); }
.cbx-empty { padding: var(--combobox-field-padding-y) var(--combobox-field-padding-x); font: var(--combobox-empty-font); color: var(--combobox-empty-foreground); }
/* form-set states */
.cbx.is-error .cbx-field, .cbx-field:has(input[aria-invalid="true"]) { --_lock-c: var(--combobox-field-border-color-error); }
.cbx.readonly .cbx-field { --_lock-c: var(--combobox-field-border-color-read-only); cursor: default; }
.cbx.disabled .cbx-field { --_bg: var(--combobox-field-background-disabled); --_lock-c: var(--combobox-field-border-color-disabled);
  --_ic: var(--combobox-icon-foreground-disabled); cursor: not-allowed; }
.cbx.disabled .cbx-field :is(input, .cbx-count) { color: var(--combobox-value-foreground-disabled); }
/* sizes and shapes */
.cbx.sm .cbx-field { --_ics: var(--combobox-icon-size-small); min-height: var(--combobox-field-min-height-small); }
.cbx.sm .cbx-field input { font: var(--combobox-value-font-small); }
.cbx.lg .cbx-field { --_ics: var(--combobox-icon-size-large); min-height: var(--combobox-field-min-height-large); }
.cbx.lg .cbx-field input { font: var(--combobox-value-font-large); }
:is(.cbx.sharp, [data-shape="sharp"] .cbx) .cbx-field { border-radius: var(--combobox-field-radius-sharp); }
:is(.cbx.full, [data-shape="full"] .cbx) .cbx-field { border-radius: var(--combobox-field-radius-full); }

/* Commit Bar (molecule, draft) — pinned to the bottom of the scope it commits (page or pane; overlays keep their own footers). Buttons are .btn. Markup:
   <div class="commit-bar [raised]" role="region" aria-label="Form actions">
     [<div class="commit-bar-leading"><button class="btn negative">Delete</button></div>]
     <div class="commit-bar-group">[<p class="commit-bar-scope" id="scope"><span class="icon" aria-hidden="true">store</span>12 devices at Dock 3</p>]
       <button class="btn outline-subtle">Cancel</button>[<button class="btn outline">Save draft</button>]
       <button class="btn" aria-describedby="scope">Assign devices</button></div></div>
   Place it as the last child of the scrolling scope; it sticks to that scope's bottom.
   On compact screens (the 599px query mirrors --breakpoint-medium-min) the group stacks full width, primary on top. */
.commit-bar { position: sticky; bottom: 0; z-index: 1; box-sizing: border-box; display: flex; align-items: center; flex-wrap: wrap;
  gap: var(--commit-bar-container-gap); width: 100%; min-height: var(--commit-bar-container-min-height);
  padding: var(--commit-bar-container-padding-y) var(--commit-bar-container-padding-x);
  background: var(--commit-bar-container-background);
  border-top: var(--commit-bar-container-border-width) solid var(--commit-bar-container-border-color); }
.commit-bar.raised { box-shadow: var(--commit-bar-container-shadow); }
.commit-bar-leading { display: flex; gap: var(--commit-bar-actions-gap); }
.commit-bar-group { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: var(--commit-bar-actions-gap); margin-inline-start: auto; }
.commit-bar-scope { display: inline-flex; align-items: center; gap: var(--commit-bar-scope-gap); margin: 0;
  margin-inline-end: calc(var(--commit-bar-container-gap) - var(--commit-bar-actions-gap));
  font: var(--commit-bar-scope-font); color: var(--commit-bar-scope-foreground); }
.commit-bar-scope .icon { font-size: var(--commit-bar-scope-icon-size); color: var(--commit-bar-scope-icon-foreground); }
.commit-bar .btn { white-space: normal; }
@media (max-width: 599px) {
  .commit-bar { flex-direction: column; align-items: stretch; }
  .commit-bar-group { flex-direction: column-reverse; align-items: stretch; margin-inline-start: 0; }
  .commit-bar-scope { order: 1; margin-inline-end: 0; } /* above the stacked buttons */
  .commit-bar-leading { order: 1; flex-direction: column; } }

/* Comms Buttons (molecule, draft) — an Icon Button (large, shape full) + optional label.
   Markup: <div class="comms-wrap"><button class="btn icon-btn lg comms-round [positive|negative|outline-subtle]" aria-label="…"><span class="icon">phone</span></button><span class="comms-label">Answer</span></div>
   Toggles (mute, speaker, hold) keep the same glyph and label in both states: off = outline-subtle + aria-pressed="false", on = primary (no flavour class) + aria-pressed="true".
   Push to talk is its own molecule (.ptt). */
.comms-wrap { display: inline-flex; flex-direction: column; align-items: center; gap: var(--comms-buttons-gap); }
.comms-label { font: var(--comms-buttons-label-font); color: var(--comms-buttons-label-foreground); text-align: center; }
.btn.icon-btn.comms-round { border-radius: var(--icon-button-container-radius-full);
  min-width: var(--comms-buttons-container-size-minimum); min-height: var(--comms-buttons-container-size-minimum); }

/* Connection Status (molecule, draft) — the one connection/sync indicator in the shell; opens the product's details popover / bottom sheet.
   <button class="connection-status [offline|syncing|waiting|problem] [compact] [sharp]" aria-haspopup="dialog" aria-label="Offline. Last synced 5 min ago. Show sync details">
     <span class="icon" aria-hidden="true">cloud_off</span>
     <span class="cs-text"><span class="cs-label">Offline</span><span class="cs-detail">Last synced 5 min ago</span></span></button>
   Glyphs: connected cloud_done (icon only, label omitted), offline cloud_off, syncing cloud_sync, waiting cloud_upload, problem sync_disabled.
   compact hides .cs-detail. Announce changes from a separate role="status" region in the shell. */

/* Contact List Item (molecule, draft) — the row is not a control; the open area (Avatar + text) and the Icon Button actions are.

     <button class="lrow-open"><span class="avatar s …"></span><span class="lrow-main"><span class="lrow-name">…</span><span class="lrow-sub">…</span></span></button>

/* Dropdown Menu (molecule) — panel of Menu Items (.dm-item) plus the dropdown template that places it against a trigger. Markup:
   <div class="dm" [data-dir="top|right|left"] [data-align="right|bottom"]>

/* Empty State (molecule, draft) — illustration, title, description, outline + primary Buttons.

.es.compact .es-actions { margin-top: var(--empty-state-compact-actions-margin-top); }

/* Filter Selection Bar (molecule, draft) — Filter Chips in a sideways-scrolling row, then optional Icon Buttons: clear (filter_off), then more filters (filter) at the trailing end */
.fsb { display: flex; align-items: center; gap: var(--filter-selection-bar-container-gap); }
.fsb-scroll { flex: 1; min-width: 0; display: flex; gap: var(--filter-selection-bar-chip-gap); overflow-x: auto; padding: var(--filter-selection-bar-scroll-padding);

/* Inline Banner (molecule) — markup: <div class="banner [neutral|success|warning|error] [solid] [sharp]" role="status">

   <div class="banner-content"><div class="banner-text"><div class="banner-title">…</div><div class="banner-body">…</div></div>
   <div class="banner-actions">…small Buttons…</div></div>
   <button class="btn icon-btn subtle sm" aria-label="Close"><span class="icon">close</span></button></div>
   Info is the default status; one glyph per status (info, lightbulb, check_circle, warning, error). On solid info, success and error, give
   .banner-actions and the close button data-theme="dark" (and use outline-contrast) so they draw white; solid neutral and warning text is

.banner.error { --_bg: var(--inline-banner-subtle-error-container-background); --_border: var(--inline-banner-subtle-error-container-border-color);
  --_icon: var(--inline-banner-subtle-error-icon-foreground); --_fg: var(--inline-banner-subtle-error-text-foreground); }
.banner.solid { --_bg: var(--inline-banner-solid-info-container-background); --_border: var(--inline-banner-solid-info-container-border-color);
  --_icon: var(--inline-banner-solid-info-icon-foreground); --_fg: var(--inline-banner-solid-info-text-foreground); }
.banner.solid.neutral { --_bg: var(--inline-banner-solid-neutral-container-background); --_border: var(--inline-banner-solid-neutral-container-border-color);
  --_icon: var(--inline-banner-solid-neutral-icon-foreground); --_fg: var(--inline-banner-solid-neutral-text-foreground); }

.banner.sharp { border-radius: var(--inline-banner-container-radius-sharp); }
