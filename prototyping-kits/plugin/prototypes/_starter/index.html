/* System Banner (molecule) — markup: <div class="sysbanner [success|warning|error] [expanded [multiline]]" data-theme="dark" role="status">
   <span class="sysbanner-icon"><span class="icon">info</span></span>  (one glyph per status: info, check_circle, warning, error)
   <div class="sysbanner-content"><div class="sysbanner-text"><div class="sysbanner-title">…</div><div class="sysbanner-body">…</div></div>
   <div class="sysbanner-actions"><button class="btn sm outline-contrast"><span class="btn-label">Action</span></button></div></div>
   <button class="btn icon-btn subtle sysbanner-trailing" aria-label="Close"><span class="icon">close</span></button></div>
   Info is the default status (no class). data-theme="dark" is required: the banner is locked to dark mode (fill, action and close).
   Compact is the default size (below --breakpoint-medium-min); .expanded for wider screens (.desktop kept as an alias).
   It slides down from the top as it appears; add .is-leaving to slide it up and away (faster, leaving curve). Reduced motion: fades.
   The close button's hit area reaches the Icon Button touch minimum at both sizes. */
.sysbanner { --_sb-bg: var(--system-banner-info-container-background); --_sb-fg: var(--system-banner-info-content-foreground);
  animation: sysbanner-in var(--system-banner-enter-duration) var(--system-banner-enter-easing);
  display: flex; align-items: flex-start; gap: var(--system-banner-compact-container-gap); box-sizing: border-box; width: 100%;
  padding: var(--system-banner-compact-container-padding); background: var(--_sb-bg); color: var(--_sb-fg); border-radius: var(--system-banner-container-radius); }
.sysbanner.success { --_sb-bg: var(--system-banner-success-container-background); --_sb-fg: var(--system-banner-success-content-foreground); }
.sysbanner.warning { --_sb-bg: var(--system-banner-warning-container-background); --_sb-fg: var(--system-banner-warning-content-foreground); }
.sysbanner.error { --_sb-bg: var(--system-banner-error-container-background); --_sb-fg: var(--system-banner-error-content-foreground); }
.sysbanner.is-leaving { animation: sysbanner-out var(--system-banner-exit-duration) var(--system-banner-exit-easing) forwards; }
@keyframes sysbanner-in { from { transform: translateY(-100%); } }
@keyframes sysbanner-out { to { transform: translateY(-100%); } }
@media (prefers-reduced-motion: reduce) { @keyframes sysbanner-in { from { opacity: 0; } } @keyframes sysbanner-out { to { opacity: 0; } } }
.sysbanner-icon { flex: none; display: grid; place-items: center; width: var(--system-banner-compact-icon-box-size); height: var(--system-banner-compact-icon-box-size); }
.sysbanner-icon .icon { font-size: var(--system-banner-icon-size); color: var(--_sb-fg); }
.sysbanner-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--system-banner-compact-content-gap);
  padding: var(--system-banner-compact-content-padding-y) 0; }
.sysbanner-text { display: flex; flex-direction: column; }
.sysbanner-title { font: var(--system-banner-compact-title-font); }
.sysbanner-body { font: var(--system-banner-description-font); padding: var(--system-banner-compact-description-padding-y) 0; }
.sysbanner-actions { display: flex; flex-wrap: wrap; gap: var(--system-banner-actions-gap); padding: var(--system-banner-compact-actions-padding-y) 0; }
.sysbanner .btn.icon-btn.sysbanner-trailing { flex: none; width: var(--system-banner-compact-dismiss-size); height: var(--system-banner-compact-dismiss-size);
  padding: var(--system-banner-dismiss-padding); border-radius: var(--system-banner-dismiss-radius); }
.sysbanner .sysbanner-trailing .icon { font-size: var(--system-banner-icon-size); color: var(--_sb-fg); }
.sysbanner.warning .sysbanner-actions .btn { --_fg: var(--_sb-fg); --_ring: var(--_sb-fg); --_ring-h: var(--_sb-fg); --_ring-p: var(--_sb-fg); }
/* expanded */
.sysbanner:is(.expanded, .desktop) { gap: var(--system-banner-expanded-container-gap); padding: var(--system-banner-expanded-container-padding); }
.sysbanner:is(.expanded, .desktop) .sysbanner-icon { width: var(--system-banner-expanded-icon-box-size); height: var(--system-banner-expanded-icon-box-size); }
.sysbanner:is(.expanded, .desktop) .sysbanner-content { flex-direction: row; flex-wrap: wrap; align-items: center; gap: var(--system-banner-expanded-content-gap); padding: 0; }
.sysbanner:is(.expanded, .desktop) .sysbanner-text { flex: 1 1 auto; padding: var(--system-banner-expanded-text-padding-y) 0; }
.sysbanner:is(.expanded, .desktop) .sysbanner-title { font: var(--system-banner-expanded-title-font); }
.sysbanner:is(.expanded, .desktop) .sysbanner-body { padding: 0; }
.sysbanner:is(.expanded, .desktop) .sysbanner-actions { padding: 0; }
.sysbanner:is(.expanded, .desktop).multiline .sysbanner-content { flex-direction: column; align-items: flex-start; padding: var(--system-banner-expanded-content-padding-y-multiline) 0; }
.sysbanner:is(.expanded, .desktop).multiline .sysbanner-text { gap: var(--system-banner-expanded-text-gap-multiline); padding: var(--system-banner-expanded-text-padding-y-multiline) 0; }
.sysbanner:is(.expanded, .desktop) .btn.icon-btn.sysbanner-trailing { width: var(--system-banner-expanded-dismiss-size); height: var(--system-banner-expanded-dismiss-size); }

/* Tab Bar (molecule) — replaces Tabs; class names kept. Markup:
   <div class="tabs [condensed]" role="tablist"><button class="tab" role="tab" aria-selected="true">[<span class="icon">star</span>]Label[<span class="indicator sm"></span>]</button>…</div>
   Full width (default) shares the row equally; .condensed hugs. The underline space is always held, so selecting shifts nothing.
   .scroll: when the tabs don't fit, the bar scrolls sideways, tabs sized to their labels, the first offset --tab-bar-scroll-offset.
   Labels never truncate; heights are minimums. Unavailable tabs: aria-disabled="true" (stays focusable). */
.tabs { display: flex; background: var(--tab-bar-container-background); }
.tabs.scroll { overflow-x: auto; scrollbar-width: none; padding-inline-start: var(--tab-bar-scroll-offset); }
.tabs.scroll .tab { flex: none; }
.tab { flex: 1 1 0; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: var(--tab-bar-item-gap);
  min-height: var(--tab-bar-item-height); padding: var(--tab-bar-item-padding-y) var(--tab-bar-item-padding-x); margin: 0; border: 0;
  border-bottom: var(--tab-bar-indicator-width) solid var(--tab-bar-indicator-color-enabled); border-radius: var(--tab-bar-item-radius);
  background: var(--tab-bar-item-background-enabled); color: var(--tab-bar-item-label-foreground-enabled);
  font: var(--tab-bar-label-font); white-space: nowrap; cursor: pointer; }
.tabs.condensed .tab { flex: none; }
.tab .icon { font-size: var(--tab-bar-icon-size); color: var(--tab-bar-item-icon-foreground-enabled); }
.tab:hover { background: var(--tab-bar-item-background-hover); }
.tab[aria-selected="true"] { color: var(--tab-bar-item-label-foreground-selected); border-bottom-color: var(--tab-bar-indicator-color-selected); }
.tab[aria-selected="true"] .icon { color: var(--tab-bar-item-icon-foreground-selected); }
.tab:focus-visible { outline: var(--tab-bar-focus-ring-width) solid var(--tab-bar-focus-ring-color); outline-offset: calc(-1 * var(--tab-bar-focus-ring-width)); }
.tab:is(:disabled, [aria-disabled="true"]) { background: var(--tab-bar-item-background-enabled); color: var(--tab-bar-item-label-foreground-disabled); cursor: not-allowed; }
.tab:is(:disabled, [aria-disabled="true"]) .icon { color: var(--tab-bar-item-icon-foreground-disabled); }

/* Task List (molecule, draft) — verb-named tasks with a status mark and words. Running uses a Progress Circle (.progress-circle.xs.indeterminate). Markup:
   <div class="task-list [sharp] [divided]">
     [<div class="task-list-head"><span class="task-list-summary">3 of 6 done</span>[<span class="task-list-actions"><button class="btn sm outline">Stop</button><button class="btn sm">Approve</button></span>]</div>]
     <ol class="task-list-rows">
       <li class="task-row [waiting|running|approval|done|failed|retried]">
         <span class="icon task-mark" aria-hidden="true">check_circle</span> | <span class="progress-circle xs indeterminate task-mark" role="presentation">…</span>
         <span class="task-main"><a class="task-label task-link" href="…">Scan dock labels</a> | <span class="task-label">…</span>
           <span class="task-status">Done</span></span>
         [<span class="task-action"><button class="btn sm outline" aria-label="Retry update Dock 5 printer">Retry</button></span> | <span class="icon task-chev" aria-hidden="true">chevron_right</span>]</li></ol></div>
   Glyphs: waiting pending, approval hand, done check_circle, failed error, retried replay. A link row (.task-link) is one target over the row;
   a task that can't start yet has no link. */
.task-list { display: flex; flex-direction: column; gap: var(--task-list-header-gap); }
.task-list-head { display: flex; align-items: center; justify-content: space-between; gap: var(--task-list-row-gap); }
.task-list-summary { font: var(--task-list-summary-font); color: var(--task-list-summary-foreground); }
.task-list-actions { display: flex; gap: var(--task-list-row-gap); }
.task-list-rows { list-style: none; margin: 0; padding: 0; }
.task-row { --_ic: var(--task-list-icon-foreground-waiting); --_fg: var(--task-list-label-foreground); --_st: var(--task-list-status-foreground);
  --_bg: var(--task-list-row-background-enabled);
  position: relative; box-sizing: border-box; display: flex; align-items: center; gap: var(--task-list-row-gap);
  min-height: var(--task-list-row-min-height); padding: var(--task-list-row-padding-y) var(--task-list-row-padding-x);
  border-radius: var(--task-list-row-radius-rounded); background: var(--_bg); transition: background-color var(--task-list-row-transition); }
:is(.task-list.sharp, [data-shape="sharp"]) .task-row { border-radius: var(--task-list-row-radius-sharp); }
.task-list.divided .task-row:not(:last-child) { border-bottom: var(--divider-line-thickness) solid var(--divider-line-color); border-end-start-radius: 0; border-end-end-radius: 0; }
.task-row > .icon.task-mark { font-size: var(--task-list-icon-size); color: var(--_ic); }
.task-row > .progress-circle.task-mark { --_d: var(--task-list-progress-size); }
.task-row.approval { --_ic: var(--task-list-icon-foreground-approval); }
.task-row.done { --_ic: var(--task-list-icon-foreground-done); --_fg: var(--task-list-label-foreground-done); }
.task-row.failed { --_ic: var(--task-list-icon-foreground-failed); --_st: var(--task-list-status-foreground-failed); }
.task-row.retried { --_ic: var(--task-list-icon-foreground-retried); }
.task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--task-list-text-gap); }
.task-label { font: var(--task-list-label-font); color: var(--_fg); text-decoration: none; overflow-wrap: anywhere; }
.task-status { font: var(--task-list-status-font); color: var(--_st); }
.task-action { flex: none; position: relative; z-index: 1; }
.task-chev { font-size: var(--task-list-icon-size); color: var(--_fg); }
/* link rows: the whole row is the target */
.task-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.task-link:focus-visible { outline: 0; }
.task-row:has(.task-link):hover { --_bg: var(--task-list-row-background-hover); }
.task-row:has(.task-link):active { --_bg: var(--task-list-row-background-pressed); }
.task-row:has(.task-link:focus-visible) { outline: var(--task-list-focus-ring-width) solid var(--task-list-focus-ring-color); outline-offset: calc(-1 * var(--task-list-focus-ring-width)); }
@media (prefers-reduced-motion: reduce) { .task-row { transition: none; } }

/* Upload Item (molecule, draft) — Progress Circle (upload) while uploading, then a status Icon + close.
   Markup: <div class="uitem [is-waiting|is-completed|is-error]" role="group" aria-label="file"><span class="uitem-thumb"><span class="icon">file</span></span>
     <div class="uitem-body"><div class="uitem-title" title="quarterly-report.pdf" tabindex="0"><span class="uitem-name-start">quarterly-rep</span><span class="uitem-name-end">ort.pdf</span></div>
       <div class="uitem-sub">…</div></div>
     <div class="uitem-trailing">[waiting: <span class="icon uitem-status">schedule</span>] [error: <button class="btn icon-btn subtle uitem-retry" aria-label="Retry report.pdf"><span class="icon">refresh</span></button>]
       <button class="uitem-close" aria-label="Remove report.pdf | Close report.pdf (error)"><span class="icon">close</span></button></div></div>
   The file name truncates in the middle (the start part takes the ellipsis, the end keeps the extension); the full name shows on hover (title)

.uitem { display: flex; align-items: center; gap: var(--upload-item-container-gap); box-sizing: border-box; width: 100%;
  min-height: var(--upload-item-container-min-height); padding: var(--upload-item-container-padding-y) var(--upload-item-container-padding-x);
  background: var(--upload-item-default-container-background); }
.uitem:hover { background: var(--upload-item-default-container-background-hover); }
.uitem.is-completed, .uitem.is-completed:hover { background: var(--upload-item-completed-container-background); }
.uitem.is-error, .uitem.is-error:hover { background: var(--upload-item-error-container-background); }
.uitem-thumb { flex: none; display: grid; place-items: center; width: var(--upload-item-thumbnail-size); height: var(--upload-item-thumbnail-size); } /* mock: an icon stands in for the image */
.uitem-thumb .icon { font-size: var(--icon-size-large); }
.uitem-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--upload-item-text-gap); }
.uitem-title { display: flex; min-width: 0; font: var(--upload-item-title-font); color: var(--upload-item-title-foreground); white-space: nowrap; }

/* Bottom Sheet (organism) — replaces BOTH the old "Bottom Sheet" and "Tile Button" blocks (Tile Button is now the Grid Menu Item, .bs-item).
   Markup: .bs-frame[data-open] > [.scrim.bs-scrim] + section.bs-sheet > .bs-handle + .bs-header[.center] > [Icon Button] + .bs-title
   + one of .bs-list (Menu Items) | .bs-grid (.bs-item tiles) | .bs-slot, then a Card footer (.card-footer with two small Buttons).
   No transition is defined in the spec: the sheet appears and disappears without animation. Scrim, Menu Item, Card footer and
   Notification Indicator styling are their own components'. Grid tiles have no focus token: the shared Button ring is used.
   Height follows content. Capped (default): stops at the frame's height and scrolls inside. .expandable opens about half way;
   add .is-full when pulled up: full height, with a close Icon Button (.bs-close, subtle sm, `close`) in the header.
   Selected tiles show a thick selection border as well as colour. Unavailable tiles use aria-disabled="true" (stay focusable) and give a reason.
   The transparent border is the edge forced-colours mode draws. */
.bs-frame { position: relative; }
.bs-frame[data-open="false"] .bs-sheet, .bs-frame[data-open="false"] .bs-scrim { display: none; }
.bs-scrim { position: absolute; inset: 0; }
.bs-sheet { position: absolute; left: 0; right: 0; bottom: 0; margin-inline: auto; max-height: 100%; overflow: auto;
  display: flex; flex-direction: column; width: min(100%, var(--bottom-sheet-container-width));
  padding-bottom: var(--bottom-sheet-container-padding-bottom); background: var(--bottom-sheet-container-background);
  border: var(--bottom-sheet-container-border-width) solid var(--bottom-sheet-container-border-color); border-bottom: 0; box-sizing: border-box;
  border-radius: var(--bottom-sheet-container-radius) var(--bottom-sheet-container-radius) 0 0; }
.bs-sheet.expandable { height: 50%; }
.bs-sheet.expandable.is-full { height: 100%; }
.bs-sheet .bs-close { display: none; margin-inline-start: auto; }
.bs-sheet.is-full .bs-close { display: inline-flex; }
.bs-sheet.static { position: static; margin: 0; } /* a sheet drawn on its own, outside a frame */
.bs-handle { display: flex; justify-content: center; padding: var(--bottom-sheet-handle-padding-y) var(--bottom-sheet-handle-padding-x); }
.bs-handle::before { content: ""; width: var(--bottom-sheet-handle-bar-width); height: var(--bottom-sheet-handle-bar-height);
  border-radius: var(--bottom-sheet-handle-bar-radius); background: var(--bottom-sheet-handle-bar-background); }
.bs-header { display: flex; align-items: center; gap: var(--bottom-sheet-header-gap-start); margin: 0;
  padding: var(--bottom-sheet-header-padding-y-start) var(--bottom-sheet-header-padding-x); }
.bs-header.center { justify-content: center; flex-direction: row-reverse; gap: var(--bottom-sheet-header-gap-center);
  padding-block: var(--bottom-sheet-header-padding-y-center); }
.bs-title { font: var(--bottom-sheet-header-title-font); color: var(--bottom-sheet-header-title-foreground); }
.bs-list { display: flex; flex-direction: column; gap: var(--bottom-sheet-list-gap); margin: 0; list-style: none;
  padding: var(--bottom-sheet-list-padding-y) var(--bottom-sheet-list-padding-x); }
.bs-list > li > * { width: 100%; border-radius: 0; } /* Menu Item rows: square corners in a sheet */
.bs-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--bottom-sheet-grid-gap);
  padding: var(--bottom-sheet-grid-padding-y) var(--bottom-sheet-grid-padding-x); }
.bs-slot { display: flex; flex-direction: column; gap: var(--bottom-sheet-slot-gap); padding: var(--bottom-sheet-slot-padding-y) var(--bottom-sheet-slot-padding-x); }

/* Grid Menu Item: .bs-item[aria-pressed|aria-current][.sharp] > .bs-icon-wrap > .icon [+ .indicator.sm] + .bs-label */
.bs-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--bottom-sheet-grid-item-gap);
  width: var(--bottom-sheet-grid-item-width); padding: var(--bottom-sheet-grid-item-padding); border: 0; cursor: pointer;
  border-radius: var(--bottom-sheet-grid-item-radius-rounded); background: var(--bottom-sheet-grid-item-background-enabled);
  font: var(--bottom-sheet-grid-item-label-font); color: var(--bottom-sheet-grid-item-label-foreground); text-align: center; }

.bs-item:hover { background: var(--bottom-sheet-grid-item-background-hover); }

/* Camera Scan View (organism, draft) — measurements are provisional. Locked to dark: always put data-theme="dark" on .scan-view.
   The camera image is a <video>/<img class="scan-image"> under everything; the mask dims all but the frame. Markup:
   <section class="scan-view" data-theme="dark" data-state="searching|found|multiple|checking|failed" role="dialog" aria-label="Scan the bin label">
     <img class="scan-image" alt="">
     <div class="scan-stage"><div class="scan-frame"><span class="scan-corner"></span>×4</div>
       <p class="scan-guidance" role="status"><span class="icon">barcode</span>Move closer</p>
       [<div class="progress-bar indeterminate">…</div>]</div>
     [<button class="scan-marker" style="--x:30;--y:40" aria-pressed="false" aria-label="Code 1, …">1</button>…]
     <header class="scan-bar scan-top"><button class="btn icon-btn subtle lg" aria-label="Cancel"><span class="icon">close</span></button>
       <h2 class="scan-title">Scan the bin label</h2>
       <button class="btn icon-btn subtle lg" aria-label="Light" aria-pressed="false"><span class="icon">flash_off</span></button></header>
     <footer class="scan-bar scan-bottom"><button class="btn outline-contrast"><span class="icon">keyboard</span><span class="btn-label">Type the code</span></button>
       [<span class="scan-count" aria-live="polite">18 of 24</span><button class="btn">Done</button>]</footer>
     [Bottom Sheet (.bs-frame/.bs-sheet) over the frozen image for results]</section>
   Severity in guidance is the icon + words; the frame colour only supports it. */
.scan-view { position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  min-height: 100%; background: var(--camera-scan-view-container-background); }
.scan-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-bar { position: relative; z-index: 2; display: flex; align-items: center; gap: var(--camera-scan-view-bar-gap);
  padding: var(--camera-scan-view-bar-padding-y) var(--camera-scan-view-bar-padding-x); }
.scan-top > :last-child { margin-left: auto; }
.scan-bottom { justify-content: center; flex-wrap: wrap; }
.scan-title { flex: 1; margin: 0; font: var(--camera-scan-view-title-font); color: var(--camera-scan-view-title-foreground); }
.scan-count { font: var(--camera-scan-view-count-font); color: var(--camera-scan-view-count-foreground); }

/* stage: frame centred, the mask is a huge spread shadow around the frame (centre stays clear) */
.scan-stage { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--camera-scan-view-guidance-offset); pointer-events: none; }
.scan-frame { --_fc: var(--camera-scan-view-frame-color-searching); --_cl: var(--camera-scan-view-frame-corner-length); --_sw: var(--camera-scan-view-frame-stroke-width);

.scan-frame.linear { aspect-ratio: 2 / 1; } /* 1D barcodes */

  transition: width var(--camera-scan-view-frame-transition) var(--camera-scan-view-frame-easing), height var(--camera-scan-view-frame-transition) var(--camera-scan-view-frame-easing), border-color var(--camera-scan-view-frame-transition) var(--camera-scan-view-frame-easing); }

.scan-corner:nth-child(2) { top: 0; right: 0; border-top-width: var(--_sw); border-right-width: var(--_sw); border-top-right-radius: var(--camera-scan-view-frame-radius); }
.scan-corner:nth-child(3) { bottom: 0; left: 0; border-bottom-width: var(--_sw); border-left-width: var(--_sw); border-bottom-left-radius: var(--camera-scan-view-frame-radius); }
.scan-corner:nth-child(4) { bottom: 0; right: 0; border-bottom-width: var(--_sw); border-right-width: var(--_sw); border-bottom-right-radius: var(--camera-scan-view-frame-radius); }

.scan-view:is([data-state="found"], [data-state="checking"]) .scan-corner { width: 50%; height: 50%; }

  padding: var(--camera-scan-view-guidance-padding-y) var(--camera-scan-view-guidance-padding-x); border-radius: var(--camera-scan-view-guidance-radius-rounded);
  background: var(--camera-scan-view-guidance-background); color: var(--camera-scan-view-guidance-foreground); font: var(--camera-scan-view-guidance-font); }

.scan-marker { position: absolute; z-index: 1; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); translate: -50% -50%;
  display: grid; place-items: center; box-sizing: border-box; width: var(--camera-scan-view-marker-size); height: var(--camera-scan-view-marker-size);
  border-radius: var(--camera-scan-view-marker-radius); cursor: pointer; padding: 0;
  border: var(--camera-scan-view-marker-border-width) solid var(--camera-scan-view-marker-border-color);

  border: var(--camera-scan-view-marker-border-width-selected) solid var(--camera-scan-view-marker-border-color-selected); }
.scan-marker:focus-visible { outline: var(--camera-scan-view-focus-ring-width) solid var(--camera-scan-view-focus-ring-color); outline-offset: var(--camera-scan-view-focus-ring-width); }
@media (prefers-reduced-motion: reduce) { .scan-frame, .scan-corner { transition: border-color var(--camera-scan-view-frame-transition) var(--camera-scan-view-frame-easing); } }

/* Chart (organism, draft) — measurements are provisional. Bars are CSS (height from --v, a 0–100 share of the axis);
   lines are inline SVG in a 0 0 100 100 viewBox (preserveAspectRatio="none", vector-effect="non-scaling-stroke"). Markup:
   <figure class="chart [sharp]" aria-labelledby="t1" aria-describedby="d1">
     <header class="chart-head"><div class="chart-titles"><h3 class="chart-title" id="t1">Returns doubled in March</h3><p class="chart-sub">Units, last 6 months</p></div>
       <div class="seg sm">Chart | Table</div></header>
     <p class="chart-sr" id="d1">Text description in real values; what the colours mean.</p>
     <div class="chart-plot"><div class="chart-axis-y"><span>300</span><span>200</span><span>100</span><span>0</span></div>
       <div class="chart-area" tabindex="0" role="img|group" aria-label="…">
         [<div class="chart-bars [horizontal]"><div class="chart-group"><span class="chart-bar hl" style="--v:40" tabindex="-1"></span>…</div>…</div>]
         [<div class="chart-bars stacked"><div class="chart-group"><span class="chart-bar s1" style="--v:30"></span><span class="chart-bar s2 pat-2" style="--v:20"></span></div>…</div>]
         [<svg class="chart-lines" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline class="chart-line s1" points="…"/></svg>]
         [<span class="chart-ref target|warning|error" style="--v:66"><span class="chart-ref-label">Target</span></span>]
         [<span class="chart-point s1" style="--x:80;--v:60"></span>] [<div class="chart-tooltip" style="--x:…;--v:…">…</div>]</div>
       <div class="chart-axis-x"><span>Jan</span>…</div></div>
     [<div class="chart-legend"><button class="chart-legend-item" aria-pressed="false"><span class="chart-swatch s1"></span>North</button>…</div>]
     <p class="chart-note">Source … Last updated 10:42</p>
     [<div class="dtab" hidden>…the Table view…</div>]</figure>
   Series: .s1 … .s10 (categorical order), .hl (highlight), .ctx (context grey). .pat-1 … .pat-3 add a stripe pattern (patterns 6.15).
   Legend hover dims: the area gets .is-dimmed and the series not hovered get .ctx (by script). Empty/loading/error: put an Empty State
   or Skeleton in .chart-area in place of the marks; the head stays. */
.chart { --_bw: var(--chart-container-border-width); display: flex; flex-direction: column; gap: var(--chart-container-gap); margin: 0;
  padding: var(--chart-container-padding); background: var(--chart-container-background);
  border: var(--_bw) solid var(--chart-container-border-color); border-radius: var(--chart-container-radius-rounded);
  font-variant-numeric: tabular-nums; }
.chart.sharp, [data-shape="sharp"] .chart { border-radius: var(--chart-container-radius-sharp); }
.chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--chart-header-gap); flex-wrap: wrap; }
.chart-titles { display: flex; flex-direction: column; gap: var(--chart-title-gap); min-width: 0; }
.chart-title { margin: 0; font: var(--chart-title-font); color: var(--chart-title-foreground); }
.chart-sub { margin: 0; font: var(--chart-subtitle-font); color: var(--chart-subtitle-foreground); }
.chart-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* plot: value axis | area, with the category axis under the area */
.chart-plot { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; column-gap: var(--chart-axis-tick-gap); row-gap: var(--chart-axis-tick-gap);
  min-height: var(--chart-plot-min-height); }
.chart-axis-y { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; text-align: right;
  font: var(--chart-axis-label-font); color: var(--chart-axis-label-foreground); }
.chart-axis-y > span { line-height: 0; } /* labels centred on their gridline */
.chart-axis-x { grid-column: 2; display: flex; justify-content: space-around; gap: var(--chart-bar-category-gap);
  font: var(--chart-axis-label-font); color: var(--chart-axis-label-foreground); }
.chart-axis-title { font: var(--chart-axis-title-font); color: var(--chart-axis-title-foreground); }
.chart-area { --_ticks: 3; position: relative; min-width: 0; border-bottom: var(--chart-axis-line-width) solid var(--chart-axis-line-color);
  background-image: linear-gradient(to bottom, var(--chart-gridline-color) var(--chart-gridline-width), transparent var(--chart-gridline-width));
  background-size: 100% calc(100% / var(--_ticks)); }
.chart-area.no-grid { background-image: none; }
.chart-area:focus-visible { outline: var(--chart-focus-ring-width) solid var(--chart-focus-ring-color); outline-offset: var(--chart-focus-ring-width); }
.chart-zero { position: absolute; left: 0; right: 0; bottom: calc(var(--v) * 1%); border-top: var(--chart-axis-line-width) solid var(--chart-zero-line-color); }

/* series colours */
.chart .s1 { --_c: var(--chart-series-1-color); } .chart .s2 { --_c: var(--chart-series-2-color); } .chart .s3 { --_c: var(--chart-series-3-color); }
.chart .s4 { --_c: var(--chart-series-4-color); } .chart .s5 { --_c: var(--chart-series-5-color); } .chart .s6 { --_c: var(--chart-series-6-color); }
.chart .s7 { --_c: var(--chart-series-7-color); } .chart .s8 { --_c: var(--chart-series-8-color); } .chart .s9 { --_c: var(--chart-series-9-color); }
.chart .s10 { --_c: var(--chart-series-10-color); } .chart .hl { --_c: var(--chart-series-highlight-color); } .chart .ctx { --_c: var(--chart-series-context-color); }

/* bars: vertical columns by default, .horizontal for bars; .stacked stacks segments from zero */
.chart-bars { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; gap: var(--chart-bar-category-gap); }
.chart-group { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: var(--chart-bar-gap); }
.chart-bar { flex: 1; display: block; height: calc(var(--v) * 1%); background-color: var(--_c);
  border-radius: var(--chart-bar-radius-rounded) var(--chart-bar-radius-rounded) 0 0; }
.chart-bars.stacked .chart-group { flex-direction: column-reverse; align-items: stretch; justify-content: flex-start; gap: 0; }
.chart-bars.stacked .chart-bar { flex: none; border-radius: 0; box-shadow: inset 0 var(--chart-segment-separator-width) 0 var(--chart-segment-separator-color); }
.chart-bars.stacked .chart-bar:last-child { border-radius: var(--chart-bar-radius-rounded) var(--chart-bar-radius-rounded) 0 0; }
.chart-bars.horizontal { flex-direction: column; align-items: stretch; }
.chart-bars.horizontal .chart-group { flex-direction: column; align-items: flex-start; justify-content: center; height: auto; width: 100%; }
.chart-bars.horizontal .chart-bar { flex: 1; width: calc(var(--v) * 1%); height: auto; border-radius: 0 var(--chart-bar-radius-rounded) var(--chart-bar-radius-rounded) 0; }
.chart.sharp .chart-bar, [data-shape="sharp"] .chart-bar { border-radius: var(--chart-bar-radius-sharp); }
.chart-bar:focus-visible, .chart-point:focus-visible { outline: var(--chart-focus-ring-width) solid var(--chart-focus-ring-color); outline-offset: var(--chart-point-border-width); }
/* patterns (6.15): stripes of the frame colour over the series colour */
.chart .pat-1 { background-image: repeating-linear-gradient(45deg, var(--chart-pattern-color) 0 var(--chart-segment-separator-width), transparent 0 var(--chart-point-size)); }
.chart .pat-2 { background-image: repeating-linear-gradient(-45deg, var(--chart-pattern-color) 0 var(--chart-segment-separator-width), transparent 0 var(--chart-point-size)); }
.chart .pat-3 { background-image: repeating-linear-gradient(90deg, var(--chart-pattern-color) 0 var(--chart-segment-separator-width), transparent 0 var(--chart-point-size)); }

/* lines and points */
.chart-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart-line { fill: none; stroke: var(--_c); stroke-width: var(--chart-line-width); stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.chart-point { position: absolute; left: calc(var(--x) * 1%); bottom: calc(var(--v) * 1%); translate: -50% 50%; box-sizing: border-box;
  width: var(--chart-point-size); height: var(--chart-point-size); border-radius: var(--chart-point-radius); background: var(--_c);
  box-shadow: 0 0 0 var(--chart-point-border-width) var(--chart-point-border-color); }
.chart-crosshair { position: absolute; top: 0; bottom: 0; left: calc(var(--x) * 1%); border-left: var(--chart-gridline-width) solid var(--chart-crosshair-color); pointer-events: none; }
.chart-label { position: absolute; font: var(--chart-direct-label-font); color: var(--chart-direct-label-foreground); white-space: nowrap; }

/* reference lines: target quieter than the measure; limits in their status colour */
.chart-ref { --_rc: var(--chart-target-line-color); position: absolute; left: 0; right: 0; bottom: calc(var(--v) * 1%);
  border-top: var(--chart-reference-line-width) dashed var(--_rc); pointer-events: none; }
.chart-ref.warning { --_rc: var(--chart-reference-line-color-warning); border-top-style: solid; }
.chart-ref.error { --_rc: var(--chart-reference-line-color-error); border-top-style: solid; }
.chart-ref-label { position: absolute; right: 0; bottom: var(--chart-axis-tick-gap); font: var(--chart-direct-label-font); color: var(--chart-direct-label-foreground); }

/* legend: buttons; hover dims the others (script), pressed isolates */
.chart-legend { display: flex; flex-wrap: wrap; gap: var(--chart-legend-gap); }
.chart-legend-item { display: inline-flex; align-items: center; gap: var(--chart-legend-item-gap); margin: 0; cursor: pointer;
  padding: var(--chart-legend-item-padding-y) var(--chart-legend-item-padding-x); border: 0; border-radius: var(--chart-legend-item-radius);
  background: transparent; font: var(--chart-legend-label-font); color: var(--chart-legend-label-foreground); }
.chart-legend-item:hover { background: var(--chart-legend-item-background-hover); }
.chart-legend-item[aria-pressed="true"] { box-shadow: inset 0 0 0 var(--chart-legend-item-border-width-selected) var(--chart-legend-item-border-color-selected); }
.chart-legend-item:focus-visible { outline: var(--chart-focus-ring-width) solid var(--chart-focus-ring-color); outline-offset: 0; }
.chart-swatch { flex: none; width: var(--chart-legend-swatch-size); height: var(--chart-legend-swatch-size); background-color: var(--_c); }

/* data tooltip: the Tooltip's surface, several lines */
.chart-tooltip { position: absolute; z-index: 2; left: calc(var(--x) * 1%); bottom: calc(var(--v) * 1%); translate: -50% calc(-1 * var(--chart-tooltip-padding-y));
  display: flex; flex-direction: column; gap: var(--chart-tooltip-gap); padding: var(--chart-tooltip-padding-y) var(--chart-tooltip-padding-x);
  background: var(--chart-tooltip-background); color: var(--chart-tooltip-foreground); border-radius: var(--chart-tooltip-radius);
  box-shadow: var(--chart-tooltip-shadow); font: var(--chart-tooltip-value-font); white-space: nowrap; pointer-events: none; }
.chart-tooltip-label { font: var(--chart-tooltip-label-font); }

.chart-note { margin: 0; display: flex; align-items: center; gap: var(--chart-legend-item-gap); font: var(--chart-note-font); color: var(--chart-note-foreground); }
.chart-note .icon { font-size: 1em; color: inherit; }

/* Chat (organism, draft) — header is a Top App Bar (.tapb), composer is a Message Input (.mif); the chat styles only its surface,
   list, bubbles and meta. The phone frame size (--_w / --_h) is demo-only.
   Failed: meta "Not sent" + <button class="btn text sm">Retry</button>.
   Assistant: <div class="chat-msg in ai"><span class="avatar s"><span class="icon">ai_stars</span></span> (not a person)<div class="chat-col">
     <button class="ai-mark">…</button><div class="chat-bubble">…</div>[<div class="chat-sources"><a href="…">Source</a>…</div>]
     <div class="chat-feedback"><button class="btn icon-btn subtle sm" aria-label="Helpful"><span class="icon">like</span></button>…dislike…</div></div></div>
   A streaming reply grows in place and keeps its start in view. */
.chat-phone { --_w: 384px; --_h: 624px; position: relative; display: flex; flex-direction: column; overflow: hidden; width: 100%;
  max-width: var(--_w); height: var(--_h); background: var(--chat-container-background);
  border: var(--chat-container-border-width) solid var(--chat-container-border-color); border-radius: var(--chat-container-radius-rounded); }
.chat-phone > .tapb { flex: none; }
.chat-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--chat-list-gap); padding: var(--chat-list-padding); }
.chat-day { align-self: center; font: var(--chat-day-font); color: var(--chat-timestamp-foreground); }
.chat-msg { display: flex; align-items: flex-end; gap: var(--chat-message-gap); max-width: var(--chat-message-max-width); }
.chat-msg.in { align-self: flex-start; }
.chat-msg.out { align-self: flex-end; flex-direction: row-reverse; }
.chat-col { display: flex; flex-direction: column; gap: var(--chat-message-meta-gap); min-width: 0; }
.chat-msg.out .chat-col { align-items: flex-end; }
.chat-bubble { padding: var(--chat-bubble-padding-y) var(--chat-bubble-padding-x); border-radius: var(--chat-bubble-radius-rounded);
  font: var(--chat-bubble-font); overflow-wrap: anywhere; }
.chat-msg.in .chat-bubble { background: var(--chat-incoming-bubble-background); color: var(--chat-incoming-bubble-foreground); }
.chat-msg.out .chat-bubble { background: var(--chat-outgoing-bubble-background); color: var(--chat-outgoing-bubble-foreground); }
.chat-msg.ai .chat-bubble { background: var(--chat-assistant-bubble-background); color: var(--chat-assistant-bubble-foreground);
  border: var(--chat-assistant-bubble-border-width) solid var(--chat-assistant-bubble-border-color); }
.chat-msg.ai .chat-col { align-items: flex-start; }
.chat-sources { display: flex; flex-wrap: wrap; gap: var(--chat-sources-gap); font: var(--chat-sources-font); color: var(--chat-sources-foreground); }
.chat-sources a { color: inherit; }
.chat-feedback { display: flex; gap: var(--chat-assistant-actions-gap); }
.chat-bubble .icon { font-size: var(--chat-status-icon-size); color: inherit; vertical-align: middle; margin-right: var(--chat-status-gap); }
.chat-sender { display: block; font: var(--chat-sender-font); }
.chat-meta { display: inline-flex; align-items: center; gap: var(--chat-status-gap); font: var(--chat-timestamp-font); color: var(--chat-timestamp-foreground); }
.chat-meta .icon { font-size: var(--chat-status-icon-size); color: inherit; }
.chat-phone.sharp, [data-shape="sharp"] .chat-phone { border-radius: var(--chat-container-radius-sharp); }
.chat-phone.sharp .chat-bubble, [data-shape="sharp"] .chat-bubble { border-radius: var(--chat-bubble-radius-sharp); }
/* demo helpers */
.chat-tools { display: flex; flex-wrap: wrap; gap: var(--chat-list-gap); align-items: center; margin-top: var(--chat-list-padding); }
.chat-states { display: flex; flex-direction: column; gap: var(--chat-list-gap); align-items: flex-end; }
.chat-states .chat-col { align-items: flex-end; }

/* Compare View (organism, draft) — measurements are provisional. A real table: item names are column headers, attributes row headers.
   Markup: <div class="compare [sharp]">
     <div class="compare-tools">[Segmented Control: Side by side | Changes]<label class="switch">…Show only differences</label>[<button class="btn outline sm">Add item</button>]</div>
     <div class="compare-scroll"><table class="compare-table [changes]">
       <thead><tr><td class="compare-attr"></td><th scope="col"><div class="compare-item"><span class="compare-item-title">TC58 A</span>
         <span class="compare-item-sub">S/N 21034</span>[<span class="chips-label">Baseline</span>]</div>
         <button class="btn icon-btn subtle sm" aria-label="Remove TC58 A"><span class="icon">close</span></button></th>…</tr></thead>
       <tbody>[<tr class="compare-section"><th scope="rowgroup" colspan="4">Network</th></tr>]
         <tr [class="is-changed|is-added|is-removed"]><th scope="row" class="compare-attr">[<span class="compare-change"><span class="icon">edit</span>Changed</span>]Battery</th>
           <td>82%</td><td class="compare-missing">Not set</td>…</tr></tbody></table></div></div>
   Changes view: columns Before / After; Before cells get .compare-old, After .compare-new.
   By value: rows are <tr class="compare-group" tabindex="0"> (or a link in the value cell) with a .compare-count cell. */
.compare { display: flex; flex-direction: column; overflow: hidden; background: var(--compare-view-container-background);
  border: var(--compare-view-container-border-width) solid var(--compare-view-container-border-color); border-radius: var(--compare-view-container-radius-rounded);
  font-variant-numeric: tabular-nums; }
.compare.sharp, [data-shape="sharp"] .compare { border-radius: var(--compare-view-container-radius-sharp); }
.compare-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--compare-view-toolbar-gap);
  padding: var(--compare-view-toolbar-padding-y) var(--compare-view-toolbar-padding-x); background: var(--compare-view-toolbar-background); }
.compare-tools > :last-child { margin-left: auto; }
.compare-scroll { overflow: auto; }
.compare-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.compare-table th, .compare-table td { text-align: left; vertical-align: top; padding: var(--compare-view-cell-padding-y) var(--compare-view-cell-padding-x);
  font: var(--compare-view-cell-font); color: var(--compare-view-cell-foreground); background: var(--compare-view-container-background);
  border-bottom: var(--compare-view-row-border-width) solid var(--compare-view-row-border-color); }
.compare-table tbody tr:last-child > * { border-bottom: 0; }
/* sticky item headers and attribute column */
.compare-table thead th, .compare-table thead td { position: sticky; top: 0; z-index: 2; background: var(--compare-view-header-background);
  padding: var(--compare-view-header-padding-y) var(--compare-view-header-padding-x);
  border-bottom: var(--compare-view-row-border-width) solid var(--compare-view-header-border-color); }
.compare-table .compare-attr { position: sticky; left: 0; z-index: 1; width: var(--compare-view-attribute-width);
  font: var(--compare-view-attribute-font); color: var(--compare-view-attribute-foreground); }
.compare-table thead .compare-attr { z-index: 3; }
.compare-item { display: flex; flex-direction: column; gap: var(--compare-view-header-gap); }
.compare-table thead th > .btn { float: right; } /* remove control at the header's trailing end */
.compare-item-title { font: var(--compare-view-header-title-font); color: var(--compare-view-header-title-foreground); }
.compare-item-sub { font: var(--compare-view-header-subtitle-font); color: var(--compare-view-header-subtitle-foreground); }
.compare-table .compare-section > * { font: var(--compare-view-section-heading-font); color: var(--compare-view-section-heading-foreground);
  background: var(--compare-view-section-heading-background); }
.compare-table .compare-missing { color: var(--compare-view-missing-foreground); }
/* changes: icon + word, and a bar on the row's leading edge */
.compare-change { display: flex; align-items: center; gap: var(--compare-view-change-gap); margin-bottom: var(--compare-view-cell-gap);
  font: var(--compare-view-change-font); color: var(--compare-view-change-foreground); }
.compare-change .icon { font-size: var(--compare-view-change-icon-size); color: inherit; }
.compare-table tr:is(.is-changed, .is-added, .is-removed) > :first-child { box-shadow: inset var(--compare-view-change-marker-width) 0 0 var(--compare-view-change-marker-color); }
.compare-table .compare-old { color: var(--compare-view-old-value-foreground); }
.compare-table .compare-new { color: var(--compare-view-new-value-foreground); }
/* by value */
.compare-table .compare-count { font: var(--compare-view-group-count-font); color: var(--compare-view-group-count-foreground); }
.compare-table .compare-group { cursor: pointer; }
.compare-table .compare-group:hover > * { background: var(--compare-view-group-background-hover); }
.compare-table .compare-group:focus-visible { outline: var(--compare-view-focus-ring-width) solid var(--compare-view-focus-ring-color); outline-offset: calc(-1 * var(--compare-view-focus-ring-width)); }

/* Date Picker (organism, draft) — measurements are provisional; fields are Input markup (.text-input/.ti-field: label, hint, error, field),
   the popover is shown inline. .dp-foot is only for time mode and presets (date and range apply on choosing). */
.dp { display: flex; flex-direction: column; gap: var(--date-picker-popover-gap); align-items: flex-start; }
.dp-fields { display: flex; flex-wrap: wrap; gap: var(--date-picker-fields-gap); align-items: flex-start; }
.dp-fields .text-input { width: var(--date-picker-field-width); }
.dp-open { display: inline-flex; align-items: center; justify-content: center; align-self: stretch; min-width: var(--date-picker-trigger-size);
  border: 0; padding: 0; background: none; cursor: pointer; border-radius: var(--date-picker-trigger-radius-rounded); }
.dp-open .icon { color: var(--date-picker-trigger-foreground); }
.dp-open:disabled { cursor: not-allowed; }
.dp-open:disabled .icon { color: var(--date-picker-trigger-foreground-disabled); }
.dp-open:focus-visible { outline: var(--date-picker-focus-ring-width) solid var(--date-picker-focus-ring-color); }
.dp-time input::-webkit-calendar-picker-indicator { display: none; }

.dp-pop { display: flex; width: fit-content; max-width: 100%; background: var(--date-picker-popover-background);
  border: var(--date-picker-popover-border-width) solid var(--date-picker-popover-border-color);
  border-radius: var(--date-picker-popover-radius-rounded); box-shadow: var(--date-picker-popover-shadow); }
.dp-pop[hidden] { display: none; }
.dp.sharp .dp-pop { border-radius: var(--date-picker-popover-radius-sharp); }
.dp-presets { flex: none; padding: var(--date-picker-presets-padding-y) 0; border-right: var(--date-picker-divider-width) solid var(--date-picker-divider-color); }
.dp-presets .list-item { padding: var(--date-picker-preset-padding-y) var(--date-picker-preset-padding-x); cursor: pointer; }
.dp-presets .list-item:has(input:focus-visible) { outline: var(--date-picker-focus-ring-width) solid var(--date-picker-focus-ring-color); outline-offset: calc(-1 * var(--date-picker-focus-ring-width)); }
.dp-main { display: flex; flex-direction: column; gap: var(--date-picker-popover-gap); padding: var(--date-picker-popover-padding); }
.dp-head { display: flex; align-items: center; justify-content: space-between; }
.dp-title { font: var(--date-picker-header-font); color: var(--date-picker-header-foreground); }
.dp-cal { border-collapse: collapse; }
.dp-cal th { height: var(--date-picker-weekday-height); font: var(--date-picker-weekday-font); color: var(--date-picker-weekday-foreground); text-align: center; }
.dp-cal td { padding: 0; }
.dp-day { display: grid; place-items: center; width: var(--date-picker-day-size); height: var(--date-picker-day-size); padding: 0; border: 0;
  border-radius: var(--date-picker-day-radius-rounded); background: none; cursor: pointer; font: var(--date-picker-day-font); color: var(--date-picker-day-foreground-enabled); }
.dp.sharp .dp-day { border-radius: var(--date-picker-day-radius-sharp); }
.dp-day:hover:not([aria-disabled="true"]) { background: var(--date-picker-day-background-hover); }
.dp-day:active:not([aria-disabled="true"]) { background: var(--date-picker-day-background-pressed); }
.dp-day:focus-visible { outline: var(--date-picker-focus-ring-width) solid var(--date-picker-focus-ring-color); outline-offset: calc(-1 * var(--date-picker-focus-ring-width)); }
/* today: bold label + outline ring (not colour alone) */
.dp-day.today { font: var(--date-picker-day-font-today); box-shadow: inset 0 0 0 var(--date-picker-day-today-border-width) currentColor; }
.dp-day.in-range, .dp-day.in-range:hover:not([aria-disabled="true"]) { background: var(--date-picker-day-background-in-range); color: var(--date-picker-day-foreground-in-range); border-radius: 0; }
.dp-day.selected, .dp-day.selected:hover:not([aria-disabled="true"]) { background: var(--date-picker-day-background-selected); color: var(--date-picker-day-foreground-selected); }
.dp-day.range-start { border-radius: var(--date-picker-day-radius-rounded) 0 0 var(--date-picker-day-radius-rounded); }
.dp-day.range-end { border-radius: 0 var(--date-picker-day-radius-rounded) var(--date-picker-day-radius-rounded) 0; }
.dp.sharp .dp-day.range-start, .dp.sharp .dp-day.range-end { border-radius: var(--date-picker-day-radius-sharp); }
.dp-day[aria-disabled="true"] { color: var(--date-picker-day-foreground-disabled); cursor: not-allowed; }
.dp-foot { display: flex; justify-content: flex-end; gap: var(--date-picker-footer-gap); padding-top: var(--date-picker-popover-gap); }
/* narrow screens: presets stack above the calendar (media queries can't read custom properties) */
@media (max-width: 720px) { .dp-pop { flex-direction: column; } .dp-presets { border-right: 0; border-bottom: var(--date-picker-divider-width) solid var(--date-picker-divider-color); } }

/* Dial Pad (organism, draft) — keys are the pad's own part (modelled on the Bottom Sheet Grid Menu Item); call, security and delete
   are Icon Button markup (call: .btn.icon-btn.lg.comms-round.positive in a .comms-wrap, never a FAB; security: the same, negative). Width = three keys + two gaps + padding. */
.dialpad { display: flex; flex-direction: column; gap: var(--dial-pad-container-gap); padding: var(--dial-pad-container-padding); box-sizing: content-box;
  width: calc(var(--dial-pad-key-size) * 3 + var(--dial-pad-keypad-gap) * 2);
  background: var(--dial-pad-container-background); border: var(--dial-pad-container-border-width) solid var(--dial-pad-container-border-color); }
.dialpad-display { display: flex; align-items: center; gap: var(--dial-pad-display-gap); min-height: var(--dial-pad-display-height); }
.dialpad-number { flex: 1; min-width: 0; font: var(--dial-pad-number-font); color: var(--dial-pad-number-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dialpad-number:empty::before { content: attr(data-placeholder); color: var(--dial-pad-number-placeholder-foreground); }
.dialpad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--dial-pad-keypad-gap); }
.dialpad-key { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--dial-pad-key-gap);
  height: var(--dial-pad-key-size); min-height: var(--dial-pad-key-size-minimum); padding: 0 var(--dial-pad-key-padding-x); cursor: pointer;
  background: var(--dial-pad-key-background-enabled); border: var(--dial-pad-key-border-width) solid var(--dial-pad-key-border-color);
  border-radius: var(--dial-pad-key-radius-rounded); font: var(--dial-pad-key-label-font); color: var(--dial-pad-key-label-foreground);
  transition: background-color var(--dial-pad-key-transition); }
.dialpad-key:hover { background: var(--dial-pad-key-background-hover); }
.dialpad-key:active { background: var(--dial-pad-key-background-pressed); }
.dialpad-key:focus-visible { outline: var(--dial-pad-focus-ring-width) solid var(--dial-pad-focus-ring-color); }
.dialpad-key small { font: var(--dial-pad-key-sublabel-font); color: var(--dial-pad-key-sublabel-foreground); min-height: var(--dial-pad-key-sublabel-height); }
.dialpad.sharp .dialpad-key, [data-shape="sharp"] .dialpad-key { border-radius: var(--dial-pad-key-radius-sharp); }
.dialpad-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--dial-pad-actions-gap); align-items: start; justify-items: center; }
.dialpad-actions > :nth-child(1) { grid-column: 2; } .dialpad-actions > :nth-child(2) { grid-column: 3; }
.dialpad-status { margin: 0; font: var(--dial-pad-status-font); color: var(--dial-pad-status-foreground); min-height: var(--dial-pad-key-sublabel-height); text-align: center; }

/* Dialog (organism) — markup: <div class="dialog-surface [info|warning|error] [sharp] [full] [stacked]">
   .dialog-header > .icon + h3 + [button.btn.icon-btn.subtle.sm.dialog-close] · .dialog-body · .dialog-footer > [.btn.text] + .group > .btn.outline-subtle + .btn
   Footer buttons are Button atoms (medium); a sharp dialog makes them sharp. Inside a native <dialog class="dialog"> it is modal.
   Show Close off: leave out .dialog-close. ✕, the scrim, Escape and Back keep the entries; Cancel discards them (and asks first if there are any).
   The title wraps. .stacked (when any footer label doesn't fit): buttons full width, primary on top.
   .full: below --breakpoint-medium-min (600px) a dialog holding a task fills the window, square, no shadow.
   The transparent border is the edge forced-colours mode draws. */
.dialog-surface { display: flex; flex-direction: column; box-sizing: border-box; max-width: 100%;
  max-height: calc(100dvh - 2 * var(--dialog-container-padding)); padding: var(--dialog-container-padding);
  background: var(--dialog-container-background); border: var(--dialog-container-border-width) solid var(--dialog-container-border-color);
  border-radius: var(--dialog-container-radius-round); box-shadow: var(--dialog-container-shadow); }
.dialog-surface > * { width: var(--dialog-content-width); max-width: 100%; box-sizing: border-box; }
.dialog-header { display: flex; align-items: flex-start; gap: var(--dialog-header-gap); flex: none;
  min-height: var(--dialog-header-height); padding: var(--dialog-header-padding); }
.dialog-header > .icon { font-size: var(--dialog-header-icon-size); color: var(--dialog-header-icon-foreground); }
.dialog-surface.info .dialog-header > .icon { color: var(--dialog-header-icon-foreground-info); }
.dialog-surface.warning .dialog-header > .icon { color: var(--dialog-header-icon-foreground-warning); }
.dialog-surface.error .dialog-header > .icon { color: var(--dialog-header-icon-foreground-error); }
.dialog-header h3 { flex: 1; min-width: 0; margin: 0; font: var(--dialog-title-font); color: var(--dialog-title-foreground); overflow-wrap: anywhere; }
.dialog-header .dialog-close { --_fg: var(--dialog-close-foreground); }
.dialog-body { flex: 1 1 auto; overflow: auto; padding: var(--dialog-body-padding) var(--dialog-body-padding) var(--dialog-body-padding-bottom);
  font: var(--dialog-body-font); color: var(--dialog-body-foreground); }
.dialog-footer { display: flex; align-items: center; justify-content: space-between; flex: none; padding: var(--dialog-footer-padding); }
.dialog-footer .group { display: flex; gap: var(--dialog-footer-gap); margin-inline-start: auto; }
.dialog-footer .btn { min-height: var(--dialog-footer-button-height); }
.dialog-surface.stacked .dialog-footer, .dialog-surface.stacked .dialog-footer .group { flex-direction: column-reverse; align-items: stretch; gap: var(--dialog-footer-gap); }
.dialog-surface.stacked .dialog-footer .group { margin: 0; }
.dialog-surface.sharp { border-radius: var(--dialog-container-radius-sharp); }
@media (max-width: 599.98px) { /* below --breakpoint-medium-min */
  .dialog-surface.full { width: 100%; height: 100dvh; max-height: none; border-radius: var(--dialog-container-radius-sharp); box-shadow: none; }
  .dialog-surface.full > * { width: 100%; }
  .dialog-surface.full .dialog-body { flex: 1; } }
.dialog-surface.sharp .btn { border-radius: var(--button-container-radius-sharp); }
dialog.dialog { padding: 0; border: 0; background: none; max-width: 100%; max-height: 100%; overflow: visible; }
dialog.dialog::backdrop { background: var(--dialog-scrim-background); }

/* File Upload (organism, draft) — drop zone + "Select files" Button; uploaded files are Upload Items in .fileupload-files.
   An error caption starts with an error icon: <span class="fileupload-caption"><span class="icon">error</span>…</span>. */
.fileupload-zone { display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; width: 100%;
  gap: var(--file-upload-container-gap); padding: var(--file-upload-container-padding);
  border: var(--file-upload-container-border-width) dashed var(--file-upload-container-border-color-enabled);
  border-radius: var(--file-upload-container-radius-rounded); background: var(--file-upload-container-background-enabled); }
.fileupload-zone.is-sharp { border-radius: var(--file-upload-container-radius-sharp); }
.fileupload-zone.is-active { border-color: var(--file-upload-container-border-color-active); background: var(--file-upload-container-background-active); }
.fileupload-zone.is-error { border-color: var(--file-upload-container-border-color-error); }
.fileupload-text { display: flex; flex-direction: column; align-items: center; gap: var(--file-upload-text-gap); }
.fileupload-headline { font: var(--file-upload-headline-font); color: var(--file-upload-headline-foreground); }
.fileupload-or, .fileupload-caption { font: var(--file-upload-caption-font); color: var(--file-upload-caption-foreground); padding: 0 var(--file-upload-caption-padding-x); }
.fileupload-zone.is-error .fileupload-caption { color: var(--file-upload-caption-foreground-error); }
.fileupload-caption .icon { color: inherit; vertical-align: text-bottom; }
.fileupload-live { display: flex; flex-direction: column; gap: var(--file-upload-files-gap); width: 100%; }
.fileupload-files { display: flex; flex-direction: column; border-radius: var(--file-upload-container-radius-rounded); overflow: hidden; }

/* Gantt View (organism, draft) — measurements are provisional; avatars, tooltip and segmented control use their own markup.
   The today marker is always shown. A second Segmented Control in .gv-tools switches Timeline / Table; the table view is Table markup (.dtab).
   Grouped by resource, a row may hold several .gv-bar-wrap bars. */
.gv { --gv-day: var(--gantt-view-day-width-week); --gv-step: 7; --gv-task: var(--gantt-view-task-column-width); --gv-row: var(--gantt-view-row-height);
  --_bw: var(--gantt-view-container-border-width); --_line: var(--gantt-view-container-border-color);
  background: var(--gantt-view-container-background); color: var(--gantt-view-content-foreground);
  border: var(--_bw) solid var(--_line); border-radius: var(--gantt-view-container-radius-rounded); overflow: hidden; }
.gv.sharp { border-radius: var(--gantt-view-container-radius-sharp); }
.gv[data-scale="day"] { --gv-day: var(--gantt-view-day-width-day); --gv-step: 1; }
.gv[data-scale="month"] { --gv-day: var(--gantt-view-day-width-month); }
.gv-tools { display: flex; flex-wrap: wrap; gap: var(--gantt-view-toolbar-gap); align-items: center; justify-content: space-between;
  padding: var(--gantt-view-toolbar-padding-y) var(--gantt-view-toolbar-padding-x); border-bottom: var(--_bw) solid var(--_line); }
.gv-title { font: var(--gantt-view-title-font); }
.gv-scroll { overflow: auto; }
.gv-scroll:focus-visible { outline: var(--gantt-view-focus-ring-width) solid var(--gantt-view-focus-ring-color); outline-offset: calc(-1 * var(--gantt-view-focus-ring-width)); }
.gv-canvas { --gv-days: 0; --gv-today: 0; /* set inline */ position: relative; width: calc(var(--gv-task) + var(--gv-day) * var(--gv-days)); min-width: 100%; }
.gv-row { display: grid; grid-template-columns: var(--gv-task) 1fr; height: var(--gv-row); border-bottom: var(--_bw) solid var(--_line); }
.gv-row.gv-head { height: auto; }
.gv-row:last-child { border-bottom: 0; }
.gv-task { position: sticky; left: 0; z-index: 3; display: flex; align-items: center; gap: var(--gantt-view-task-gap); min-width: 0;
  padding: 0 var(--gantt-view-task-padding-x); background: var(--gantt-view-container-background); border-right: var(--_bw) solid var(--_line); }
.gv-task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gv-task-name { font: var(--gantt-view-task-name-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-task-sub { display: flex; align-items: center; gap: var(--gantt-view-task-meta-gap); font: var(--gantt-view-task-meta-font); color: var(--gantt-view-content-foreground-subtle); white-space: nowrap; }
.gv-task-sub .icon { font-size: var(--gantt-view-status-icon-size); color: inherit; }
.gv-head .gv-task { align-items: flex-end; padding-bottom: var(--gantt-view-task-meta-gap); font: var(--gantt-view-header-font); color: var(--gantt-view-content-foreground-subtle); }
.gv-track { position: relative; background-image: linear-gradient(to right, var(--_line) var(--_bw), transparent var(--_bw));
  background-size: calc(var(--gv-day) * var(--gv-step)) 100%; }
.gv-head .gv-track { display: flex; flex-direction: column; background-image: none; }
.gv-hrow { position: relative; height: var(--gantt-view-header-row-height); }
.gv-hrow + .gv-hrow { border-top: var(--_bw) solid var(--_line); }
.gv-hcell { --s: 0; --l: 1; /* start day and length, set inline */ position: absolute; top: 0; bottom: 0; left: calc(var(--gv-day) * var(--s)); width: calc(var(--gv-day) * var(--l)); display: flex; align-items: center;
  padding-left: var(--gantt-view-header-padding-x); border-left: var(--_bw) solid var(--_line);
  font: var(--gantt-view-header-font); color: var(--gantt-view-content-foreground-subtle); overflow: hidden; white-space: nowrap; }
.gv-today { position: absolute; z-index: 2; top: 0; bottom: 0; left: calc(var(--gv-task) + var(--gv-day) * var(--gv-today)); width: var(--gantt-view-today-marker-width);
  background: var(--gantt-view-today-marker-background); pointer-events: none; }
.gv-today span { position: absolute; top: var(--gantt-view-today-label-offset); left: var(--gantt-view-today-label-offset); padding: 0 var(--gantt-view-today-label-padding-x);
  border-radius: var(--gantt-view-bar-radius-rounded); font: var(--gantt-view-today-label-font);
  background: var(--gantt-view-today-marker-background); color: var(--gantt-view-today-label-foreground); }
.gv-bar-wrap { --s: 0; --l: 1; position: absolute; top: 0; bottom: 0; left: calc(var(--gv-day) * var(--s)); width: calc(var(--gv-day) * var(--l)); min-width: var(--gantt-view-touch-target-size-minimum); display: block; }
.gv-bar-wrap > .tooltip { left: 0; transform: none; }
.gv-bar-wrap > .tooltip::after { left: var(--gantt-view-tooltip-offset); }
.gv-bar { display: block; width: 100%; height: 100%; padding: calc((var(--gv-row) - var(--gantt-view-bar-height)) / 2) 0; margin: 0; border: 0; background: transparent; cursor: pointer; }
.gv-bar-body { position: relative; display: block; width: 100%; height: 100%; overflow: hidden; background: var(--gantt-view-bar-background);
  border: var(--_bw) solid var(--gantt-view-bar-border-color); border-radius: var(--gantt-view-bar-radius-rounded); }
.gv-fill { --p: 0; /* percent done, set inline */ position: absolute; top: 0; bottom: 0; left: 0; width: calc(var(--p) * 1%); background: var(--gantt-view-bar-progress-background); }
.gv-bar:hover .gv-bar-body { border-color: var(--gantt-view-bar-border-color-hover); }
.gv-bar[aria-pressed="true"] .gv-bar-body { box-shadow: inset 0 0 0 var(--gantt-view-bar-border-width-selected) var(--gantt-view-bar-border-color-selected); border-color: var(--gantt-view-bar-border-color-selected); }
.gv-bar:focus-visible { outline: var(--gantt-view-focus-ring-width) solid var(--gantt-view-focus-ring-color); }
/* text alternative: visually hidden, read by screen readers */
.gv-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Global Header (organism) — locked to Dark: always put data-theme="dark" on .gh (a project override may set "light"); everything inside follows.
   Rounded on (the default; Figma's is off) = no data-shape (or "rounded"). Rounded off = data-shape="sharp" on .gh, which squares the bar,
   the account control and every nested Button / Icon Button / Search.
   Markup: <header class="gh" data-theme="dark" [data-shape="sharp"]>
     <div class="gh-left"> button.btn.icon-btn.subtle (hamburger) · .gh-logo (Logo slot) · [.gh-name] · [.site-sw (Site Switcher)] </div>
     [<span class="divider vertical" role="separator" aria-orientation="vertical"></span>]
     <div class="gh-middle"> [<nav class="gh-menu">…</nav>] · [<div class="gh-search">Search</div>] · [<div class="gh-actions">… [button.btn.icon-btn.subtle.gh-more (more_vertical, opens a Dropdown Menu at narrow widths)]</div>] </div>
     [<div class="connection-status …">…</div> (Connection Status, before the account group)]
     [divider]
     <div class="gh-right"><div class="gh-dd"><button class="gh-profile" aria-haspopup="menu" aria-expanded="false"><span class="gh-profile-name">Name</span>
       <span class="avatar xxs">AM</span><span class="icon">expand_more</span></button><div class="dm-panel" role="menu" hidden>…</div></div>
       [button.btn.icon-btn.subtle (apps)]</div></header>
   Below 600px (--breakpoint-medium-min) the search becomes an Icon Button (give .gh-search the search-bar markup and a
   button.btn.icon-btn.subtle.gh-search-btn beside it; the media query swaps them); secondary actions move into .gh-more. */
.gh { display: flex; align-items: center; gap: var(--global-header-container-gap); box-sizing: border-box; width: 100%; min-width: min-content;
  padding: var(--global-header-container-padding); background: var(--global-header-container-background); color: var(--global-header-platform-name-foreground);
  border: var(--global-header-container-border-width) solid var(--global-header-container-border-color); border-radius: var(--global-header-container-radius-rounded); }
.gh[data-shape="sharp"] { border-radius: var(--global-header-container-radius-sharp); }
.gh > .divider.vertical { align-self: stretch; }
.gh [hidden], .gh .divider[hidden] { display: none; }
.gh-left { display: flex; align-items: center; gap: var(--global-header-leading-gap); flex: none; }
.gh-logo { display: inline-flex; align-items: center; flex: none; }
.gh-name { font: var(--global-header-platform-name-font); color: var(--global-header-platform-name-foreground); white-space: nowrap; }
.gh-middle { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: var(--global-header-middle-gap); }
.gh-menu { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--global-header-menu-gap); }
.gh-search { flex: none; width: var(--global-header-search-max-width); max-width: 100%; }
.gh-actions { display: flex; align-items: center; gap: var(--global-header-actions-gap); flex: none; }
.gh-right { display: flex; align-items: center; gap: var(--global-header-account-gap); flex: none; }
.gh-more, .gh-search-btn { display: none; }
@media (max-width: 599.98px) { /* below --breakpoint-medium-min */
  .gh-search { display: none; } .gh-search-btn, .gh-more { display: inline-flex; } .gh-actions > :not(.gh-more) { display: none; } }

/* account control (_User Profile): trigger of a Dropdown Menu */
.gh-dd { position: relative; }
.gh-dd > .dm-panel { left: auto; right: 0; width: max-content; z-index: 5; }
.gh-profile { display: inline-flex; align-items: center; gap: var(--global-header-profile-gap); box-sizing: border-box; cursor: pointer;
  min-height: var(--global-header-profile-height); padding: var(--global-header-profile-padding-y) var(--global-header-profile-padding-x);
  background: var(--global-header-profile-background-enabled); color: var(--global-header-profile-label-foreground); font: var(--global-header-profile-label-font);
  border: 0; border-radius: var(--global-header-profile-radius-rounded);
  box-shadow: inset 0 0 0 var(--global-header-profile-border-width) var(--global-header-profile-border-color); white-space: nowrap; }
[data-shape="sharp"] .gh-profile { border-radius: var(--global-header-profile-radius-sharp); }
.gh-profile > .icon { font-size: var(--global-header-profile-icon-size); color: inherit; }
.gh-profile:hover { background: var(--global-header-profile-background-hover); }
.gh-profile:active { background: var(--global-header-profile-background-pressed); }
.gh-profile:focus-visible { outline: 0; background: var(--global-header-profile-background-focused);
  box-shadow: inset 0 0 0 var(--global-header-profile-focus-ring-width) var(--global-header-profile-focus-ring-color); }
.gh-profile:disabled { background: var(--global-header-profile-background-disabled); color: var(--global-header-profile-label-foreground-disabled); cursor: not-allowed;
  box-shadow: inset 0 0 0 var(--global-header-profile-border-width) var(--global-header-profile-border-color-disabled); }

/* Lightbox (organism) — markup: <div class="lightbox [sharp] [static]" role="dialog">
   .lb-toolbar > .lb-name + .lb-counter + .lb-actions > .btn.icon-btn.subtle ×3
   .lb-stage > .lb-track > .lb-frame[data-kind="image|video|pdf|other"] ×n, + .btn.icon-btn.contrast.lb-prev / .lb-next
   Toolbar and navigation buttons are Icon Buttons; the stage's height is set in px by script (never auto) so it can animate.
   .static drops the paging and height transitions (Animated = off). Under reduced motion the panel and each new frame fade in instead.
   Inside a native <dialog class="lightbox-dialog"> it is modal: the panel springs up and the backdrop fades in.
   The transparent border is the edge forced-colours mode draws. */
.lightbox { display: flex; flex-direction: column; gap: var(--lightbox-container-gap); box-sizing: border-box;
  width: var(--lightbox-container-width); max-width: calc(100vw - 2 * var(--lightbox-container-margin));
  max-height: calc(100dvh - 2 * var(--lightbox-container-margin)); padding: var(--lightbox-container-padding);
  background: var(--lightbox-container-background); border: var(--lightbox-container-border-width) solid var(--lightbox-container-border-color);
  border-radius: var(--lightbox-container-radius-rounded); box-shadow: var(--lightbox-container-shadow); }
.lb-toolbar { display: flex; align-items: center; gap: var(--lightbox-toolbar-gap); }
.lb-name { min-width: 0; font: var(--lightbox-name-font); color: var(--lightbox-name-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-counter { flex: none; font: var(--lightbox-counter-font); color: var(--lightbox-counter-foreground); }
.lb-actions { display: flex; gap: var(--lightbox-actions-gap); margin-inline-start: auto; flex: none; }
.lb-actions .btn.icon-btn { width: var(--lightbox-action-size); height: var(--lightbox-action-size); }
.lb-stage { position: relative; overflow: hidden; min-height: var(--lightbox-stage-min-height);
  background: var(--lightbox-stage-background); border-radius: var(--lightbox-stage-radius-rounded);
  transition: height var(--lightbox-paging-transition); }
.lb-track { display: flex; align-items: center; height: 100%; min-height: inherit; transition: transform var(--lightbox-paging-transition); }
.lb-frame { flex: 0 0 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: inherit; }
.lb-frame[data-kind="image"] { padding-block: var(--lightbox-stage-padding-y-image); }
.lb-media { display: grid; place-items: center; max-height: var(--lightbox-media-max-height); max-width: 100%;
  background: var(--lightbox-media-background-image); color: var(--lightbox-media-icon-foreground); }
.lb-media .icon { font-size: var(--lightbox-media-icon-size); color: inherit; }
.lb-media.image { aspect-ratio: 3 / 2; height: var(--lightbox-stage-min-height); }
.lb-media.video { width: 100%; aspect-ratio: 16 / 9; background: var(--lightbox-media-background-video); color: var(--lightbox-media-icon-foreground-video); }
.lb-media.pdf { width: 100%; height: var(--lightbox-media-max-height); background: var(--lightbox-media-background-pdf); }
.lb-media:is(img, video, iframe) { display: block; object-fit: contain; border: 0; }
.lb-unpreviewable { display: flex; flex-direction: column; align-items: center; gap: var(--lightbox-unpreviewable-gap);
  padding: var(--lightbox-unpreviewable-padding-y) var(--lightbox-unpreviewable-padding-x); }
.lb-sheet { position: relative; display: grid; place-items: center; width: calc(var(--lightbox-sheet-fold-size) * 5); aspect-ratio: 3 / 4;
  background: var(--lightbox-sheet-background);
  border: var(--lightbox-sheet-border-width) solid var(--lightbox-sheet-border-color); border-radius: var(--lightbox-sheet-radius);
  color: var(--lightbox-sheet-icon-foreground); }
.lb-sheet .icon { font-size: var(--lightbox-media-icon-size); color: inherit; }
.lb-sheet::after { content: ""; position: absolute; top: calc(-1 * var(--lightbox-sheet-border-width)); right: calc(-1 * var(--lightbox-sheet-border-width));
  width: var(--lightbox-sheet-fold-size); height: var(--lightbox-sheet-fold-size); box-sizing: border-box;
  background: var(--lightbox-sheet-fold-background); border: var(--lightbox-sheet-border-width) solid var(--lightbox-sheet-fold-border-color);
  border-radius: 0 var(--lightbox-sheet-radius) 0 var(--lightbox-sheet-radius); }
.lb-no-preview { font: var(--lightbox-no-preview-font); color: var(--lightbox-no-preview-foreground); text-align: center; }
.lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); width: var(--lightbox-navigation-size); height: var(--lightbox-navigation-size); }
.lb-prev { left: var(--lightbox-navigation-inset); }
.lb-next { right: var(--lightbox-navigation-inset); }
.lb-prev[hidden], .lb-next[hidden] { display: none; }
.lightbox.sharp { border-radius: var(--lightbox-container-radius-sharp); }
.lightbox.sharp .lb-stage { border-radius: var(--lightbox-stage-radius-sharp); }
.lightbox.sharp .btn { border-radius: var(--button-container-radius-sharp); }
.lightbox.static .lb-stage, .lightbox.static .lb-track { transition: none; }
@media (prefers-reduced-motion: reduce) { .lb-stage, .lb-track { transition: none; } .lb-frame { animation: lb-fade var(--lightbox-paging-transition); } }
dialog.lightbox-dialog { padding: 0; border: 0; background: none; max-width: 100%; max-height: 100%; overflow: visible; }
dialog.lightbox-dialog::backdrop { background: var(--lightbox-scrim-background); }
dialog.lightbox-dialog[open] .lightbox { animation: lb-rise var(--lightbox-open-transition); }
dialog.lightbox-dialog[open]::backdrop { animation: lb-fade var(--lightbox-scrim-transition); }
@keyframes lb-rise { from { transform: translateY(100vh); } }
@keyframes lb-fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { dialog.lightbox-dialog[open] .lightbox { animation: lb-fade var(--lightbox-scrim-transition); } }

/* Map View (organism, draft) — measurements are provisional. The base map is an image or the product's map library inside .map-canvas;
   markers are placed by percentage (--x, --y). Markup:
   <div class="map-view [sharp] [list-beside]">
     [<div class="map-list">List Items, one per marker, in step with the markers</div>]
     <div class="map-canvas" tabindex="0" role="region" aria-label="Device locations, Store 12">
       <img class="map-base" alt="">
       <button class="map-marker [warning|error|stale]" style="--x:30;--y:40" aria-pressed="false" aria-label="Printer 4, needs attention, updated 10:42"><span class="icon">printer</span></button>
       <button class="map-cluster" style="--x:60;--y:55" aria-label="Cluster, 12 devices"><span>12</span></button>
       <div class="map-overlay map-controls"><button class="btn icon-btn subtle" aria-label="Zoom in"><span class="icon">zoom_in</span></button>…</div>
       [<div class="map-overlay map-key"><span class="map-key-title">Status</span><span class="map-key-row"><span class="map-key-swatch"></span>Label</span>…</div>]
       [<p class="map-note">Positions updated 10:42</p>]</div></div>
   At compact and medium, switch Map | List with a Segmented Control above (one shown at a time). */
.map-view { display: flex; overflow: hidden; min-height: var(--map-view-container-min-height);
  border: var(--map-view-container-border-width) solid var(--map-view-container-border-color); border-radius: var(--map-view-container-radius-rounded); }
.map-view.sharp, [data-shape="sharp"] .map-view { border-radius: var(--map-view-container-radius-sharp); }
.map-list { flex: none; width: var(--map-view-list-width); overflow: auto; background: var(--map-view-list-background);
  border-right: var(--map-view-container-border-width) solid var(--map-view-list-border-color); }
.map-view:not(.list-beside) .map-list { display: none; }
.map-canvas { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--map-view-container-background); }
.map-canvas:focus-visible { outline: var(--map-view-focus-ring-width) solid var(--map-view-focus-ring-color); outline-offset: calc(-1 * var(--map-view-focus-ring-width)); }
.map-base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* marker: drawn circle inside a touch-minimum hit area */
.map-marker, .map-cluster { position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); translate: -50% -50%;
  display: grid; place-items: center; width: var(--map-view-marker-target-size); height: var(--map-view-marker-target-size);
  padding: 0; border: 0; background: none; cursor: pointer; }
.map-marker::before { content: ""; grid-area: 1 / 1; box-sizing: border-box; width: var(--map-view-marker-size); height: var(--map-view-marker-size);
  border-radius: var(--map-view-marker-radius); background: var(--map-view-marker-background);
  border: var(--map-view-marker-border-width) solid var(--map-view-marker-border-color); }
.map-marker .icon { grid-area: 1 / 1; position: relative; font-size: var(--map-view-marker-icon-size); color: var(--map-view-marker-icon-foreground); }
.map-marker.warning .icon { color: var(--map-view-marker-icon-foreground-warning); }
.map-marker.error .icon { color: var(--map-view-marker-icon-foreground-error); }
.map-marker.stale .icon { color: var(--map-view-marker-foreground-stale); }
.map-marker[aria-pressed="true"]::before { background: var(--map-view-marker-background-selected);
  border: var(--map-view-marker-border-width-selected) solid var(--map-view-marker-border-color-selected); }
.map-cluster { font: var(--map-view-cluster-font); color: var(--map-view-cluster-foreground); }
.map-cluster::before { content: ""; grid-area: 1 / 1; width: var(--map-view-cluster-size); height: var(--map-view-cluster-size);
  border-radius: var(--map-view-marker-radius); background: var(--map-view-cluster-background);
  box-shadow: 0 0 0 var(--map-view-cluster-border-width) var(--map-view-cluster-border-color); }
.map-cluster > span { grid-area: 1 / 1; position: relative; }
.map-marker:focus-visible, .map-cluster:focus-visible { outline: var(--map-view-focus-ring-width) solid var(--map-view-focus-ring-color); outline-offset: 0;
  border-radius: var(--map-view-marker-radius); }

/* floating overlays (controls, key): a backing surface with a transparent border for forced colours */
.map-overlay { position: absolute; display: flex; flex-direction: column; gap: var(--map-view-overlay-gap); padding: var(--map-view-overlay-padding);
  background: var(--map-view-overlay-background); border: var(--map-view-overlay-border-width) solid var(--map-view-overlay-border-color);
  border-radius: var(--map-view-overlay-radius); box-shadow: var(--map-view-overlay-shadow); }
.map-controls { top: var(--map-view-overlay-inset); right: var(--map-view-overlay-inset); }
.map-key { bottom: var(--map-view-overlay-inset); left: var(--map-view-overlay-inset); color: var(--map-view-key-foreground); }
.map-key-title { font: var(--map-view-key-title-font); }
.map-key-row { display: flex; align-items: center; gap: var(--map-view-overlay-gap); font: var(--map-view-key-label-font); font-variant-numeric: tabular-nums; }
.map-key-swatch { flex: none; width: var(--map-view-key-swatch-size); height: var(--map-view-key-swatch-size); background: var(--_c, var(--map-view-marker-border-color)); }
.map-note { position: absolute; bottom: var(--map-view-overlay-inset); right: var(--map-view-overlay-inset); margin: 0;
  font: var(--map-view-note-font); color: var(--map-view-note-foreground); }

/* Navigation Bar (organism) — no fill, padding or gap; only a top border drawn outside its bounds (a box-shadow, so it adds no height).
   Markup: <nav class="nb [spread]" aria-label="…"><div class="nb-slot"> .nb-item ×n </div>
