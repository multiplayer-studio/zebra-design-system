     [<span class="nb-divider"><span class="divider vertical" role="separator" aria-orientation="vertical"></span></span>][<div class="nb-slot nb-right">…</div>]
     [<div class="nb-action"><button class="btn">…</button></div>]</nav>
   .spread = Shrink Items off (items share the width evenly). Item: <a|button class="nb-item" [aria-current="page"] [aria-disabled="true"]>
     <span class="nb-icon"><span class="icon">home</span>[<span class="indicator sm"></span>]</span><span class="nb-label">Home</span></a>
   Figma models no hover or pressed: only focus (code) and colour states. The active item also gets a thick top selection edge (shape, not colour alone).
   Labels wrap to two lines; the height is a minimum. A count badge is <span class="indicator">3</span> (or .lg) in .nb-icon. */
.nb { display: flex; align-items: stretch; width: 100%;
  box-shadow: 0 calc(-1 * var(--navigation-bar-container-border-width)) 0 0 var(--navigation-bar-container-border-color); }
.nb-slot { display: flex; }
.nb > .nb-slot:first-child { margin-right: auto; }
.nb.spread > .nb-slot:first-child { flex: 1; justify-content: space-evenly; margin-right: 0; }
.nb-divider { display: flex; padding: var(--navigation-bar-divider-inset) 0; }
.nb-action { display: flex; align-items: center; gap: var(--navigation-bar-action-gap); padding-left: var(--navigation-bar-action-padding-start); }
.nb-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--navigation-bar-item-gap); flex: none; box-sizing: border-box;
  min-height: var(--navigation-bar-item-height); padding: var(--navigation-bar-item-padding-y) var(--navigation-bar-item-padding-x);
  border: 0; background: none; cursor: pointer; text-decoration: none; text-align: center;
  color: var(--navigation-bar-item-foreground); font: var(--navigation-bar-item-label-font); }
.nb-icon { position: relative; display: inline-flex; }
.nb-item .icon { font-size: var(--navigation-bar-item-icon-size); color: inherit; }
.nb-icon .indicator { position: absolute; left: var(--navigation-bar-item-badge-offset-x); top: var(--navigation-bar-item-badge-offset-y); }
.nb-item[aria-current="page"] { color: var(--navigation-bar-item-foreground-active);
  box-shadow: inset 0 var(--navigation-bar-item-selection-width) 0 0 var(--navigation-bar-item-selection-color); }
.nb-item[aria-disabled="true"] { color: var(--navigation-bar-item-foreground-disabled); cursor: not-allowed; }
.nb-item:focus-visible { outline: var(--navigation-bar-focus-ring-width) solid var(--navigation-bar-focus-ring-color); outline-offset: calc(-1 * var(--navigation-bar-focus-ring-width)); }

/* Navigation Drawer (organism) — follows the page's mode (not locked to Dark). Rounded inside by default; data-shape="sharp" squares the rows and buttons.
   Markup: <div class="nd-frame [standard] [end]" data-open="false">
     [<div class="scrim nd-scrim" aria-hidden="true"></div>]   (modal only)
     <nav class="nd" aria-label="…" [role="dialog" aria-modal="true"]>
       <div class="nd-header"> .nh (its icon button = close) · [button.btn.lg.nd-action] </div>
       <div class="nd-menu"> .smi / .smi-group / hr.divider </div>
       <div class="nd-footer"> .smi … </div></nav>
     [<div class="nd-content">page content</div>]   (standard: pushed by the drawer)</div>
   Modal slides over the frame on a Scrim; standard sits beside .nd-content and widens from nothing. Only the header sticks. */
.nd { display: flex; flex-direction: column; gap: var(--navigation-drawer-container-gap); box-sizing: border-box; flex: none;
  width: var(--navigation-drawer-container-width); max-width: calc(100% - var(--navigation-drawer-container-inset-min));
  padding: 0 var(--navigation-drawer-container-padding-x) var(--navigation-drawer-container-padding-y);
  background: var(--navigation-drawer-container-background-modal); box-shadow: var(--navigation-drawer-container-shadow-modal);
  overflow-y: auto; scrollbar-width: none;
  border-inline-end: var(--navigation-drawer-container-border-width) solid var(--navigation-drawer-container-border-color); } /* forced-colours edge */
.nd-frame.end .nd { border-inline-end: 0; border-inline-start: var(--navigation-drawer-container-border-width) solid var(--navigation-drawer-container-border-color); }
.nd::-webkit-scrollbar { display: none; }
.nd-header { position: sticky; top: 0; z-index: 1; display: flex; flex-direction: column; gap: var(--navigation-drawer-container-gap);
  margin: 0 calc(-1 * var(--navigation-drawer-container-padding-x)); padding: var(--navigation-drawer-container-padding-y) var(--navigation-drawer-container-padding-x) 0;
  background: inherit; }
.nd-action { width: 100%; }
.nd-menu { flex: 1; display: flex; flex-direction: column; gap: var(--navigation-drawer-list-gap); }
.nd-footer { display: flex; flex-direction: column; gap: var(--navigation-drawer-list-gap); }

/* modal: slides over the frame on a Scrim */
.nd-frame { position: relative; overflow: hidden; }
.nd-frame:not(.standard) .nd { --_t: var(--navigation-drawer-container-exit-duration) var(--navigation-drawer-container-exit-easing);
  position: absolute; top: 0; bottom: 0; left: 0; transform: translateX(-100%); visibility: hidden;
  transition: transform var(--_t), visibility var(--_t), opacity var(--_t); }
.nd-frame.end:not(.standard) .nd { left: auto; right: 0; transform: translateX(100%); }
.nd-frame[data-open="true"]:not(.standard) .nd { transform: none; visibility: visible; --_t: var(--navigation-drawer-container-transition); }
.nd-frame > .scrim { opacity: 0; visibility: hidden;
  transition: opacity var(--navigation-drawer-container-transition), visibility var(--navigation-drawer-container-transition); }
.nd-frame[data-open="true"] > .scrim { opacity: 1; visibility: visible; }

/* standard: in the layout, pushes the content, narrows to nothing when closed */
.nd-frame.standard { display: flex; }
.nd-frame.end.standard { flex-direction: row-reverse; }
.nd-frame.standard .nd { background: var(--navigation-drawer-container-background-standard); box-shadow: none;
  transition: width var(--navigation-drawer-container-transition), padding var(--navigation-drawer-container-transition), visibility var(--navigation-drawer-container-transition); }
.nd-frame.standard[data-open="false"] .nd { width: 0; padding-inline: 0; visibility: hidden; }
.nd-content { flex: 1; min-width: 0; }
/* reduced motion: no slide or width change; the modal drawer fades, and the scrim keeps its fade */
@media (prefers-reduced-motion: reduce) { .nd-frame.standard .nd { transition: none; }
  .nd-frame:not(.standard) .nd { transform: none; opacity: 0; } .nd-frame[data-open="true"]:not(.standard) .nd { opacity: 1; } }

/* Navigation Rail (organism) — replaces the old "Left Navigation Rail + related navigation" block (the drawer and bar now have their own).
   Locked to Dark: always put data-theme="dark" on .lnr (Inverse: data-theme="light"), so its tokens and everything inside resolve in that mode;
   AAA still applies from the page. Shape: rounded by default, data-shape="sharp" on .lnr squares items, rows and buttons (never the rail's edges).
   Markup: <div class="lnr [expanded] [labels]" data-theme="dark">
     <nav class="lnr-main" aria-label="…"> .nh (Navigation Header) · button.btn.lg.lnr-action (icon + .btn-label) · .lnr-list (.lnr-item ×3 + .lnr-slot)
       · .lnr-footer (.lnr-slot + 2 items, the last the width toggle) </nav>
     [<div class="lnr-sub"><div class="lnr-sub-header [sub-page]">.icon | back icon button · .lnr-sub-title · .lnr-sub-actions</div>
       <div class="lnr-sub-list"> .smi rows / .smi-group </div></div>]</div>
   Item: <button class="lnr-item" [aria-current="page"] [aria-disabled="true"]><span class="lnr-icon"><span class="icon">home</span>[<span class="indicator sm"></span>]</span><span class="lnr-label">Home</span></button>
   The header action is one Button: narrow, its label is hidden and it squares to the large control height.
   The selected item also gets a thick leading-edge selection bar. Labels wrap (two lines) and items grow; unavailable items use aria-disabled. */
.lnr { display: flex; height: 100%; background: var(--navigation-rail-container-background); color: var(--navigation-rail-item-foreground); }
.lnr-main { display: flex; flex-direction: column; gap: var(--navigation-rail-container-gap); flex: none; box-sizing: border-box; overflow: hidden;
  width: calc(var(--navigation-rail-item-min-size) + 2 * var(--navigation-rail-container-padding-x));
  padding: var(--navigation-rail-container-padding-y) var(--navigation-rail-container-padding-x); transition: width var(--navigation-rail-container-transition); }
.lnr.labels:not(.expanded) .lnr-main { width: auto; min-width: calc(var(--navigation-rail-item-min-size) + 2 * var(--navigation-rail-container-padding-x)); }
.lnr.expanded .lnr-main { width: var(--navigation-rail-container-width-expanded); }
.lnr-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--navigation-rail-list-gap); }
.lnr-footer, .lnr-slot { display: flex; flex-direction: column; gap: var(--navigation-rail-list-gap); }
.lnr-list .lnr-slot { padding: 0 var(--navigation-rail-slot-padding-x); }
.lnr-action { width: 100%; }
.lnr:not(.expanded) .lnr-action { width: var(--button-container-height-large); padding: 0; }
.lnr:not(.expanded) .lnr-action .btn-label { display: none; }

/* rail item */
.lnr-item { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; box-sizing: border-box;
  min-width: var(--navigation-rail-item-min-size); min-height: var(--navigation-rail-item-min-size);
  padding: var(--navigation-rail-item-padding-y) var(--navigation-rail-item-padding-x); border: 0; cursor: pointer; text-decoration: none; text-align: center;
  border-radius: var(--navigation-rail-item-radius-rounded); background: var(--navigation-rail-item-background-enabled);
  color: var(--navigation-rail-item-foreground); font: var(--navigation-rail-item-label-font); }
.lnr-icon { position: relative; display: inline-flex; }
.lnr-item .icon { font-size: var(--navigation-rail-item-icon-size); color: inherit; }
.lnr-icon .indicator { position: absolute; left: var(--navigation-rail-item-badge-offset-x); top: var(--navigation-rail-item-badge-offset-y); }
.lnr-label { display: none; }
.lnr.labels .lnr-label, .lnr.expanded .lnr-label { display: block; }
.lnr.expanded .lnr-item { flex-direction: row; justify-content: flex-start; gap: var(--navigation-rail-item-gap-expanded); width: 100%;
  padding-inline: var(--navigation-rail-item-padding-x-expanded); font: var(--navigation-rail-item-label-font-expanded); }
.lnr.expanded .lnr-label { min-width: 0; overflow-wrap: anywhere; text-align: start; }
.lnr-item:hover { background: var(--navigation-rail-item-background-hover); }
.lnr-item:active { background: var(--navigation-rail-item-background-pressed); }
.lnr-item[aria-current="page"] { background: var(--navigation-rail-item-background-selected); color: var(--navigation-rail-item-foreground-selected);
  box-shadow: inset var(--navigation-rail-item-selection-width) 0 0 0 var(--navigation-rail-item-selection-color); }
.lnr-item[aria-current="page"]:dir(rtl) { box-shadow: inset calc(-1 * var(--navigation-rail-item-selection-width)) 0 0 0 var(--navigation-rail-item-selection-color); }
.lnr-item:focus-visible { outline: var(--navigation-rail-focus-ring-width) solid var(--navigation-rail-focus-ring-color); outline-offset: calc(-1 * var(--navigation-rail-focus-ring-width)); }
.lnr-item[aria-disabled="true"] { background: var(--navigation-rail-item-background-disabled); color: var(--navigation-rail-item-foreground-disabled); cursor: not-allowed; }
[data-shape="sharp"] .lnr-item { border-radius: var(--navigation-rail-item-radius-sharp); }

/* sub menu panel */
.lnr-sub { display: flex; flex-direction: column; box-sizing: border-box; width: max-content; min-width: var(--navigation-rail-submenu-min-width);
  border-inline-start: var(--navigation-rail-submenu-border-width) solid var(--navigation-rail-submenu-border-color); }
.lnr-sub[hidden] { display: none; }
.lnr-sub-header { display: flex; align-items: center; gap: var(--navigation-rail-submenu-header-gap); box-sizing: border-box;
  min-height: var(--navigation-rail-submenu-header-min-height); padding: 0 var(--navigation-rail-submenu-header-padding-x);
  border-bottom: var(--navigation-rail-submenu-border-width) solid var(--navigation-rail-submenu-border-color); }
.lnr-sub-header.sub-page { gap: var(--navigation-rail-submenu-header-gap-sub-page); }
.lnr-sub-header > .icon { font-size: var(--navigation-rail-submenu-header-icon-size); color: var(--navigation-rail-submenu-header-title-foreground); }
.lnr-sub-title { flex: 1; min-width: 0; font: var(--navigation-rail-submenu-header-title-font); color: var(--navigation-rail-submenu-header-title-foreground);
  overflow-wrap: anywhere; }
.lnr-sub-actions { display: flex; align-items: center; gap: var(--navigation-rail-submenu-header-actions-gap); }
.lnr-sub-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--navigation-rail-submenu-gap); padding: var(--navigation-rail-submenu-padding); }
@media (prefers-reduced-motion: reduce) { .lnr-main { transition: none; } } /* the width changes at once; sub groups fade (Sub Menu Item) */

/* Notification Centre (organism, draft) — measurements are provisional. Presented by the screen: inside a Right Drawer Panel at
   medium and up (.notif-centre fills it; the panel's own title and Close are used), full screen at compact (.full shows the
   centre's own title and Close). Markup:
   <section class="notif-centre" aria-labelledby="nc-t">
     <header class="notif-centre-head"><h2 class="notif-centre-title" id="nc-t" tabindex="-1">Notifications</h2>
       <button class="btn text sm">Mark all as read</button>
       <button class="btn icon-btn subtle" aria-label="Notification settings"><span class="icon">settings</span></button>
       <button class="btn icon-btn subtle notif-centre-close" aria-label="Close"><span class="icon">close</span></button></header>
     <div class="notif-centre-filters">Filter Selection Bar</div>
     <div class="notif-centre-list">
       <section class="notif-centre-group" aria-labelledby="g1"><h3 class="notif-centre-group-head" id="g1">Today</h3>
         <ul class="notif-centre-items"><li><article class="notif-li unread">…</article></li>…</ul></section>…
       [Empty State (compact) in place of the groups]</div>
     <div class="notif-centre-foot"><button class="btn text sm">Show earlier</button></div></section>
   Items, filters, buttons and the empty state are styled by their own components. */
.notif-centre { display: flex; flex-direction: column; height: 100%; min-height: 0; width: 100%;
  background: var(--notification-centre-container-background); }
.notif-centre:not(.full) :is(.notif-centre-title, .notif-centre-close) { display: none; } /* in a panel: the panel's title and Close */
.notif-centre:not(.full) .notif-centre-head { justify-content: flex-end; }
.notif-centre-head { flex: none; display: flex; align-items: center; gap: var(--notification-centre-header-gap);
  padding: var(--notification-centre-header-padding-y) var(--notification-centre-header-padding-x); background: var(--notification-centre-header-background);
  border-bottom: var(--notification-centre-header-border-width) solid var(--notification-centre-header-border-color); }
.notif-centre-title { flex: 1; min-width: 0; margin: 0; font: var(--notification-centre-title-font); color: var(--notification-centre-title-foreground); }
.notif-centre-filters { flex: none; padding: var(--notification-centre-filters-padding-y) var(--notification-centre-filters-padding-x);
  background: var(--notification-centre-header-background); }
.notif-centre-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--notification-centre-list-gap);
  padding: var(--notification-centre-list-padding-y) var(--notification-centre-list-padding-x); }
.notif-centre-group { display: flex; flex-direction: column; gap: var(--notification-centre-group-gap); }
.notif-centre-group-head { margin: 0; padding: 0 var(--notification-centre-group-heading-padding-x);
  font: var(--notification-centre-group-heading-font); color: var(--notification-centre-group-heading-foreground); }
.notif-centre-items { display: flex; flex-direction: column; gap: var(--notification-centre-group-gap); margin: 0; padding: 0; list-style: none; }
.notif-centre-foot { flex: none; display: flex; justify-content: center; padding: var(--notification-centre-footer-padding-y) 0; }
.notif-centre-title:focus-visible { outline: var(--button-focus-ring-width) solid var(--button-focus-ring-color); }

/* Right Drawer Panel (organism, draft) — modal (scrim + elevation) or persistent (divider, no scrim); no motion token, so no slide animation.
   Lives inside a positioned frame (.rdp-frame); the close control is an Icon Button, footer actions are Buttons:
   Cancel (outline-subtle) first, the primary last, both at the trailing end; .stacked footer puts the primary on top when narrow.
   Below 600px (--breakpoint-medium-min) the panel is full width and always modal. The title wraps.
   The modal panel's transparent border is the edge forced-colours mode draws. */
.rdp-frame { position: relative; display: flex; }
.rdp-page { flex: 1; min-width: 0; padding: var(--right-drawer-panel-content-padding); overflow: hidden; }
.rdp-scrim { position: absolute; inset: 0; background: var(--right-drawer-panel-scrim-background); visibility: hidden; }
.rdp-frame[data-open="true"] .rdp-scrim { visibility: visible; }
.rdp-panel { position: absolute; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
  width: clamp(var(--right-drawer-panel-container-min-width), var(--right-drawer-panel-container-width), var(--right-drawer-panel-container-max-width));
  background: var(--right-drawer-panel-container-background); color: var(--right-drawer-panel-content-foreground); box-shadow: var(--right-drawer-panel-container-elevation);
  box-sizing: border-box; border: var(--right-drawer-panel-container-border-width) solid var(--right-drawer-panel-container-border-color); border-inline-end: 0;
  border-radius: var(--right-drawer-panel-container-radius-rounded) 0 0 var(--right-drawer-panel-container-radius-rounded);
  transform: translateX(100%); visibility: hidden; }
.rdp-frame[data-open="true"] .rdp-panel { transform: translateX(0); visibility: visible; }
.rdp-frame.sharp .rdp-panel { border-radius: var(--right-drawer-panel-container-radius-sharp); }
.rdp-frame.persistent .rdp-panel { position: relative; flex: none; box-shadow: none; border-radius: var(--right-drawer-panel-container-radius-sharp); transform: none; visibility: visible;
  border: 0; border-left: var(--right-drawer-panel-divider-border-width) solid var(--right-drawer-panel-divider-border-color); }
.rdp-frame.persistent[data-open="false"] .rdp-panel { display: none; }
.rdp-header { display: flex; align-items: center; gap: var(--right-drawer-panel-header-gap);
  padding: var(--right-drawer-panel-header-padding-y) var(--right-drawer-panel-header-padding-x);
  border-bottom: var(--right-drawer-panel-divider-border-width) solid var(--right-drawer-panel-divider-border-color); }
.rdp-title { flex: 1; min-width: 0; margin: 0; font: var(--right-drawer-panel-title-font); color: var(--right-drawer-panel-content-foreground); overflow-wrap: anywhere; }
.rdp-content { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: var(--right-drawer-panel-content-gap); padding: var(--right-drawer-panel-content-padding); }
.rdp-sub { font: var(--right-drawer-panel-content-font-subtle); color: var(--right-drawer-panel-content-foreground-subtle); }
.rdp-footer { display: flex; justify-content: flex-end; gap: var(--right-drawer-panel-footer-gap);
  padding: var(--right-drawer-panel-footer-padding-y) var(--right-drawer-panel-footer-padding-x);
  border-top: var(--right-drawer-panel-divider-border-width) solid var(--right-drawer-panel-divider-border-color); }
.rdp-footer.stacked { flex-direction: column-reverse; align-items: stretch; }
@media (max-width: 599.98px) { /* below --breakpoint-medium-min: full width, always modal */
  .rdp-panel, .rdp-frame.persistent .rdp-panel { position: absolute; width: 100%; } }

/* Screen Header Bar (organism) — <header class="shb"><button class="shb-back" type="button" aria-label="Back"><span class="icon">chevron_left</span></button>
     <h2 class="shb-title">Title</h2><div class="shb-actions"><button class="btn [shape-sharp]"><span class="btn-label">Save</span></button></div></header>
   Transparent; fills its container. Rounded (default) / sharp is the slot Button's shape, not the bar's. */
.shb { display: flex; align-items: center; gap: var(--screen-header-bar-container-gap); width: 100%; box-sizing: border-box;
  padding: var(--screen-header-bar-container-padding-y) var(--screen-header-bar-container-padding-x); background: var(--screen-header-bar-container-background); }
.shb-back { display: inline-flex; flex: none; padding: 0; border: 0; background: none; cursor: pointer; color: var(--screen-header-bar-icon-foreground); }
.shb-back .icon { font-size: var(--screen-header-bar-icon-size); color: inherit; }
.shb-back:focus-visible { outline: var(--screen-header-bar-focus-ring-width) solid var(--screen-header-bar-focus-ring-color); }
.shb-title { flex: 1; min-width: 0; margin: 0; font: var(--screen-header-bar-title-font); color: var(--screen-header-bar-title-foreground); overflow-wrap: anywhere; } /* wraps */
.shb-actions { display: flex; align-items: center; gap: var(--screen-header-bar-action-gap); flex: none; }

/* Stepper (organism) — Markup:
   horizontal: <ol class="stepper-h"><li class="stepper-step is-<status>"><div class="stepper-col"><span class="stepper-marker">1</span><span class="stepper-text"><span class="stepper-title">Label</span>[<span class="stepper-subtitle">…</span>]</span></div><span class="stepper-connector"></span></li>…</ol>
   vertical:   <ol class="stepper-v"><li class="stepper-step is-<status>"><span class="stepper-rail"><span class="stepper-marker">1</span><span class="stepper-connector"></span></span><span class="stepper-text"><span class="stepper-title">…</span></span></li>…</ol>
   cards:      <ol class="stepper-cards [sharp]"><li class="stepper-card is-<status>"><span class="stepper-marker">1</span><span class="stepper-text">…</span></li>…</ol>
   compact:    <div class="stepper-compact"><div class="stepper-summary"><span class="stepper-count">Step 3 of 5</span> (or "Step 3" when the length is open)<span class="stepper-heading"><span class="stepper-compact-title">…</span><span class="stepper-compact-subtitle">…</span></span></div><div class="stepper-segments"><span class="stepper-segment is-<status>"></span>…</div></div>
   Status: is-default, is-complete (is-success kept as an alias), is-partial, is-active, is-error, is-disabled. Complete holds a check_mark icon, error a priority icon.
   Omit the connector on the last step (Show Line off).
   Revisitable completed steps: make .stepper-col (or a step card) a <button class="stepper-col"> / <a>; it takes hover and pressed tints and a focus ring. */
.stepper-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.stepper-scroll { overflow-x: auto; max-width: 100%; }

/* status → local colours (indicator, label, connector, card, segment) */
.stepper-step, .stepper-card, .stepper-segment {
  --_ib: var(--stepper-indicator-background-default); --_ic: var(--stepper-indicator-border-color-default); --_if: var(--stepper-indicator-foreground-default);
  --_lf: var(--stepper-label-foreground-default); --_sf: var(--stepper-subtitle-foreground); --_ln: var(--stepper-connector-color-default);
  --_cb: var(--stepper-card-container-background-default); --_cc: var(--stepper-card-container-border-color-default); --_cl: var(--stepper-card-label-foreground-default);
  --_s1: var(--stepper-segment-start-background-default); --_s2: var(--stepper-segment-end-background-default); }
:is(.stepper-step, .stepper-card, .stepper-segment):is(.is-complete, .is-success) {
  --_ib: var(--stepper-indicator-background-complete); --_ic: var(--stepper-indicator-border-color-complete); --_if: var(--stepper-indicator-foreground-complete);
  --_lf: var(--stepper-label-foreground-complete); --_ln: var(--stepper-connector-color-complete);
  --_cb: var(--stepper-card-container-background-complete); --_cc: var(--stepper-card-container-border-color-complete); --_cl: var(--stepper-card-label-foreground-complete);
  --_s1: var(--stepper-segment-start-background-complete); --_s2: var(--stepper-segment-end-background-complete); }
:is(.stepper-step, .stepper-card, .stepper-segment).is-partial {
  --_ib: var(--stepper-indicator-background-partial); --_ic: var(--stepper-indicator-border-color-partial); --_if: var(--stepper-indicator-foreground-partial);
  --_lf: var(--stepper-label-foreground-partial); --_ln: var(--stepper-connector-color-partial);
  --_cb: var(--stepper-card-container-background-partial); --_cc: var(--stepper-card-container-border-color-partial); --_cl: var(--stepper-card-label-foreground-partial);
  --_s1: var(--stepper-segment-start-background-partial); --_s2: var(--stepper-segment-end-background-partial); }
:is(.stepper-step, .stepper-card, .stepper-segment).is-active {
  --_ib: var(--stepper-indicator-background-active); --_ic: var(--stepper-indicator-border-color-active); --_if: var(--stepper-indicator-foreground-active);
  --_lf: var(--stepper-label-foreground-active); --_ln: var(--stepper-connector-color-active);
  --_cb: var(--stepper-card-container-background-active); --_cc: var(--stepper-card-container-border-color-active); --_cl: var(--stepper-card-label-foreground-active);
  --_s1: var(--stepper-segment-start-background-active); --_s2: var(--stepper-segment-end-background-active); }
:is(.stepper-step, .stepper-card, .stepper-segment).is-error {
  --_ib: var(--stepper-indicator-background-error); --_ic: var(--stepper-indicator-border-color-error); --_if: var(--stepper-indicator-foreground-error);
  --_lf: var(--stepper-label-foreground-error); --_ln: var(--stepper-connector-color-error);
  --_cb: var(--stepper-card-container-background-error); --_cc: var(--stepper-card-container-border-color-error); --_cl: var(--stepper-card-label-foreground-error);
  --_s1: var(--stepper-segment-start-background-error); --_s2: var(--stepper-segment-end-background-error); }
:is(.stepper-step, .stepper-card, .stepper-segment).is-disabled {
  --_ib: var(--stepper-indicator-background-disabled); --_ic: var(--stepper-indicator-border-color-disabled); --_if: var(--stepper-indicator-foreground-disabled);
  --_lf: var(--stepper-label-foreground-disabled); --_sf: var(--stepper-subtitle-foreground-disabled); --_ln: var(--stepper-connector-color-disabled);
  --_cb: var(--stepper-card-container-background-disabled); --_cc: var(--stepper-card-container-border-color-disabled); --_cl: var(--stepper-card-label-foreground-disabled);
  --_s1: var(--stepper-segment-start-background-disabled); --_s2: var(--stepper-segment-end-background-disabled); }

/* indicator + text (shared) */
.stepper-marker { flex: none; display: grid; place-items: center; box-sizing: border-box;
  width: var(--stepper-indicator-size); height: var(--stepper-indicator-size); border-radius: var(--stepper-indicator-radius);
  font: var(--stepper-indicator-font); background: var(--_ib); color: var(--_if); box-shadow: inset 0 0 0 var(--stepper-indicator-border-width) var(--_ic); }
.stepper-marker .icon { font-size: var(--stepper-indicator-icon-size); color: inherit; }
.stepper-text { display: flex; flex-direction: column; gap: var(--stepper-text-gap); padding-top: var(--stepper-text-padding-top); min-width: 0; }
.stepper-title { font: var(--stepper-label-font); color: var(--_lf); }
.stepper-subtitle { font: var(--stepper-subtitle-font); color: var(--_sf); }

/* horizontal (Size=default): head (indicator over centred text) + track whose line fills the rest */
.stepper-h { display: flex; align-items: flex-start; list-style: none; margin: 0; padding: 0 var(--stepper-horizontal-container-padding-x); }
.stepper-h .stepper-step { flex: 1 1 0; display: flex; align-items: flex-start; padding: var(--stepper-horizontal-step-padding-y) 0; }
.stepper-h .stepper-step:last-child { flex: none; }
.stepper-col { display: flex; flex-direction: column; align-items: center; gap: var(--stepper-horizontal-head-gap); flex: none; width: var(--stepper-indicator-size); }
.stepper-col .stepper-text { align-items: center; }
:is(button, a):is(.stepper-col, .stepper-card) { border: 0; background: none; color: inherit; font: inherit; text-decoration: none; cursor: pointer; border-radius: var(--stepper-step-radius); }
:is(button, a):is(.stepper-col, .stepper-card):hover { background: var(--stepper-step-background-hover); }
:is(button, a):is(.stepper-col, .stepper-card):active { background: var(--stepper-step-background-pressed); }
:is(button, a):is(.stepper-col, .stepper-card):focus-visible { outline: var(--stepper-step-focus-ring-width) solid var(--stepper-step-focus-ring-color); }
.stepper-col :is(.stepper-text, .stepper-title, .stepper-subtitle) { width: max-content; text-align: center; }
.stepper-h .stepper-connector { flex: 1; align-self: flex-start; height: var(--stepper-horizontal-track-height);
  background: linear-gradient(var(--_ln), var(--_ln)) center / 100% var(--stepper-connector-width) no-repeat; }

/* vertical (Card=false): rail (indicator above connector) beside the text */
.stepper-v { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--stepper-vertical-steps-gap); }
.stepper-v .stepper-step { display: flex; align-items: stretch; gap: var(--stepper-vertical-step-gap); }
.stepper-rail { display: flex; flex-direction: column; align-items: center; flex: none; }
.stepper-v .stepper-connector { flex: 1; width: var(--stepper-connector-width); min-height: var(--stepper-vertical-connector-length); background: var(--_ln); }

/* vertical (Card=true): Step Card, rounded by default, .sharp on the list */
.stepper-cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--stepper-vertical-cards-gap); }
.stepper-card { display: flex; align-items: flex-start; gap: var(--stepper-card-container-gap); box-sizing: border-box; min-height: var(--stepper-card-container-min-height);
  padding: var(--stepper-card-container-padding-y) var(--stepper-card-container-padding-x); background: var(--_cb);
  border: var(--stepper-card-container-border-width) solid var(--_cc); border-radius: var(--stepper-card-container-radius-rounded); }
.stepper-cards.sharp .stepper-card { border-radius: var(--stepper-card-container-radius-sharp); }
.stepper-card .stepper-text { flex: 1; }
.stepper-card .stepper-title { color: var(--_cl); }

/* compact (Size=compact): summary over a bar of two-half segments */
.stepper-compact { display: flex; flex-direction: column; gap: var(--stepper-compact-container-gap); }
.stepper-summary { display: flex; flex-direction: column; gap: var(--stepper-compact-summary-gap); }
.stepper-count { display: flex; gap: var(--stepper-compact-count-gap); font: var(--stepper-compact-count-font); color: var(--stepper-compact-count-foreground); }
.stepper-heading { display: flex; flex-direction: column; gap: var(--stepper-compact-summary-gap); }
.stepper-compact-title { font: var(--stepper-compact-title-font); color: var(--stepper-compact-title-foreground); }
.stepper-compact-subtitle { font: var(--stepper-compact-subtitle-font); color: var(--stepper-compact-subtitle-foreground); }
.stepper-segments { display: flex; gap: var(--stepper-compact-segments-gap); }
.stepper-segment { flex: 1 1 0; height: var(--stepper-segment-height); border-radius: var(--stepper-segment-radius);
  background: linear-gradient(90deg, var(--_s1) 50%, var(--_s2) 50%); }
.stepper-controls { display: flex; gap: var(--stepper-horizontal-head-gap); margin-top: var(--stepper-compact-container-gap); }

/* Table (organism) — replaces the old Data Table block; keeps the .dtab prefix. Rounded by default; data-shape="sharp" on .dtab squares the table
   and every component inside. Markup: <div class="dtab [vscroll]" [data-shape="sharp"]>
     [<div class="dtab-controls"><div class="dtab-search">Search</div> · <span class="chips-label dtab-count" aria-live="polite"></span> · [.dtab-slot]
       · [<button class="btn text sm dtab-updates">3 new rows</button> (live updates held)] · [column settings icon button]</div>]
     <div class="dtab-scroll"><table class="dtab-table"><thead><tr><th class="dtab-check">checkbox</th>
       <th aria-sort="none|ascending|descending"><span class="dtab-head"><button class="dtab-sort">Label<span class="icon">unfold_more | arrow_up | arrow_down</span>[<span class="dtab-sort-order">1</span>]</button>[<button class="dtab-filter [active]"><span class="icon">filter</span></button>]</span><span class="dtab-grip" tabindex="0" role="separator"></span></th>
       … <th class="dtab-act"></th></tr></thead>
       <tbody><tr [class="is-selected"] [aria-disabled="true"]><td class="dtab-check">…</td><td>text | <span class="dtab-person"><span class="avatar xxs"></span><span><span>Title</span><span class="dtab-sub">Sub</span></span></span></td>…
       <td class="dtab-act"><button class="btn icon-btn subtle sm">more_vertical</button></td></tr> | <tr class="dtab-empty"><td colspan>…</td></tr></tbody></table></div>
     [<div class="dtab-footer"><div class="dtab-footer-start"><span class="dtab-range">…</span><label class="dtab-rpp">Rows per page <select>…</select></label></div> · Pagination</div>]</div>
   Frozen column: the identifier column is frozen by default: .dtab-frozen (+ .dtab-frozen-edge) on the first column's cells; more frozen columns
   each need their own left offset. The header row always sticks. Header labels wrap to two lines (full text in title); cells wrap
   (.dtab-truncate opts a resizable column into one line). Numbers: .dtab-num / .num (end-aligned, tabular figures). Missing values: .dtab-missing.
   Variants: .dense, .striped, .reflow (each row a label/value block; cells carry data-label). Rows: tr.is-error (error bar on the leading edge),
   expandable rows (td.dtab-expand with a chevron Icon Button, then tr.dtab-detail > td[colspan]), inline actions (.dtab-act .dtab-actions),
   totals (tfoot.dtab-totals), loading (Skeleton text lines in each td). */
.dtab { display: flex; flex-direction: column; overflow: hidden; background: var(--table-cell-background-enabled);
  border-radius: var(--table-container-radius-rounded); }
[data-shape="sharp"].dtab, [data-shape="sharp"] .dtab { border-radius: var(--table-container-radius-sharp); }
.dtab-controls, .dtab-footer { display: flex; align-items: center; gap: var(--table-bar-gap); box-sizing: border-box;
  padding: var(--table-bar-padding-y) var(--table-bar-padding-x); background: var(--table-bar-background); }
.dtab-slot { margin-inline-start: auto; }
.dtab-count:empty { display: none; }
.dtab-slot { display: flex; align-items: center; gap: var(--table-bar-gap); }
.dtab-footer { justify-content: space-between; }
.dtab-footer-start { display: flex; align-items: center; gap: var(--table-footer-start-gap); font: var(--table-footer-text-font); color: var(--table-footer-text-foreground); }
.dtab-rpp { display: inline-flex; align-items: center; gap: var(--table-bar-gap); }
.dtab-scroll { overflow: auto; }
.dtab.vscroll .dtab-scroll { max-height: var(--table-content-max-height); }
.dtab-table { width: 100%; border-collapse: separate; border-spacing: 0; font: var(--table-cell-text-font); color: var(--table-cell-text-foreground); }

/* header cells */
.dtab-table thead th { position: sticky; top: 0; z-index: 2; text-align: start; font: var(--table-header-label-font); color: var(--table-header-label-foreground);
  padding: var(--table-header-cell-padding-y) var(--table-header-cell-padding-x); background: var(--table-header-cell-background-enabled);
  border-bottom: var(--table-container-border-width) solid var(--table-header-cell-border-color); }
.dtab-table thead th:hover { background: var(--table-header-cell-background-hover); }
.dtab-table thead th:focus-within { background: var(--table-header-cell-background-focused); }
.dtab-table thead th[aria-disabled="true"] { background: var(--table-header-cell-background-disabled); color: var(--table-header-label-foreground-disabled); }
.dtab-head { display: flex; align-items: center; justify-content: space-between; gap: var(--table-header-label-gap); }
.dtab-sort { display: inline-flex; align-items: center; text-align: start; gap: var(--table-header-label-gap); padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.dtab-sort .icon { font-size: var(--table-header-icon-size); color: var(--table-sort-foreground); }
.dtab-table thead th:hover .dtab-sort .icon { color: var(--table-sort-foreground-hover); }
.dtab-table thead th:is([aria-sort="ascending"], [aria-sort="descending"]) .dtab-sort .icon { color: var(--table-sort-foreground-active); }
.dtab-sort-order { font: var(--table-sort-order-font); color: var(--table-sort-foreground-active); }
.dtab-table thead th[aria-disabled="true"] .dtab-sort .icon { color: var(--table-sort-foreground-disabled); }
.dtab-filter { display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer; color: var(--table-header-filter-foreground); }
.dtab-filter .icon { font-size: var(--table-header-icon-size); color: inherit; }
.dtab-filter.active { color: var(--table-header-filter-foreground-active); }
.dtab-table thead th[aria-disabled="true"] .dtab-filter { color: var(--table-header-filter-foreground-disabled); }
.dtab-sort:focus-visible, .dtab-filter:focus-visible { outline: var(--table-focus-ring-width) solid var(--table-focus-ring-color); }
.dtab-grip { position: absolute; top: 0; bottom: 0; right: 0; width: var(--table-resize-grip-width); cursor: col-resize; }
.dtab-grip:hover { background: var(--table-resize-grip-color-hover); }
.dtab-grip:focus-visible { outline: 0; background: var(--table-resize-grip-color-focused); }

/* data cells */
.dtab-table td, .dtab-table tbody th { text-align: start; vertical-align: middle; overflow-wrap: anywhere; font: var(--table-cell-text-font);
  padding: var(--table-cell-padding-y) var(--table-cell-padding-x); background: var(--table-cell-background-enabled);
  border-bottom: var(--table-container-border-width) solid var(--table-cell-border-color); }
.dtab-table tbody tr:last-child > * { border-bottom: 0; }
.dtab-table tbody tr:hover > * { background: var(--table-cell-background-hover); }
.dtab-table tbody tr.is-selected > * { background: var(--table-cell-background-selected); }
.dtab-table tbody tr[aria-disabled="true"] > * { background: var(--table-cell-background-enabled); color: var(--table-cell-text-foreground-disabled); }
.dtab-table :is(.dtab-num, .num) { text-align: end; font-variant-numeric: tabular-nums; }
.dtab-table .dtab-truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
.dtab-missing { color: var(--table-missing-foreground); }
.dtab-table .dtab-actions { display: flex; gap: var(--table-row-actions-gap); }
.dtab-table .dtab-expand { width: 1%; padding-inline: var(--table-control-cell-padding-x); }
.dtab-table tbody tr.is-error > :first-child { box-shadow: inset var(--table-row-error-indicator-width) 0 0 0 var(--table-row-error-indicator-color); }
.dtab-table tfoot.dtab-totals td, .dtab-table tfoot.dtab-totals th { padding: var(--table-cell-padding-y) var(--table-cell-padding-x); background: var(--table-totals-background);
  border-top: var(--table-totals-border-width) solid var(--table-totals-border-color); font: var(--table-totals-font); color: var(--table-totals-foreground); text-align: start; }
.dtab.dense thead th { padding-block: var(--table-header-cell-padding-y-dense); }
.dtab.dense :is(td, tbody th) { padding-block: var(--table-cell-padding-y-dense); }
.dtab.striped tbody tr:nth-child(even) > * { background: var(--table-cell-background-striped); }
.dtab.striped tbody tr:nth-child(even):hover > * { background: var(--table-cell-background-hover-striped); }
/* reflow: one block per row, each cell a label/value pair (the identifier cell, without data-label, reads as the title) */
.dtab.reflow :is(table, tbody, tr, td, tbody th) { display: block; }
.dtab.reflow thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.dtab.reflow tbody tr { padding: var(--table-cell-padding-y) var(--table-cell-padding-x); border-bottom: var(--table-container-border-width) solid var(--table-cell-border-color); }
.dtab.reflow :is(td, tbody th) { padding: 0; border: 0; }
.dtab.reflow :is(td, tbody th) + :is(td, tbody th) { margin-top: var(--table-reflow-pair-gap); }
.dtab.reflow td[data-label]::before { content: attr(data-label); display: block; margin-bottom: var(--table-reflow-row-gap);
  font: var(--table-reflow-label-font); color: var(--table-reflow-label-foreground); }
.dtab-person { display: inline-flex; align-items: center; gap: var(--table-cell-gap); }
.dtab-person > span:last-child { display: flex; flex-direction: column; }
.dtab-sub { font: var(--table-cell-subtext-font); color: var(--table-cell-subtext-foreground); }
tr[aria-disabled="true"] .dtab-sub { color: var(--table-cell-text-foreground-disabled); }
.dtab-table .dtab-check, .dtab-table .dtab-act { width: 1%; padding-inline: var(--table-control-cell-padding-x); }
.dtab-table .dtab-check .checkbox { display: flex; }
.dtab-table .dtab-frozen { position: sticky; left: 0; z-index: 1; }
.dtab-table thead th.dtab-frozen { z-index: 3; }
.dtab-table .dtab-frozen-edge { border-right: var(--table-container-border-width) solid var(--table-frozen-border-color); }
.dtab-empty td { color: var(--table-empty-foreground); font: var(--table-empty-font); padding: var(--table-empty-padding-y) var(--table-empty-padding-x); }
.dtab-table tbody tr.dtab-empty:hover > * { background: var(--table-cell-background-enabled); }
.dtab-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* visually hidden caption / header text */

/* Top App Bar (organism) — <header class="tapb [centered|contextual|search|extended] [sharp]"><div class="tapb-row">
     button.btn.icon-btn.subtle.sm (hamburger | close | back)
     · .tapb-title ([<span class="avatar xxs">] + <span>Title</span>) | .tapb-count | button.btn.subtle.sm (count, contextual alt) | Search field (.tapb-search)
     · .tapb-trailing (small subtle icon buttons) </div>[<div class="tapb-title tapb-title-row"><span>Title</span></div> (extended)]</header>
   Rounded by default (.sharp squares the bar only; the controls keep their own shape). */
.tapb { display: flex; flex-direction: column; gap: var(--top-app-bar-container-gap); padding: var(--top-app-bar-container-padding-y) var(--top-app-bar-container-padding-x);
  background: var(--top-app-bar-container-background); border-radius: var(--top-app-bar-container-radius-rounded); }
.tapb.sharp { border-radius: var(--top-app-bar-container-radius-sharp); }
.tapb.extended { gap: var(--top-app-bar-extended-container-gap); }
.tapb-row { display: flex; align-items: center; gap: var(--top-app-bar-leading-gap); }
.tapb-title { flex: 1; min-width: 0; margin: 0; display: flex; align-items: center; gap: var(--top-app-bar-title-gap);
  font: var(--top-app-bar-title-font); color: var(--top-app-bar-title-foreground); }
.tapb-title > span:last-child { min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; } /* wraps to two lines */
.tapb.centered .tapb-title { justify-content: center; font: var(--top-app-bar-centered-title-font); }
.tapb-title-row { padding: 0 var(--top-app-bar-extended-title-padding-x); }
.tapb-count { flex: 1; min-width: 0; font: var(--top-app-bar-count-font); color: var(--top-app-bar-count-foreground); }
.tapb-row > .btn:not(.icon-btn) { margin-right: auto; }
.tapb.search .tapb-row { gap: var(--top-app-bar-search-gap); }
.tapb-search { flex: 1; min-width: 0; }
.tapb-trailing { display: flex; align-items: center; gap: var(--top-app-bar-trailing-gap); flex: none; margin-left: auto; }

/* Vertical Speed Scroller (organism, draft) — measurements are provisional; rows are Contact List Item markup (.lrow.contact-li)
   <div class="vss"><div class="vss-list" tabindex="0" role="region" aria-label="…">…</div>
     <div class="vss-rail" tabindex="0" role="slider" aria-label="Jump to letter" aria-valuemin="0" aria-valuemax="26" aria-valuenow="0" aria-valuetext="A, 2 contacts">
       <span aria-hidden="true">A</span>…<span class="is-off" aria-hidden="true">Q</span>…</div>
     <div class="vss-bubble" aria-hidden="true" hidden></div></div>
   The whole rail is one drag target; the letter under the finger is chosen. Arrow keys / Home / End move the value from the keyboard. Set the height where it's used. */
.vss { position: relative; width: 100%; height: calc(var(--control-target-min) * 10);
  background: var(--vertical-speed-scroller-container-background);
  border: var(--vertical-speed-scroller-divider-width) solid var(--vertical-speed-scroller-container-border-color); overflow: hidden; }
.vss-list { height: 100%; overflow-y: auto; position: relative; padding-right: var(--vertical-speed-scroller-index-width); }
.vss-list:focus-visible, .vss-rail:focus-visible { outline: var(--vertical-speed-scroller-focus-ring-width) solid var(--vertical-speed-scroller-focus-ring-color); outline-offset: calc(-1 * var(--vertical-speed-scroller-focus-ring-width)); }
.vss-head { position: sticky; top: 0; z-index: 1; margin: 0;
  padding: var(--vertical-speed-scroller-section-header-padding-y) var(--vertical-speed-scroller-section-header-padding-x);
  font: var(--vertical-speed-scroller-section-header-font); color: var(--vertical-speed-scroller-section-header-foreground);
  background: var(--vertical-speed-scroller-section-header-background); }
.vss-list ul { margin: 0; padding: 0; list-style: none; }
.vss-list li:not(:last-child) { border-bottom: var(--vertical-speed-scroller-divider-width) solid var(--vertical-speed-scroller-divider-color); }
.vss-rail { position: absolute; top: 0; right: 0; bottom: 0; width: var(--vertical-speed-scroller-index-width); display: flex; flex-direction: column; touch-action: none; user-select: none; cursor: pointer; }
.vss-rail > span, .vss-sample { flex: 1; min-height: 0; display: grid; place-items: center;
  font: var(--vertical-speed-scroller-index-label-font); color: var(--vertical-speed-scroller-index-label-foreground); }
.vss-rail > .is-active, .vss-sample.is-active { font: var(--vertical-speed-scroller-index-label-font-pressed); color: var(--vertical-speed-scroller-index-label-foreground-pressed); }
.vss-rail > .is-off, .vss-sample.is-off { color: var(--vertical-speed-scroller-index-label-foreground-disabled); }
.vss-sample { flex: none; width: var(--vertical-speed-scroller-index-width); }
.vss-bubble { position: absolute; right: calc(var(--vertical-speed-scroller-index-width) + var(--vertical-speed-scroller-bubble-offset)); transform: translateY(-50%);
  min-width: var(--vertical-speed-scroller-bubble-size); height: var(--vertical-speed-scroller-bubble-size); display: grid; place-items: center;
  border-radius: var(--vertical-speed-scroller-bubble-radius); font: var(--vertical-speed-scroller-bubble-font);
  color: var(--vertical-speed-scroller-bubble-foreground); background: var(--vertical-speed-scroller-bubble-background); }

/* Voice Call Pop up (organism, draft) — rendered inline over a mock screen; controls are Comms Button / Icon Button markup.
   The frame height (--_h) is demo-only. The active state adds a Minimise Icon Button (full_screen_exit); the ended state's control is "Close".
   Ongoing (minimised): <div class="vcp ongoing" role="group" aria-label="Ongoing call">
     <button class="vcp-restore" type="button" aria-label="Expand call with Name"><span class="avatar xxs">AB</span>
       <span class="vcp-id"><span class="vcp-title">Name</span><span class="vcp-status">03:12</span></span></button>
     [End call Comms Button, sm]</div>
   a pill floating over every screen (no scrim); the pill itself isn't interactive: its restore button expands the call, and End call is a sibling.
   The transparent border is the edge forced-colours mode draws. */
.vcp-frame { --_h: 384px; position: relative; height: var(--_h); overflow: hidden; display: grid; place-items: center; padding: var(--voice-call-popup-container-gap); }
.vcp-scrim { position: absolute; inset: 0; background: var(--voice-call-popup-scrim-background); }
.vcp { position: relative; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: var(--voice-call-popup-container-gap); padding: var(--voice-call-popup-container-padding);
  background: var(--voice-call-popup-container-background); border: var(--voice-call-popup-container-border-width) solid var(--voice-call-popup-container-border-color);
  border-radius: var(--voice-call-popup-container-radius-rounded); box-shadow: var(--voice-call-popup-container-shadow); }
.vcp.sharp, [data-shape="sharp"] .vcp { border-radius: var(--voice-call-popup-container-radius-sharp); }
.vcp-id { display: flex; flex-direction: column; align-items: center; gap: var(--voice-call-popup-identity-gap); }
.vcp-title { font: var(--voice-call-popup-title-font); color: var(--voice-call-popup-title-foreground); }
.vcp-status { display: inline-flex; align-items: center; gap: var(--voice-call-popup-subtitle-gap);
  font: var(--voice-call-popup-subtitle-font); color: var(--voice-call-popup-subtitle-foreground); }
.vcp-status .icon { font-size: var(--voice-call-popup-subtitle-icon-size); color: inherit; }
.vcp-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--voice-call-popup-controls-gap); }
.vcp.ongoing { position: absolute; inset-inline-end: var(--voice-call-popup-ongoing-inset); bottom: var(--voice-call-popup-ongoing-inset); width: auto;
  flex-direction: row; align-items: center; text-align: start; gap: var(--voice-call-popup-ongoing-gap);
  padding: var(--voice-call-popup-ongoing-padding-y) var(--voice-call-popup-ongoing-padding-x); border-radius: var(--voice-call-popup-ongoing-radius); }
.vcp-restore { display: flex; align-items: center; gap: var(--voice-call-popup-ongoing-gap); padding: 0; border: 0; background: none;
  color: inherit; font: inherit; text-align: start; cursor: pointer; border-radius: var(--voice-call-popup-ongoing-radius); }
.vcp-restore:focus-visible { outline: var(--button-focus-ring-width) solid var(--button-focus-ring-color); outline-offset: var(--voice-call-popup-ongoing-padding-y); }
.vcp.ongoing .vcp-id { align-items: flex-start; gap: 0; }
.vcp.ongoing .vcp-title { font: var(--voice-call-popup-ongoing-title-font); }


/* ═════════════ PROTOTYPE CHROME — not design-system components; never sent to production ═════════════ */

/* Device frame — a Zebra handheld screen, centred on a desktop viewport and filling a phone one. Markup:
   <div class="device-stage">
   <div class="proto-controls">…</div>
   <div class="device">
     <div class="status-bar"><span>9:41</span><span class="status-bar-icons"><svg class="icon">signal</svg><svg class="icon">wifi</svg><svg class="icon">battery</svg></span></div>
     <header>…</header> <main class="device-body">…</main> <footer>…pinned actions</footer>
   </div></div>
   Only .device-body scrolls; header and pinned actions stay put. Use it for handheld prototypes only. */
.device-stage { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-lg); padding-block: var(--space-lg); box-sizing: border-box; background: var(--color-fill-canvas); }
.device { width: min(var(--frame-handheld-width), 100vw); height: min(var(--frame-handheld-height), 100dvh);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  background: var(--color-fill-default); color: var(--color-ink-high); outline: var(--stroke-thin) solid var(--color-line-default); }
.device-body { flex: 1; overflow-y: auto; }

/* Status bar — time at the start, system icons (from icons.json) at the end; follows the frame's light/dark theme. */
.status-bar { flex: none; display: flex; align-items: center; justify-content: space-between;
  height: var(--frame-status-bar-height); padding: 0 var(--space-page); font: var(--type-label-medium); color: var(--color-ink-high); }
.status-bar-icons { display: flex; align-items: center; gap: var(--space-2xs); }
.status-bar .icon { font-size: var(--icon-size-small); color: inherit; }

/* Prototype controls — restart, light/dark: in the page flow above the frame (first child of .device-stage), never over it,
   so they're never mistaken for the design. On a phone the frame fills the screen and the controls sit above it.
   <div class="proto-controls"><button class="btn subtle sm"><span class="btn-label">Restart</span></button><button class="btn subtle sm"><span class="btn-label">Dark</span></button></div> */
.proto-controls { display: flex; gap: var(--space-sm); }
