name: CI - Pull Request
on:
  pull_request_target:
    paths:
      - 'packages/zeta-web/**'
      - 'packages/tokens/**'
      - '.github/workflows/zeta-web-pull-request.yml'

# Pull Request Runs on the same branch will be cancelled
concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  generate-localizations:
    name: Generate localizations.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lit-localize extract
        run: pnpm --filter @zebra-design-system/zeta-web run localize:extract

      - name: Run lit-localize build
        run: pnpm --filter @zebra-design-system/zeta-web run localize:build

      - name: Format code
        run: pnpm --filter @zebra-design-system/zeta-web run prettier

      - name: Run test-count
        run: pnpm --filter @zebra-design-system/zeta-web run test:count

      - name: Check diff
        id: diff
        run: git diff --quiet --ignore-all-space . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add .
          git commit -m "Generated locales"
          git push

  code-quality:
    name: Check the code quality
    needs: [generate-localizations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Quality
        uses: ZebraDevs/web-components-code-quality@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: "packages/zeta-web"
          test-results-path: "src/test/test-results.xml"
          eslint-config-path: "src/eslint.config.mjs"
          test-config-path: "src/test/web-test-runner.config.js"
          lit-analyzer-cmd: "npx lit-analyzer src/components/**/* src/stories/**/* src/mixins/**/* src/test/**/* src/utils/**/* --quiet --format markdown"

