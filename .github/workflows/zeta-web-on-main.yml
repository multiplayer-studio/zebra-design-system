name: CI - On Main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/zeta-web/**'
      - 'packages/foundations/tokens/**'
      - '.github/workflows/zeta-web-on-main.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-qa-demo:
    name: Deploy preview version of the storybook on firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create custom-elements.json
        run: pnpm run analyze

      - name: Build storybook
        run: pnpm run storybook:build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZETA_DS }}"
          channelId: "live"
