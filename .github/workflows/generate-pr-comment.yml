name: Post PR Comment from File

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/pr-comments/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  post-pr-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR info
        id: pr-info
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          HEAD_BRANCH=${{ github.event.pull_request.head.ref }}
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT

      - name: Find latest PR comment file
        id: find-comment-file
        run: |
          BRANCH="${{ steps.pr-info.outputs.head_branch }}"
          # Escape special chars in branch name for glob
          BRANCH_PATTERN=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_-]/_/g')

          # Find latest file matching PR_COMMENT_{BRANCH}_*.md (sort by filename to get latest timestamp)
          LATEST_FILE=$(ls .github/pr-comments/PR_COMMENT_${BRANCH_PATTERN}_*.md 2>/dev/null | sort -V | tail -1)

          if [ -z "$LATEST_FILE" ]; then
            echo "comment_file=" >> $GITHUB_OUTPUT
            echo "::notice::No PR comment file found for branch: $BRANCH"
          else
            echo "comment_file=$LATEST_FILE" >> $GITHUB_OUTPUT
            echo "::notice::Found PR comment file: $LATEST_FILE"
          fi

      - name: Find existing PR comment
        id: find-existing
        if: steps.find-comment-file.outputs.comment_file != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
        run: |
          # Search for existing comment with marker
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments \
            --jq '.[] | select(.body | contains("<!-- PR_COMMENT_MARKER -->")) | .id' | head -1)

          if [ -z "$COMMENT_ID" ]; then
            echo "comment_id=" >> $GITHUB_OUTPUT
          else
            echo "comment_id=$COMMENT_ID" >> $GITHUB_OUTPUT
          fi

      - name: Post or update PR comment
        if: steps.find-comment-file.outputs.comment_file != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          COMMENT_ID: ${{ steps.find-existing.outputs.comment_id }}
        run: |
          COMMENT_BODY=$(cat "${{ steps.find-comment-file.outputs.comment_file }}")

          # Add marker for future identification
          BODY_WITH_MARKER="<!-- PR_COMMENT_MARKER -->
          $COMMENT_BODY"

          if [ -z "$COMMENT_ID" ]; then
            # Create new comment
            gh pr comment $PR_NUMBER --body "$BODY_WITH_MARKER"
            echo "✅ Created new PR comment"
          else
            # Update existing comment
            gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X PATCH -f body="$BODY_WITH_MARKER"
            echo "✅ Updated existing PR comment"
          fi
